                            $ref: '#/components/schemas/DetectResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/detect/stream:
    post:
      tags: [抽牌]
      operationId: appDetectStream
      summary: 问题检测（SSE 流式）
      description: |
        与 detect 相同，但以 SSE 逐段下发。无请求体。
        事件：delta（data:{"text":"片段"}）、done（data:{"text","vendor","model","suggestions"}）、error。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功为 text/event-stream。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流。"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/spread:
    post:
      tags: [牌阵界面, 抽牌]
      operationId: appSelectSpread
      summary: 选择牌阵
      description: 仅 QUESTION_CREATED 可进入 SPREAD_SELECTED。牌阵必须启用。
      parameters:
