# 导入 Apifox（App 端）：项目 → 导入 → OpenAPI，选择本文件 docs/openapi-app.yaml。
# 完整契约（含管理端）见 docs/openapi.yaml。
# 系统路径（/health、/demo、/admin）未收入，是否给 App 导入待确认。
# 服务地址默认 http://127.0.0.1:8080。需要登录的接口在 Headers 加 Authorization: Bearer <accessToken>。
# 分组口径（2026-11-06）：tag 已按 Pixso 定稿「手机界面」总览（节点 619:7）的 UI 模块划分，
#   导入 Apifox 后文件夹=UI 模块。共用接口（如 /quota、/uploads）挂到多个模块下。
#   月度报告/年度运势已补只读接口；语言/关于塔塔 仍无专用 path。
# 说明同时见 docs/README.md。
openapi: 3.0.3
info:
  title: 塔塔 App HTTP API
  version: 1.0.0
  description: |
    由 `server/internal/tata/routes.go` 注册的 **App 端** HTTP 接口。未在该文件出现的路径不在此契约中。完整契约（含管理端）见 `docs/openapi.yaml`。

    **导入 Apifox：** 导入 → OpenAPI，选择 `docs/openapi-app.yaml`。服务器默认 `http://127.0.0.1:8080`（`server/manifest/config/config.yaml` 的 `server.address: ":8080"`）。

    ## 包络
    `writeOK` / `writeErr` 的 JSON 为 `{ "code": 0|1, "message": "", "data": ... }`。
    - `code=0`：成功，HTTP 200，`message` 一般为空字符串。
    - `code=1`：业务失败。经 `writeErr` 或 `h()` 时 HTTP 仍多为 200，`data` 多为 `null`，`message` 为中文原因。
    - 例外：`writeQuotaBlock`、绑定冲突、今日一牌复用也是 HTTP 200 + `code=1`，但 `data` 为结构化对象。
    - 鉴权失败（`h()` 捕获 `authFail`）为 HTTP 401，`message` 为「未登录或令牌无效」。

    经 `decode` 的 JSON 会拒绝未知字段，失败文案为「请求字段不正确」。

    ## 鉴权
    没有匿名登录。
    公开、不需要登录：`GET /preset-questions`、`/spreads`、`/explore/topics`、`/banners`、`/tarotists`、`/campaigns`、`/campaigns/{id}`、`/help/*`，以及 `GET/PUT /onboarding`、`POST /invites/open`。
    未登录占卜不带 `Authorization`，用 `device_id`。创建、列表、详情、选阵、推荐、灵数、灵数补抽和对话记录可以这样调。请求里带了 `Authorization` 但令牌无效，返回 HTTP 401。
    解读、追问、删除、额度、档案、今日一牌必须登录。在 **Headers** 加 `Authorization: Bearer <accessToken>`（Bearer 后面有一个空格）。
    token 只来自邮箱验证码、微信或苹果登录的 `data.accessToken`。首次登录创建账号。不要放进请求体或 Query。
    Access token 为 HS256 JWT，`typ=access`，约 7 天过期。`aud=app`，`sub` 为 `app_users.id`。
    已合并账号（`merged_into` 非空）或不存在的用户会被拒绝。App 登录接口不签发 refresh token。漏带或无效返回 HTTP 401「未登录或令牌无效」。

    全局 CORS 允许头：`Authorization`、`Content-Type`、`Idempotency-Key`、`Accept-Language`、`X-Language`、`Accept`。`OPTIONS` 返回 204，没有单独业务路径。

    ## App 语言（Accept-Language）
    语言偏好**不上云**（无 `profile.locale`）。客户端本地保存；App 请求携带 **`Accept-Language`**（推荐 `zh-Hans`、`zh-Hant`、`en`、`ja`、`ko`），亦可传 **`X-Language`**。未带头或无法识别时按 **`zh-Hans`**。服务端用该头查 `server/internal/tata/i18n/*.json`（简体原文为 key），本地化错误 `message`、额度提示、状态/类型标签、牌名、牌组名、预设问题和固定空状态文案；用户协议与隐私政策正文读 `server/internal/tata/legal/*.md`。运营 CMS（帮助正文、活动详情、占卜师文案）和 AI 解读原文仍按入库语言返回。`error_code` 不随语言变化。

    ## 未配置的价格、验单与占位
    - 种子 SKU：`sub_month` / `sub_year` 已填会员价；`pack_quota_20/60/100` 为额度补充包（20/60/100 元），`quota_grant` 未配置为 null；`unlock_yearly` 年运解锁；牌组是 `deck_year` / `deck_bundle` / `deck_single` / `deck_addon`。接口不编造会员开通赠送额度或补充包额度。
    - `quota_settings.quota_cost` 现为会员每次扣额度的单价，默认为 null。未配置时会员扣费停住：`quota_outcome=quota_cost_unconfigured`，不猜测单次消耗。
    - IAP：订阅发放写入统一 `quota_balance`（累加）；`quota_pack` 仅会员可买；`consumable_pack` 验单失败「塔塔币已下线」。
    - 注册奖励已下线。免费用户扣费顺序：今日免费（全局 1 次）→ 邀请奖励 → 人工补发 → 开通会员。会员只扣统一额度。
    - 恢复购买受 `iap_settings.restore_hook_enabled` 控制（种子默认 true）。`restore_required_first_pack` 只回传，当前 handler 不据此拦截。
    - App P1 占位：兑换记录行字段、活动详情、参与记录、奖励记录均未定稿。列表为空数组，不编造记录。帮助中心按文字稿只保留「使用与占卜」「账号与设置」两类，正文已写入。`POST /push/register` 已注册。
    - 活动列表与帮助中心的「加载失败，请重试」是客户端在请求失败后的状态，重试同一 GET。服务端沿用现有 `code=1` 包络，不另开错误体。
servers:
  - url: http://127.0.0.1:8080
    description: 本机默认（server.address = :8080）
tags:
  - name: 登录
    description: 邮箱验证码、微信、苹果登录。首次登录创建账号，签发 aud=app 的 access JWT，不签发 refresh。没有匿名登录。
  - name: 首页
    description: 首页聚合壳：提示窗、塔罗师、牌阵目录、额度与今日一牌。开始抽牌入口走「抽牌」分组。我的塔罗牌走单独分组。
  - name: 探索
    description: 探索主题与牌阵目录走 GET /explore/topics（含 Yes or No / 二选一等快捷题 quick_questions）。开局仍是 POST /readings，type 或 source 为 explore；后面的选阵和解读与「抽牌」相同。
  - name: 我的中心
    description: 我的页聚合入口（头像资料、会员身份与额度）。改头像走 POST /uploads（folder=misc）再 PUT /profile 的 avatar_url。其余复用档案/额度读接口。
  - name: 我的塔罗牌
    description: 牌组列表是 GET/PUT /deck-preference 的 available。需要解锁的牌组看 GET /deck-shop。点进某一套的 78 张走 GET /cards?deck=。
  - name: 抽牌
    description: 创建占卜、选阵、灵数落牌、解读、追问和对话记录。问题检测在创建前的 POST /question-suggestions。洗牌、切牌、抽牌在客户端完成。
  - name: 牌阵界面
    description: 牌阵目录、阵位和选阵。阵位布局对照 Spread.positions。
  - name: 历史记录
    description: |
      我的占卜列表、详情（进度 + 对话 bubbles）、删除。对话只在 GET /readings/{id}，不再有单独 /messages。
      字段契约：列表/详情共用 Reading；详情另加 reading_id / messages / has_more（见 ReadingDetail、ConversationMessage）。
      列表分页见 ReadingPage（items / has_more / next_cursor / limit）。
      底层 type=explore 同时覆盖「此刻抉择」和「主题占卜」，App 不得用 type 区分二者。
      判断规则：type=explore 且 conversation_type=moment（或 conversation_label=此刻抉择）→ 此刻抉择；
      type=explore 且 conversation_type=theme（或 conversation_label=主题占卜）→ 主题占卜。
      也可看 theme_key：yes_or_no / either_or 为此刻抉择，其余探索主题为主题占卜。
  - name: 日历记录
    description: |
      今日/明日一牌与日历月视图。凡当前用户未删除且 business_date 非空的占卜都进日历：
      daily / normal / tarotist / explore（含此刻抉择与主题占卜），不漏探索。
      日详情项含牌名、正逆位、短文、多张缩略图、占卜师与时分；explore 另看 conversation_type / theme_key。
  - name: 塔塔币购买
    description: 这期没有购买和额度流水接口。塔塔币包已下线。剩余额度看 GET /quota。
  - name: 会员中心
    description: 这期没有验单、商品列表和付费墙。会员身份和剩余额度看 GET /quota。
  - name: 兑换码
    description: 兑换码核销与兑换记录。邀请码也在这个页面提交。记录行字段 fields_confirmed=false，不编造记录。
  - name: 参与活动
    description: 活动列表与详情、参与记录（仍占位）、奖励记录（好友邀请 +3 次）和邀请码。
  - name: 月度报告
    description: 按月汇总探索次数、陪伴天数、关注主题与寄语（寄语截取自当月已完成解读，不编造）。支持保存月报。
  - name: 年度运势
    description: 年运按 Pixso 1034:13493 四步：解锁卖点 → 填出生日期/时间/地点 → 抽十二宫 12 张（自我到潜意识）→ 抽四季 4 张（春夏秋冬）→ 生成报告。路径仍为 /rhythm 与 /domains。年卡免费解锁；单独购买价取 yearly_unlock SKU。卖点四段取 app_config，空则 pending。生成正文走模型，不编造。
  - name: 功能心愿单
    description: 提交功能心愿（含图片上传）。
  - name: 帮助中心
    description: 帮助分类、文章列表与搜索、文章详情。当前是使用与占卜、账号与设置两类，正文已写入。
  - name: 反馈意见
    description: 提交意见反馈（含图片上传）。
  - name: 通知设置
    description: 通知偏好读写、推送设备注册与消息中心（站内信）。今日/明日抽牌为 App 本地通知；优惠/活动等消息类走个推服务端下发（2026-11-06 重启 Q-B1）。系统推送授权仍只在客户端。
  - name: 账号
    description: 登录用户档案读写、头像上传（POST /uploads 再 PUT /profile.avatar_url）、微信/苹果/邮箱绑定、合并确认与注销。无手机号。账号中心头像与昵称走 GET/PUT /profile（nickname 为 name 别名）。注销 POST /auth/cancel 禁止再登录，不物理删除占卜记录。
  - name: 语言
    description: 语言偏好不上云（Q-B2）。无 profile.locale，客户端本地保存，请求携带 Accept-Language / X-Language。
  - name: 关于塔塔
    description: 版本、协议、分享、检查更新等由客户端与静态资源承载，无专用 App 接口。
  - name: 我的小组件
    description: 桌面/锁屏小组件。首版纯客户端渲染（Q-B14），内容复用今日一牌 POST /daily，不单开同步 path。
paths:
  /api/app/v1/auth/email/code:
    post:
      tags: [登录]
      operationId: appSendEmailCode
      summary: 发送邮箱验证码
      description: |
        登录发码不用带 Header。scene=bind 时在 Headers 加 `Authorization: Bearer <accessToken>`。
        scene 为 login / bind。login 时无论邮箱是否已有账号都发码。bind 必须先登录，未登录为 HTTP 401。
        同一邮箱同一 scene 60 秒内只能发一次，同一邮箱每小时最多 10 次。验证码 6 位、5 分钟有效，校验成功后作废。
        邮件走 config.yaml 的 mail SMTP；未配置返回「邮件服务未配置」。不在响应里回验证码。
      parameters:
        - $ref: '#/components/parameters/AuthorizationOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeBody'
            examples:
              成功:
                summary: 登录发码
                value:
                  email: demo@tata.local
                  scene: login
              绑定发码:
                summary: 绑定发码
                value:
                  email: demo@tata.local
                  scene: bind
      responses:
        '200':
          description: code=0 时 data.expires_in 为秒；失败为 ErrorEnvelope。绑定未登录为 HTTP 401。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/EmailCodeResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                成功:
                  summary: 已发送
                  value:
                    code: 0
                    message: ""
                    data:
                      expires_in: 300
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/login:
    post:
      tags: [登录]
      operationId: appLogin
      summary: 邮箱验证码登录
      description: |
        邮箱和验证码必填。首次用验证码登录会创建账号；已有账号则直接登录。不再发放注册奖励。
        先调 POST /auth/email/code，scene=login。已有账号的邮箱也可以发码。验证码不对或过期返回「验证码不正确或已过期」。
        该邮箱曾注销过则「该邮箱已注销，不能重复注册」。账号已注销返回「账号已注销」。
        带 device_id 时，把这台设备上尚未归属账号的占卜挂到这个用户。若该用户已有未结算占卜，会按共享优先级立刻扣一次。
        已有账号成功时 needs_confirm 恒为 false。若未在登录时扣掉未结算占卜，且本周期已用过免费次数，quota_prompt 为「今日免费体验额度已用完，本次记录已保存到历史记录」。
        不签发 refresh。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
            examples:
              成功:
                summary: 邮箱验证码登录
                value:
                  email: demo@tata.local
                  code: "123456"
      responses:
        '200':
          description: code=0 时 data 含 accessToken、id、login=email。首次创建账号时还有 registration_reward_expires_at、reward_note；已有账号还有 needs_confirm、quota_prompt。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/wechat:
    post:
      tags: [登录]
      operationId: appWechat
      summary: 微信身份登录
      description: |
        客户端把微信 SDK 的 code 交给服务端。iOS / Android 共用微信开放平台同一个移动应用。
        服务端用 config.yaml 的 wechat.appId/appSecret 向微信换 openid/unionid（优先存 unionid），再查找或创建用户。
        换票后请求 sns/userinfo 取昵称和 headimgurl。档案 name / avatar_url 为空时写入昵称，并把微信头像下载后经 Upload 落到本机或 OSS（不再把 qlogo 外链写进档案）。已有资料不覆盖。userinfo 失败不挡登录。
        客户端可顺带 nickname / avatar_url / headimgurl；仅在微信接口没返回时作为补全，头像仍只接受微信 CDN 并转存。App 授权 scope 须为 snsapi_userinfo。
        wechat.enabled=false 或凭证空时返回「微信登录未配置」。code 无效返回「微信授权码无效」。
        已注销身份不能再次注册。不再发放注册奖励。成功后会尝试结算未扣费的占卜。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatBody'
            examples:
              成功:
                summary: 微信登录
                value:
                  code: 081abcWeChatCode
      responses:
        '200':
          description: code=0 时 data 含 accessToken、id、reward_consumed、reward_note。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/apple:
    post:
      tags: [登录]
      operationId: appApple
      summary: 苹果身份登录
      description: |
        仅 iOS。安卓没有苹果三方登录。客户端把 Sign in with Apple 的 identity_token 交给服务端。
        服务端用 Apple JWKS 验 RS256，iss 必须是 https://appleid.apple.com，aud 为 apple.clientId（iOS Bundle ID）。
        apple.enabled=false 或 clientId 空时返回「苹果登录未配置」。令牌无效返回「苹果身份令牌无效」。
        验过的 sub 用来查找或创建用户。已注销身份不能再次注册。不再发放注册奖励。
        与微信登录不同：成功响应不调用提问结算，data 只有 accessToken、id、login=apple。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleBody'
            examples:
              成功:
                summary: 苹果登录
                value:
                  identity_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.demo
      responses:
        '200':
          description: code=0 时 data.login 为 apple。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/bind-wechat:
    post:
      tags: [账号]
      operationId: appBindWechat
      summary: 绑定微信
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        需要登录用户。身份空闲则直接绑定，data=true。
        绑定成功或重复绑定同一微信时，若档案 name / avatar_url 为空则写入微信昵称和转存后的头像。
        已被其他账号占用时不搬迁数据，返回「该身份已绑定其他账号」，不创建合并请求。
        换绑未开放。重复绑定同一个微信身份返回 true。请求体同微信登录，传 code 不是 openid。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatBody'
            examples:
              成功:
                summary: 绑定微信
                value:
                  code: 081abcWeChatCode
      responses:
        '200':
          description: 绑定成功 code=0 且 data 为 true。身份已被占用时 code=1，message 为「该身份已绑定其他账号」，data 为 null。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/bind-apple:
    post:
      tags: [账号]
      operationId: appBindApple
      summary: 绑定苹果
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: 规则同绑定微信，身份种类为 apple。请求体同苹果登录，传 identity_token 不是 sub。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleBody'
            examples:
              成功:
                summary: 绑定苹果
                value:
                  identity_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.demo
      responses:
        '200':
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/bind-email:
    post:
      tags: [账号]
      operationId: appBindEmail
      summary: 绑定邮箱
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        邮箱按小写比较。邮箱和验证码必填，不设密码。先调 POST /auth/email/code，scene=bind。
        空闲则写入邮箱。
        冲突时返回「该身份已绑定其他账号」，不创建合并请求。已绑定过邮箱不能换绑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBindBody'
            examples:
              成功:
                summary: 绑定邮箱
                value:
                  email: demo@tata.local
                  code: "123456"
      responses:
        '200':
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/merge-confirm:
    post:
      tags: [账号]
      operationId: appMergeConfirm
      summary: 不提供账号合并
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        各账号独立，不再合并。调用一律返回「不提供账号合并」，不会搬动占卜、额度或身份。
        身份已被其他账号占用时，绑定接口直接返回「该身份已绑定其他账号」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeConfirmBody'
            examples:
              成功:
                summary: 确认合并
                value:
                  merge_request_id: 1
                  confirm: true
      responses:
        '200':
          description: code=0 时 data 为 MergeOutcome。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/MergeOutcome'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/cancel:
    post:
      tags: [账号]
      operationId: appCancel
      summary: 注销账号
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        软删除：设置 cancelled_at，不物理删除账号、占卜、日历或会员记录。把邮箱、微信、苹果、手机号和已记录的设备 ID 写入 identity_claims（小写），并清空这些登录身份与密码。当前 JWT 立刻失效，后续请求返回「账号已注销」。
        同一邮箱、微信、苹果、手机号不能重新注册。设备可以再注册新账号，但邮箱、微信、苹果、手机号、设备里只要有一个曾经注册过，就不发注册赠送，也不能领邀请奖励。会吊销 audience=app 的 refresh（当前 App 登录并不签发 refresh）。已注销再调用返回「账号已注销」。
      responses:
        '200':
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/profile:
    get:
      tags: [账号, 我的中心]
      operationId: appGetProfile
      summary: 读取档案
      parameters:
        - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: 必须登录。必须登录。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/Profile'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [账号]
      operationId: appPutProfile
      summary: 更新档案
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        更新非空的 birth_date、gender、timezone、name、nickname、bio、avatar_url。
        账号中心头像走 POST /uploads（folder 缺省 misc）再 PUT avatar_url；昵称与姓名同一字段，PUT 可传 name 或 nickname。
        账号主展示见 GET 的 account_display（脱敏邮箱）与 public_id。无手机号。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileBody'
            examples:
              成功:
                summary: 更新档案
                value:
                  name: 塔塔用户
                  gender: 不愿透露
                  timezone: Asia/Shanghai
              改头像:
                summary: 先上传再写入 url
                value:
                  avatar_url: /uploads/misc/xxxxxxxx.png
      responses:
        '200':
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/legal:
    get:
      tags: [登录]
      operationId: appLegal
      summary: 用户协议与隐私政策
      description: 公开。正文来自仓库 legal/*.md，按 Accept-Language / X-Language 返回对应语言；body_status 恒为 ready。
      responses:
        '200':
          description: data 为 LegalDocs。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/LegalDocs'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/invites:
    get:
      tags: [兑换码, 参与活动]
      operationId: appGetInvites
      summary: 我的邀请码
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: 必须登录。邀请码是账号 id 的十进制数字。每成功邀请一人，双方各 +3 次，上限 5 人。
      responses:
        '200':
          description: data 为 InviteInfo。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/InviteInfo'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/invites/open:
    post:
      tags: [登录]
      operationId: appOpenInvite
      summary: 打开邀请链接
      description: |
        不需要登录。把邀请码记在这台设备上，等这个设备首次登录创建账号时再入账。
        code 是邀请人账号 id 的十进制数字。device_id 必填。成功 data.source 为 link。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, code]
              properties:
                device_id:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: 成功 data 含 source=link。邀请码不正确时 code=1。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/invites/accept:
    post:
      tags: [兑换码]
      operationId: appAcceptInvite
      summary: 绑定邀请人
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAcceptBody'
      responses:
        '200':
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/cards:
    get:
      tags: [我的塔罗牌]
      operationId: appListCards
      summary: 78 张牌目录
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: deck
          in: query
          schema:
            type: string
          description: 官方 decks.code，或 custom:{id}。省略则用当前选用的牌组。
      responses:
        '200':
          description: data 为 CardCatalog。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/CardCatalog'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/spreads:
    get:
      tags: [首页, 抽牌, 牌阵界面]
      operationId: appListSpreads
      summary: 可用牌阵
      description: |
        只返回 enabled=true。recommended=true 的排前面，其余按 id。公开，不需要登录。
        recommended 对应选阵屏「推荐牌阵」角标。thumbnail 为牌阵示意图完整 URL（相对 /uploads/... 会拼当前请求的 scheme://host）；未配则为内置默认牌背。已是 http(s) 的 CDN 地址不改。
      responses:
        '200':
          description: data 为牌阵数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Spread'
  /api/app/v1/explore/topics:
    get:
      tags: [探索]
      operationId: appExploreTopics
      summary: 探索目录
      description: |
        公开，不需要登录。普通占卜牌阵走 GET /spreads，不在这里。
        不传 theme_key：返回 11 个主题摘要（themes，不含 spreads）。
        传 theme_key：返回该主题详情（含 spreads[].quick_questions / positions）。未知键返回「探索主题不存在」。
        Yes or No / 二选一等入口的快捷预设问题取自对应主题的 quick_questions，不走 GET /preset-questions。
      parameters:
        - name: theme_key
          in: query
          required: false
          schema:
            type: string
            enum: [yes_or_no, either_or, relationship, communication, career, study, interpersonal, shopping, outfit, wellbeing, inner]
          description: 探索主题键。省略则返回主题列表。
      responses:
        '200':
          description: 列表时 data 为 ExploreTopics；带 theme_key 时 data 为 ExploreTheme。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/ExploreTopics'
                          - $ref: '#/components/schemas/ExploreTheme'
  /api/app/v1/preset-questions:
    get:
      tags: [抽牌]
      operationId: appPresetQuestions
      summary: 问题输入页预设题库
      parameters:
        - name: scene
          in: query
          required: false
          schema:
            type: string
            enum: [relationship, career, study, growth, social, life]
          description: 按场景筛选。只传 scene 码，不传中文。非法值返回「场景不正确」。
      description: |
        来源《塔塔_预设问题库_V1》。点击后填入输入框，不直接提交。公开，不需要登录。按场景查询只传 ?scene= 码。

        **featured（首屏默认 15 条，单独数组，混合排列，UI 可不展示分类标签）：**
        1. featured_01 growth 最近的我，最需要关注什么？
        2. featured_02 relationship TA 对这段关系的真实态度是什么？
        3. featured_03 career 接下来三个月，我的事业会有哪些新机会？
        4. featured_04 growth 我现在的情绪困扰，背后隐藏着什么？
        5. featured_05 relationship 我和 TA 接下来一个月的关系会如何发展？
        6. featured_06 life 为了实现这个愿望，我接下来可以做些什么？
        7. featured_07 life 最近有什么值得我留意的新机会？
        8. featured_08 career 我目前的职业方向适合继续坚持吗？
        9. featured_09 relationship 这段关系中，有哪些我还没有看清的事情？
        10. featured_10 life 接下来三个月，我的财务状况会有什么变化？
        11. featured_11 social 我应该如何改善目前的人际关系？
        12. featured_12 life 如果我主动迈出一步，事情会有什么变化？
        13. featured_13 growth 我身上有哪些尚未被发现的优势？
        14. featured_14 life 接下来一个月，我的生活会出现什么新的可能？
        15. featured_15 growth 现在的我，最需要听见什么样的提醒？

        **backup：** 备用题库，文档写 30 条，正文实际 36 条，按文档全量返回。more_per_page=5。
      responses:
        '200':
          description: data 含 featured（首屏 15 条）、backup、scenes、more_per_page。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PresetQuestions'
  /api/app/v1/question-suggestions:
    post:
      tags: [抽牌]
      operationId: appQuestionSuggestions
      summary: 按用户输入做问题检测并推荐问法
      description: |
        创建占卜之前调用，没有占卜 ID。请求体是用户自己输入的句子。
        本地分流：无效 / 具体 / 宽泛，不调用模型。
        无效或具体：只返回类型六（detect），文案随结论变化；具体不生成推荐。
        宽泛：messages 顺序是类型六、十二、十四、四、五；推荐按输入关键词匹配 preset_questions 的 scene/category，
        有时间词时优先保留时间范围生成相关问法，再用同场景题库补满，默认 3 条。不是固定取 featured 前三条。
        用户不选推荐，仍用自己输入的那句去创建。data 只有 has_more 和 messages，没有 reading_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionBody'
            examples:
              成功:
                summary: 自己输入的问题
                value:
                  question: 这是我自己输入的问题
      responses:
        '200':
          description: data 为 has_more 与 messages。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuggestionMessages'
  /api/app/v1/onboarding:
    get:
      tags: [登录]
      operationId: appGetOnboarding
      summary: 新人引导状态
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
      description: |
        公开。冷启动调用。这台设备第一次查询 show_guide 为 true，并记下已经展示过。之后再启动不再出引导：没填档案也一样；已经留下性别/生日/探索偏好、或 guide_completed 为 true，也不再出。PUT 写入档案草稿且未显式传 guide_completed 时，服务端会标成已完成，避免登录后重启又出引导。登录后 reading_trial_available 只看这个账号还有没有那一次解读；老账号换新设备可以再看一次引导，不能再领解读。没有价格。
      responses:
        '200':
          description: data 含 show_guide、guide_completed、reading_trial_available、gender、birth_date、explore_preferences。
    put:
      tags: [登录]
      operationId: appPutOnboarding
      summary: 保存新人引导草稿
      description: |
        公开。写入设备上的引导草稿。guide_completed 不消耗解读资格。
        已登录时会把空着的账号性别/生日/探索偏好用本次草稿补上；未登录草稿在邮箱/微信/苹果登录（带同一 device_id）时同样补进档案。
        账号已有值不覆盖。仍可用 PUT /profile 主动改正式档案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                gender:
                  type: string
                birth_date:
                  type: string
                  description: YYYY-MM-DD。空字符串表示未填。
                explore_preferences:
                  type: array
                  items:
                    type: string
                guide_completed:
                  type: boolean
      responses:
        '200':
          description: 与 GET 相同。
  /api/app/v1/onboarding/abandon:
    post:
      tags: [登录]
      operationId: appAbandonOnboarding
      summary: 放弃新人引导
      description: |
        必须登录。device_id 必填。这台设备或这个账号已经写过引导问题，返回「已填写问题，请同步这次进度」。
        还没写问题则删掉空的引导占卜，并记下这台设备不再领取解读。data.reading_trial_available 为 false。
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id]
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: 成功 data 含 reading_trial_available=false。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/onboarding/sync:
    post:
      tags: [登录]
      operationId: appSyncOnboarding
      summary: 同步新人引导进度
      description: |
        必须登录。把这台设备上还没完成的引导占卜挂到当前账号；没有则新建一条。
        同时会把设备引导草稿里的性别/生日/探索偏好补进仍为空的账号档案（不覆盖已有值）。
        question 必填，最长 200 个码点。status 可省略，或为 QUESTION_CREATED、SPREAD_SELECTED、SHUFFLING、CUTTING、CARDS_FIXED。
        成功 data 为占卜记录。
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, question]
              properties:
                device_id:
                  type: string
                question:
                  type: string
                spread_id:
                  type: integer
                  format: int64
                cards:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                status:
                  type: string
      responses:
        '200':
          description: 成功 data 为占卜记录。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/deck-shop:
    get:
      tags: [我的塔罗牌]
      operationId: appDeckShop
      summary: 牌组商品
      description: |
        公开。ledger 固定为 deck_price，价格单位是分。不返回会员、额度补充包或年运商品。
        未解锁的牌组不会出现在 GET /deck-preference 的 available 里。默认莱德韦特 priced=false，不在售卖列表里。
      responses:
        '200':
          description: data 含 ledger、currency、products、decks、default_deck。
  /api/app/v1/banners:
    get:
      tags: [首页]
      operationId: appListBanners
      summary: 当前首页提示窗
      description: 公开，不需要登录。只返回 start_at <= now < end_at，按 priority、id 降序。
      responses:
        '200':
          description: data 为提示窗数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Banner'
  /api/app/v1/tarotists:
    get:
      tags: [首页, 抽牌]
      operationId: appListTarotists
      summary: 可用塔罗师
      description: 公开，不需要登录。只返回启用中的塔罗师。首页卡字段：name、title/tags、blurb、avatar_url（可空）。不返回人设/禁止项正文。
      responses:
        '200':
          description: data 为塔罗师数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TarotistPublic'
  /api/app/v1/quota:
    get:
      tags: [首页, 我的中心, 塔塔币购买, 会员中心]
      operationId: appQuota
      summary: 当前额度
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录。
        quota_cost 未配置时为 null，quota_cost_configured=false。
        followup_limit 为每条解读可追问次数，种子默认 5，null 不限制。
