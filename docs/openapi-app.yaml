      tags: [牌阵界面, 抽牌]
      operationId: appSelectSpread
      summary: 选择牌阵
      description: |
        仅 QUESTION_CREATED 可进入 SPREAD_SELECTED。牌阵必须启用。
        draw_mode 为 normal 或 numerology，覆盖创建时记下的值。普通占卜仍是空字符串时返回「请先选择抽牌方式」。扣过之后不能再改。
        成功 data 为占卜记录，不是 messages。记录里的 draw_mode 就是这次提交的值。
        未登录不带令牌，query 带 device_id。不要把 device_id 放进请求体。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
