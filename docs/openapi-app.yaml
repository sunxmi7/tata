      summary: 创建占卜
      description: |
        状态从 QUESTION_CREATED 开始。问题最长 200 个码点。返回占卜记录，含 id 和 draw_mode。
        draw_mode 为 normal 或 numerology。还没选可以不传，记录上先是空字符串。探索、塔罗师、今日运势不要带。第一次写成 numerology 时生成这一问的 78 张映射，映射不返回给 App。
        登录用户的 normal / tarotist 在此按共享优先级扣 play；塔罗师首次可走 ai_trial。
        未登录不带令牌，请求体必须有 device_id，不预扣，quota_outcome=anonymous。塔罗师必须登录。
        explore 不在此扣费（quota_outcome=deferred）。
        额度不足时仍 code=0，记录保留，paywall 或 quota_cost_unconfigured 在 data 里，不编造单价。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReadingBody'
            examples:
              成功:
                summary: 创建普通占卜
                value:
