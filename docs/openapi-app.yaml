                  birth_date: "1990-01-01"
                  gender: 不愿透露
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/rhythm:
    post:
      tags: [年度运势]
      operationId: appYearlyRhythm
      summary: 年运选 12 张全年节奏牌
      description: |
        必须已填基本信息。mode=normal 或不传 numbers 为随机抽 12 张（一月至十二月）。
        mode=pick 或只传 numbers 时，numbers 为 12 个不重复的 1–78，映射 Rider-Waite。
        抽完不可重抽。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearlyDrawBody'
            examples:
              成功:
                summary: 抽取节奏牌
                value:
                  mode: normal
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/domains:
    post:
      tags: [年度运势]
      operationId: appYearlyDomains
      summary: 年运抽 6 张六大领域牌
      description: |
        必须已选完 12 张节奏牌。六大领域顺序：感情、事业、财运、健康、人际、成长。
        从剩余 66 张中抽取，不与节奏牌重复。mode 规则同 rhythm。抽完不可重抽。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearlyDrawBody'
            examples:
              成功:
                summary: 抽取领域牌
                value:
                  mode: normal
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/generate:
    post:
      tags: [年度运势]
      operationId: appYearlyGenerate
      summary: 生成年度报告
      description: |
        必须已抽完 12+6。走 interpret 供应商，按牌面生成报告，不编造。
        已生成则原样返回。失败可重试，不改牌面。
        JSON 等完整报告；打字机请用 `/generate/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/generate/stream:
    post:
      tags: [年度运势]
      operationId: appYearlyGenerateStream
      summary: 生成年度报告（SSE 流式）
      description: |
        与 generate 相同的解锁与牌面门槛。已生成则直接 `done`（data 含 report、reused=true）。
        否则以 SSE 逐段下发 interpret 供应商输出。请求体为 `{}`。
        事件：delta（data:{"text":"片段"}）、done（data:{"report": YearlyReport}）、error。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 成功为 text/event-stream。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流。"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/deck-preference:
    get:
      tags: [首页]
      operationId: appGetDeckPreference
      summary: 牌面风格
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录。available 来自已启用牌组；种子仅 rider-waite（莱德韦特）。
        每项含 name / thumbnail / description / tags。介绍与标签未填时为空串和空数组，不编造。
        预览图未配则用内置默认牌背。78 张牌预览由客户端按牌名拼接，不另开 path。
      responses:
        '200':
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DeckPreference'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [首页]
      operationId: appPutDeckPreference
      summary: 更换牌面风格
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: 必须登录。code 须为已启用牌组，否则「该牌面风格尚未开放」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckPreferenceBody'
            examples:
              成功:
                summary: 选择莱德韦特
                value:
                  code: rider-waite
      responses:
        '200':
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DeckPreference'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      description: |
        填 `Bearer ` + 登录/注册/匿名返回的 accessToken。Bearer 后面有一个空格。
        放在 Headers，不要放进请求体。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    AuthorizationOptional:
      name: Authorization
      in: header
      required: false
      description: |
        注册发码不用填。scene=bind 时必填 `Bearer <accessToken>`。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    PathId:
      name: id
      in: path
      required: true
      description: 正整数路径 id。无法解析或小于等于 0 时 HTTP 200、code=1、message 为「id 不正确」。
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        可选。空则不去重。同一 scope 下：首次插入 pending；完成后原样重放当时的 JSON 包络；仍为 pending 时 HTTP 200、code=1、「重复请求处理中」。
        `POST /api/app/v1/readings` 的 scope 为 `user:{id}` 或 `anon:{anonymous_id}`。
        `POST /api/app/v1/readings/{id}/followups` 的 scope 为 `followup:{readingId}`。
      schema:
        type: string
  responses:
    Unauthorized:
      description: HTTP 401。令牌缺失、无效、aud 不匹配，或账号已停用 / 已合并 / 不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 1
            message: 未登录或令牌无效
            data: null
  schemas:
    SuccessMeta:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
          description: 成功固定为 0。
        message:
          type: string
          example: ''
          description: 成功时一般为空字符串。
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 业务失败固定为 1。HTTP 多为 200；鉴权失败为 401。
        message:
          type: string
          description: 失败原因，按 Accept-Language / X-Language 本地化；缺省简体中文。例如「邮箱或密码错误」或 Not logged in or token invalid。
        error_code:
          type: string
          description: |
            稳定错误码，供客户端按码分支（不随语言变化）。有界推进中：
            已归类 unauthorized、invalid_request_body、invalid_path_id、reading_not_found、reading_deleted、reading_forbidden、internal；
            其余尚未归类的业务错误为空字符串，仅凭 message。
        data:
          nullable: true
          description: 普通 writeErr 为 null。配额拦截、绑定冲突、今日一牌复用不用这个 schema。
    BoolOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: boolean
              example: true
              description: 成功为 true。
    Position:
      type: object
      additionalProperties: false
      required: [index, name, meaning]
      properties:
        index:
          type: integer
          description: 阵位序号，从 0 或 1 起，与抽牌 position 对应。
        name:
          type: string
          description: 阵位名，例如「过去」。
        meaning:
          type: string
          description: 阵位含义说明。
    DrawnCard:
      type: object
      properties:
        position:
          type: integer
          description: 该牌所在阵位序号。
        position_name:
          type: string
          description: 阵位名。
        card_id:
          type: integer
          description: 韦特牌序，力量为 VIII、正义为 XI。
        name:
          type: string
          description: 牌名，例如「愚者」。
        orientation:
          type: string
          enum: [upright, reversed]
          description: 正位 upright，逆位 reversed。
    Reading:
      type: object
      description: scanReading / loadReading 的字段。时间是 RFC3339。
      properties:
        id:
          type: integer
          format: int64
          description: 占卜记录 id。
        user_id:
          type: integer
          format: int64
          nullable: true
          description: 归属用户。匿名占卜为 null。
        anonymous_id:
          type: string
          description: 无匿名 id 时为空字符串，不是 null。
        type:
          type: string
          description: normal、tarotist、explore、daily。
        question:
          type: string
          description: 用户问题原文。未填写时为空字符串。
        spread_id:
          type: integer
          format: int64
          nullable: true
          description: 所选牌阵 id。未选阵为 null。
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: 占卜师 id。非占卜师占卜为 null。
        status:
          type: string
          enum: [QUESTION_CREATED, SPREAD_SELECTED, SHUFFLING, CUTTING, CARDS_FIXED, INTERPRETING, COMPLETED,
            FAILED_RETRYABLE]
          description: 占卜状态机。INTERPRETING 后台任务生成中，COMPLETED 已解读，FAILED_RETRYABLE 可重试。
        cards:
          type: array
          nullable: true
          description: 已抽牌列表。尚未抽牌为 null 或空。
          items:
            $ref: '#/components/schemas/DrawnCard'
        interpretation:
          type: string
          nullable: true
          description: 解读正文。未生成时为 null。INTERPRETING 时可能是未完成片段；COMPLETED 为全文。App 退出后再进以 status 为准。
        vendor_name:
          type: string
          nullable: true
          description: 生成解读的供应商名。未生成为 null。
        model_name:
          type: string
          nullable: true
          description: 生成解读的模型名。未生成为 null。
        fail_reason:
          type: string
          nullable: true
          description: 生成失败原因。成功或未失败为 null。
        quota_consumed:
          type: boolean
          description: 数据库标记，表示已扣今日免费次数。注册奖励走 reward_consumed，不在此列表字段中。
        first_experience:
          type: boolean
          description: 是否该用户首次体验占卜。
        created_at:
          type: string
          format: date-time
          description: 创建时间，RFC3339。
        updated_at:
          type: string
          format: date-time
          description: 最近更新时间，RFC3339。
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 软删时间。未删除为 null。
        progress:
          type: string
          description: 给客户端看的进度文案，例如「待选牌阵」。
        continue:
          type: string
          description: 建议的下一步动作名；完成时为空字符串。
        card_name:
          type: string
          description: 第一张牌名。无牌时为空。列表与详情、今日一牌共用。
        short_text:
          type: string
          description: 从 interpretation 截取的一句预览，无解读时为空，不编造。
        status_label:
          type: string
          description: COMPLETED 为「已解读」，其余为「待继续」。
        yi:
          type: string
          nullable: true
          description: 今日一牌「宜」。取 app_config 的 card.{牌名}.yi；未配置为 null。
        card_thumbnail:
          type: string
          nullable: true
          description: 牌面缩略图完整 URL。优先 card.{牌名}.thumbnail，否则 card.thumbnail_template（{id}/{name}），再否则 card.thumbnail_default；都未配置则返回当前服务地址下的内置默认牌背。相对 /uploads/... 会拼 scheme://host。无牌名时为 null。
        target:
          type: string
          description: today 或 tomorrow。仅 daily 响应。
        business_date:
          type: string
          description: 业务日 YYYY-MM-DD。仅 daily 响应。
        has_result:
          type: boolean
          description: 已有牌名时为 true。
    ReadingCreated:
      description: |
        创建占卜在 Reading 之上附加的额度结果。成功包络仍是 code=0。
        登录用户的普通 / 塔罗师占卜在这一步就按共享优先级扣费；explore 推迟到仪式门槛；匿名不预扣。
        额度用尽时记录仍保留（kept=true，generated=false），不会编造钻石单价。
      allOf:
        - $ref: '#/components/schemas/Reading'
        - type: object
          properties:
            quota_exhausted:
              type: boolean
              description: 额度不足以继续生成时为 true。记录仍可能保留。
            quota_consumed:
              type: boolean
              description: 本次是否扣了今日免费次数。
            reward_consumed:
              type: boolean
              description: 本次是否扣了注册奖励。
            needs_confirm:
              type: boolean
              description: 当前实现恒为 false。
            quota_outcome:
              type: string
              enum: [charged, already, paywall, diamond_cost_unconfigured, anonymous, deferred]
              description: 额度结算结果。charged 已扣、already 此前已扣、paywall 待付费、anonymous 匿名不预扣、deferred 推迟到仪式门槛。
            entitlement:
              type: string
              description: |
                可能为空。取值：registration_reward、daily_free、admin_grant_free、diamond_pack、diamond_subscription、ai_trial。
            paywall:
              type: boolean
              description: 需要付费墙时为 true。
            diamond_cost_unconfigured:
              type: boolean
              description: 走到钻石步但单价未配置时为 true，本次不扣钻石。
            kept:
              type: boolean
              description: 额度不足时记录是否保留。拦截场景一般为 true。
            generated:
              type: boolean
              description: 是否已生成解读。拦截时为 false。
            quota_prompt:
              type: string
              description: 仅在额度用尽且决策带有文案时出现。
    ReadingOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Reading'
              description: 单条占卜。
    ReadingListOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              description: 占卜数组。无记录时为空数组。
              items:
                $ref: '#/components/schemas/Reading'
    ReadingPage:
      type: object
      description: 占卜列表的游标分页结果。
      properties:
        items:
          type: array
          description: 本页占卜。无记录时为空数组。
          items:
            $ref: '#/components/schemas/Reading'
        has_more:
          type: boolean
          description: 是否还有更早的记录。
        next_cursor:
          type: integer
          format: int64
          description: 下一页的 before_id。has_more=false 时为 0。
        limit:
          type: integer
          description: 本页请求的条数上限。
    ReadingCreatedOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReadingCreated'
              description: 新建占卜及其额度结果。
    QuotaBlock:
      type: object
      properties:
        reading_id:
          type: integer
          format: int64
          description: 被拦截的占卜 id。记录一般已保留。
        quota_outcome:
          type: string
          enum: [paywall, diamond_cost_unconfigured]
          description: paywall 钻石不足待付费；diamond_cost_unconfigured 单价未配置。
        entitlement:
          type: string
          description: 本应扣的权益种类，可能为空。
        paywall:
          type: boolean
          description: 需要弹出付费墙时为 true。
        diamond_cost_unconfigured:
          type: boolean
          description: diamond_cost 未配置时为 true，本次不扣钻石。
        kept:
          type: boolean
          example: true
          description: 记录是否保留。拦截时为 true。
        generated:
          type: boolean
          example: false
          description: 是否已生成。拦截时为 false。
    QuotaBlockEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 额度拦截固定为 1。
        message:
          type: string
          description: |
            paywall：「今日免费次数已用完，钻石不足，请付费后自动继续；取消则保留记录且不继续生成」。
            未配置：「今日免费次数已用完，钻石消耗未配置，本次未扣钻石，记录已保留」。
        data:
          $ref: '#/components/schemas/QuotaBlock'
          description: 拦截详情。
    Spread:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 牌阵 id。
        name:
          type: string
          description: 牌阵名，例如「时间流」。
        description:
          type: string
          description: 牌阵介绍。未填为空字符串。
        card_count:
          type: integer
          description: 需要抽取的牌数。
        positions:
          type: array
          description: 阵位列表，长度等于 card_count。
          items:
            $ref: '#/components/schemas/Position'
        enabled:
          type: boolean
          description: 是否对 App 可见。目录接口只返回启用中的。
        charged:
          type: boolean
          description: 该牌阵是否计入收费占卜。
        recommended:
          type: boolean
          description: 选阵屏「推荐牌阵」角标。全表最多一张为 true。未推荐为 false，不编造。
        thumbnail:
          type: string
          description: 选阵屏牌阵示意图完整 URL。未配置时为当前服务地址下的内置默认牌背，例如 http://127.0.0.1:8080/uploads/card-default.png。已配置的 http(s) 地址原样返回。
    Banner:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 提示窗 id。
        copy:
          type: string
          description: 提示窗文案。
        start_at:
          type: string
          format: date-time
          description: 生效开始时间。接口只返回当前有效的。
        end_at:
          type: string
          format: date-time
          description: 生效结束时间。
        priority:
          type: integer
          description: 越大越靠前。
        target:
          type: string
          description: 点击跳转目标，可空。
    TarotistPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 占卜师 id。创建占卜 type=tarotist 时用这个。
        name:
          type: string
          description: 占卜师姓名。
        display_copy:
          type: string
          description: 对外展示文案，首页标签与简介缺省时回退这里。
        title:
          type: string
          description: 首页列表标签文案，与 display_copy 相同。
        tags:
          type: array
          description: 首页标签。未填为空数组。
          items:
            type: string
        blurb:
          type: string
          description: 首页简介。缺省时回退 display_copy。不返回人设/禁止项正文。
        avatar_url:
          type: string
          nullable: true
          description: 未配置时为 null，不编造头像地址。
    QuotaView:
      type: object
      description: |
        用户可见「次数」与「钻石」分开。扣减顺序固定：注册奖励 → 今日免费次数 → 人工补发免费次数 → 钻石 → 付费等待。
        钻石先扣 pack（consumable），再扣 subscription，单次不拆桶。
        diamond_cost 未配置时为 null，不会出现猜测出来的单价。
        followup_limit 为每条解读可追问次数，种子默认 5，null 不限制。
      properties:
        cycle:
          type: string
          description: 业务日，默认按用户时区、重置点为北京时间 08:00。
          example: '2026-10-26'
        reset_at:
          type: string
          example: 北京时间 08:00
          description: 今日免费次数重置点的展示文案。
        daily_free_used:
          type: boolean
          description: 今日免费次数是否已用完。
        daily_free_count:
          type: integer
          example: 1
          description: 每个业务日的免费次数配额。管理端 quota-params 可改，默认 1。
        daily_slot_count:
          type: integer
          example: 1
          description: 每个业务日可抽今日一牌（含明日运势）的次数。管理端可改，默认 1。
        daily_free_remaining:
          type: integer
          description: 今日免费次数剩余。
        daily_used_flags:
          type: integer
          description: 今日已占用的免费次数标记位数，内部计数。
        reward_remaining:
          type: integer
          description: 注册奖励剩余次数。
        admin_grant_free_remaining:
          type: integer
          description: 人工补发的免费次数剩余。
        subscription_prompt_required:
          type: boolean
          description: 合并账号后订阅需要用户选择时为 true。
        free_label:
          type: string
          example: 次数
          description: 免费次数在 UI 上的名称。
        paid_label:
          type: string
          example: 钻石
          description: 付费额度在 UI 上的名称（与 display_label 塔塔币对应账本单位）。
        priority:
          type: string
          example: 注册奖励 → 今日免费次数 → 人工补发免费次数 → 钻石 → 付费
          description: 扣减顺序说明文案。
        diamond_spend_order:
          type: string
          example: pack_then_subscription
          description: 钻石先扣消耗包再扣订阅余额。
        diamond_cost:
          type: integer
          nullable: true
          description: quota_settings.diamond_cost。未配置为 null。
        diamond_cost_configured:
          type: boolean
          description: diamond_cost 是否已配置。false 时走到钻石步会停住。
        subscription_diamonds:
          type: integer
          description: 订阅桶钻石余额。
        pack_diamonds:
          type: integer
          description: 消耗包桶钻石余额。
        display_label:
          type: string
          example: 塔塔币
          description: UI 展示名。账本单位仍是钻石。
        balance:
          type: integer
          description: pack_diamonds + subscription_diamonds。我的页余额用这个合计。
        followup_limit:
          type: integer
          nullable: true
          description: 每条解读可追问次数。种子默认 5；null 表示不限制。
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户数字 id，服务端主键。不是公开短 ID。
