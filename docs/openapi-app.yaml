  /api/app/v1/readings:
    get:
      tags: [历史记录]
      operationId: appListReadings
      summary: 我的占卜列表
      description: |
        已登录按 user_id。未登录不带令牌，用 query device_id，只返回这台设备上尚未归属账号的记录。不含已删除。按 id 降序。
        游标分页：limit 默认 20、上限 100；用上一页的 next_cursor 作为下一页的 before_id。可按 type 过滤。
        每条带 conversation_type（daily / moment / theme）与 conversation_label，以及按对话类型区分的 stage / stage_label；
        同时保留原 status / progress / continue / status_label。daily 另带 target（today/tomorrow）与 business_date。

        App 区分入口（必读）：
        - type 只有 normal / tarotist / explore / daily 四种；explore 一种 type 覆盖两个探索入口。
        - 此刻抉择：type=explore 且 conversation_type=moment（conversation_label=此刻抉择；theme_key 为 yes_or_no 或 either_or）。
        - 主题占卜：type=explore 且 conversation_type=theme（conversation_label=主题占卜；theme_key 为其余探索主题）。
        - 不要用 type==explore 单独判断是哪一种；moment 还可能是普通占卜/占卜师，需同时看 type。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 每页条数。空或非法用 20，超过 100 截到 100。
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 游标：只返回 id 小于该值的记录。首页省略。非正数返回「before_id 不正确」。
        - name: type
          in: query
          required: false
          schema:
