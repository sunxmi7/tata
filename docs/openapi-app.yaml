        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/explore/topics:
    get:
      tags: [探索]
      operationId: appExploreTopics
      summary: 探索目录
      parameters:
        - $ref: '#/components/parameters/Authorization'
