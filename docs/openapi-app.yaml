          type: string
          description: |
            MATCHED（命中 1 套）、NO_MATCH、NO_MATCH_MAIN_INTENT（无 supported D/C 覆盖主要诉求）、
            INPUT_NOT_MATCHABLE（无效/宽泛/快照不完整）。旧值 RECOMMENDED 已改为 MATCHED。
          enum: [MATCHED, NO_MATCH, NO_MATCH_MAIN_INTENT, INPUT_NOT_MATCHABLE]
        mapping_status:
          type: string
          description: 能力映射配置状态；当前嵌入 draft_v1（PRD §6.4 草案，priority 为 draft_accepted_by_product）。
        detection_status:
          type: string
          description: 问题检测状态 invalid / broad / specific。
        main_intent:
          type: string
          description: 主要诉求代码，如 I01、I04A。
        main_structure:
          type: string
          description: 主结构代码，如 S01、S02。
    CreateReadingBody:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          description: |
            最长 200 个码点。超长文案为「问题超过 200 个码点，正式计数口径尚未确认」。
            explore 主题占卜可空；解读时按主题分类与牌阵生成，不代填 question。
        type:
          type: string
          description: 省略或空字符串时为 normal。只允许 normal、tarotist、explore。
          enum: ['', normal, tarotist, explore]
        source:
          type: string
          description: |
            explore：把 normal/explore 记为 explore，并跳过检测。
            preset：跳过检测。
            其他字符串没有额外效果。
        theme_key:
          type: string
          description: |
            仅 explore 可传。写入 readings.theme_key，用于历史区分「此刻抉择」与「主题占卜」。
            yes_or_no / either_or → conversation_type=moment（此刻抉择）；其余已知主题 → theme（主题占卜）。
            创建时可空，选阵后若为空则从 spreads.theme_key 回填。非法键返回「探索主题不存在」；非 explore 传了返回「主题键不正确」。
          enum: ['', yes_or_no, either_or, relationship, communication, career, study, interpersonal, shopping, outfit, wellbeing, inner]
        skip_detect:
          type: boolean
          description: true 时跳过问题检测。source=preset / explore 时也会跳过。
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: type=tarotist 时必填，且塔罗师必须启用。
        draw_mode:
          type: string
          enum: ['', normal, numerology]
          description: 普通占卜的抽牌方式。不传记为空字符串。探索、塔罗师、今日运势不要带。
        device_id:
          type: string
          description: 未登录必填。已登录选填，用来记下这台设备。缺了返回「缺少设备标识」。
    QuestionBody:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
    SpreadSelectBody:
      type: object
      additionalProperties: false
      required: [spread_id]
      properties:
        spread_id:
          type: integer
          format: int64
          description: 牌阵 id（来自 spread-choices 的 spreads[].id 或牌阵目录）。
        draw_mode:
          type: string
          enum: [normal, numerology]
          description: |
            normal=常规抽牌，numerology=灵数抽牌。覆盖创建时记下的值。
            普通占卜仍是空字符串时不扣费，返回「请先选择抽牌方式」。扣过之后不能再改。
    DrawBody:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          description: normal 随机抽牌；numerology 按 numbers 映射牌面。
          enum: [normal, numerology]
        numbers:
          type: array
          items:
            type: integer
          description: mode=numerology 时必填。1–78 的整数、同一轮不重复。个数必须等于当前牌阵张数。数字对应这一问已保存的映射，不是固定牌序。
    ConfirmQuotaBody:
      type: object
      additionalProperties: false
      properties:
        consume:
          type: boolean
          description: 省略、非法 JSON 或 false：不扣额度，记录保留。true：按共享优先级扣一次 play。
    PaywallBody:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [cancel, resume]
          description: |
            cancel：把 pending / unconfigured 的 paywall 标为 cancelled，不生成。
            resume：再次尝试扣费并继续当时挂起的动作（洗牌、抽牌、解读、今日一牌、追问）。余额或单价仍不足时该任务不会出现在结果里。
    FollowupBody:
      type: object
      additionalProperties: false
      required: [text, continuation]
      properties:
        text:
          type: string
        continuation:
          type: boolean
          description: |
            false：另开一条 normal 占卜，本接口不扣费（charged_here=false），新记录自己的创建逻辑会扣。
            true：必须已经完成解读且牌面已固定，登录后按共享优先级扣 followup:{turn}。
    WorkflowBody:
      type: object
      description: 正文可省略。解析失败时按「有没有牌面」选择默认步骤。未知字段不会被拒绝。
      properties:
        steps:
          type: array
          items:
            type: string
          description: |
            已知步骤为 detect、rewrite、recommend、interpret、tarotist。
            空数组时：还没有牌面则 detect、rewrite、recommend；已有牌面则 interpret。
            interpret / tarotist 会调用 generate 并写库。其余已知步骤不落库。
            未知字符串不会让整个请求失败，对应 step.error 为「未知步骤」。
    DailyBody:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: 省略或 today 为今日一牌；tomorrow 为明日运势。其他值拒绝。
          enum: ['', today, tomorrow]
        cards:
          type: array
          description: |
            可选。App 本地抽好的牌面；传了就按这张牌生成解读，不再服务端重抽。
            今日/明日只收 1 张。每项至少 name、orientation（upright|reversed）；position_name 可省略。
            不传或空数组时由服务端抽一张。
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, orientation]
            properties:
              position:
                type: integer
              position_name:
                type: string
              card_id:
                type: integer
              name:
                type: string
              orientation:
                type: string
                enum: [upright, reversed]
    EmailCodeBody:
      type: object
      additionalProperties: false
      required: [email, scene]
      properties:
        email:
          type: string
          description: 必填。收验证码的邮箱。服务端转小写后比较；含空格或格式不对返回「邮箱不正确」。
        scene:
          type: string
          description: |
            必填。发码场景：
            login 邮箱验证码登录（未注册邮箱首次登录即创建账号），已有账号也可以发码；
            bind 绑定邮箱，必须先登录，未登录为 HTTP 401。
            同一邮箱同一 scene 60 秒内只能发一次，每小时最多 10 次。
          enum: [login, bind]
      example:
        email: demo@tata.local
        scene: login
    EmailCodeResult:
      type: object
      properties:
        expires_in:
          type: integer
          description: 验证码有效秒数，固定 300。响应里不回验证码，验证码只在邮件正文。
    LoginBody:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          description: 必填。登录邮箱，按小写比较。未注册时用验证码登录会创建账号。
        code:
          type: string
          description: 必填。邮箱验证码，6 位数字，5 分钟有效。先调 POST /auth/email/code 且 scene=login。不对或过期返回「验证码不正确或已过期」。
        device_id:
          type: string
          description: 选填。登录时把这台设备上尚未归属账号的占卜挂到这个用户，并记下设备。
        invite_code:
          type: string
          description: 选填。邀请人账号 id 的十进制数字。校验失败不挡登录。同一账号只能绑定一次。
        invite_source:
          type: string
          description: 选填。link 表示从邀请链接来，其他值按手填邀请码。
    WechatBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: 必填。微信开放平台移动应用 SDK 返回的临时授权码。iOS / Android 共用同一套 appId。服务端拿它向微信换 openid 或 unionid，客户端不要传 openid。
        device_id:
          type: string
          description: 选填。登录时把这台设备上尚未归属账号的占卜挂到这个用户。
        invite_code:
          type: string
          description: 选填。邀请人账号 id 的十进制数字。校验失败不挡登录。
        invite_source:
          type: string
          description: 选填。link 表示从邀请链接来，其他值按手填邀请码。
        nickname:
          type: string
          description: 选填。微信接口没返回昵称时写入档案。已有 name 不覆盖。
        avatar_url:
          type: string
          description: 选填。微信头像 URL。服务端下载后转存，不直接保存外链。仅允许 qlogo.cn / qpic.cn。
        headimgurl:
          type: string
          description: 选填。与 avatar_url 相同，兼容微信字段名。avatar_url 优先。
    AppleBody:
      type: object
      additionalProperties: false
      required: [identity_token]
      properties:
        identity_token:
          type: string
          description: 必填。仅 iOS。Sign in with Apple 返回的 identity_token（JWT）。服务端用 Apple JWKS 校验后取 sub，客户端不要传 sub。安卓没有苹果登录。
        device_id:
          type: string
          description: 选填。登录时把这台设备上尚未归属账号的占卜挂到这个用户。
        invite_code:
          type: string
          description: 选填。邀请人账号 id 的十进制数字。校验失败不挡登录。
        invite_source:
          type: string
          description: 选填。link 表示从邀请链接来，其他值按手填邀请码。
    EmailBindBody:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          description: 必填。要绑定的邮箱，按小写比较。已绑过邮箱不能换绑。
        code:
          type: string
          description: 必填。邮箱验证码。先调 POST /auth/email/code 且 scene=bind。不对或过期返回「验证码不正确或已过期」。
    MergeConfirmBody:
      type: object
      additionalProperties: false
      required: [merge_request_id, confirm]
      properties:
        merge_request_id:
          type: integer
          format: int64
        confirm:
          type: boolean
          description: false 时直接拒绝，不合并。
    BindConflict:
      type: object
      properties:
        bound:
          type: boolean
          example: false
          description: 当前请求是否已绑定成功。冲突时为 false。
        conflict:
          type: boolean
          example: true
          description: 该身份已被其他未注销账号占用。
        merged:
          type: boolean
          example: false
          description: 是否已经合并。冲突响应里为 false。
        confirm_required:
          type: boolean
          example: true
          description: 历史字段。绑定接口已不再返回本对象。
        merge_request_id:
          type: integer
          format: int64
          description: 历史字段。绑定接口已不再创建合并请求。
        primary_user_id:
          type: integer
          format: int64
          description: 当前登录用户，合并后的主账号。
        secondary_user_id:
          type: integer
          format: int64
          description: 占用该身份的另一个账号。
        identity_kind:
          type: string
          enum: [wechat, apple, email]
          description: 发生冲突的身份种类。
    BindConflictEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 绑定冲突固定为 1。
        message:
          type: string
          example: 身份已被其他账号占用，需要确认后才会合并
          description: 冲突说明。
        data:
          $ref: '#/components/schemas/BindConflict'
          description: 冲突详情，含 merge_request_id。
    MergeParties:
      type: object
      properties:
        primary_user_id:
          type: integer
          format: int64
          description: 主账号 id。
        secondary_user_id:
          type: integer
          format: int64
          description: 被合并的次账号 id。
        surviving_user_id:
          type: integer
          format: int64
          description: 仅 after 中出现，等于主账号。
    MergeOutcome:
      type: object
      description: |
        只在 confirm=true 且合并成功（或已经合并、重放保存结果）时作为 data。
        钻石余额会在库内加总到主账号并迁移 quota_ledger，但本对象不返回钻石数量。iap_orders 不改写。
        次账号的 App refresh（若有）会被吊销，之后次账号 access 也会因 merged_into 失效。
      properties:
        merged:
          type: boolean
          description: 是否已合并。成功或重放为 true。
        before:
          $ref: '#/components/schemas/MergeParties'
          description: 合并前双方 id。
        after:
          $ref: '#/components/schemas/MergeParties'
          description: 合并后双方 id，surviving 等于主账号。
        confirm_at:
          type: string
          format: date-time
          description: 确认合并的时间。
        reward_before_primary:
          type: integer
          description: 合并前主账号注册奖励剩余。
        reward_before_secondary:
          type: integer
          description: 合并前次账号注册奖励剩余。
        reward_remaining:
          type: integer
          description: 合并后主账号注册奖励剩余（两者相加）。
        daily_free_remaining:
          type: integer
          description: 合并后今日免费次数剩余。
        daily_used_flags:
          type: integer
          description: 合并后今日已用标记。
        daily_slot_remaining:
          type: integer
          description: 合并后今日免费槽剩余。
        daily_slot_used:
          type: integer
          description: 合并后今日免费槽已用。
        readings_moved:
          type: integer
          format: int64
          description: 从次账号迁到主账号的占卜条数。
        messages_kept:
          type: integer
          format: int64
          description: 保留的对话消息条数。
        subscription_resolution:
          type: string
          enum: [none, selected, prompt_required]
          description: none 双方无订阅；selected 已选定一方；prompt_required 需要用户选。
        subscription_prompt_required:
          type: boolean
          description: 两边都有订阅、需要客户端提示选择时为 true。
        subscription_winner_id:
          type: integer
          format: int64
          description: 保留订阅的用户 id。无需选择时为胜出方。
        identity_prompt_required:
          type: boolean
          description: 两边同一槽都有身份、需要客户端提示时为 true。
        retained_identities:
          type: array
          items:
            type: string
          description: 主账号该槽已占用时留下的身份，形如 wechat:openid。
    IAPVerifyBody:
      type: object
      additionalProperties: false
      required: [platform, product_id, transaction_id, receipt]
      properties:
        platform:
          type: string
          enum: [app_store, play]
        product_id:
          type: string
          description: 必须能映射到 iap_skus 的商店商品号。种子 SKU 的商品号为 null，直接验单会得到「商品未映射」。
        transaction_id:
          type: string
          maxLength: 128
        original_transaction_id:
          type: string
          description: 可省略，省略时等于 transaction_id。
        receipt:
          type: string
          maxLength: 8192
          description: 非空即可进入本地映射。服务端不向商店验票，只存 SHA-256。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅桶必填，RFC3339。消耗型可省略。
        purchased_at:
          type: string
          format: date-time
          nullable: true
    IAPRestoreBody:
      type: object
      additionalProperties: false
      required: [purchases]
      properties:
        platform:
          type: string
          enum: [app_store, play]
          description: 单笔 purchase 未写 platform 时继承这里。
        purchases:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/IAPVerifyBody'
    IAPSubscription:
      type: object
      nullable: true
      properties:
        status:
          type: string
          description: 订阅状态，例如 active。无订阅时整个对象为 null。
        sku_kind:
          type: string
          nullable: true
          description: 当前订阅 SKU 种类，如 year_subscription。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅到期时间。
        auto_renew:
          type: boolean
          nullable: true
          description: 是否自动续订。本地验单时可能为 null。
    IAPOrderSnapshot:
      type: object
      description: |
        本地验单结果。verify_status=verified 只表示商品映射通过，不是商店回执。
        credit_status=amount_unconfigured 表示发放额度未配置，对应 credited_quota 为 null，余额不变。
        同一 platform+transaction_id 再次提交且已 verified 时 idempotent=true，不重复入账。
      properties:
        order_id:
          type: integer
          format: int64
          description: 本地订单 id。尚未落单的失败项可能没有。
        user_id:
          type: integer
          format: int64
          description: 入账用户 id。
        idempotent:
          type: boolean
          description: 同一 platform+transaction_id 已 verified 时为 true，不重复入账。
        unit:
          type: string
          example: quota
          description: 账本单位。额度是 quota。
        sku_code:
          type: string
          description: 映射到的 iap_skus.code。
        sku_kind:
          type: string
          description: SKU 种类，见 IAPSKU.kind。
        platform:
          type: string
          description: app_store 或 play。
        product_id:
          type: string
          description: 商店商品号，按此映射 SKU。
        store_transaction_id:
          type: string
          description: 商店交易号。
        original_transaction_id:
          type: string
          description: 原始交易号。订阅续期时用来找同一订阅。
        verify_status:
          type: string
          enum: [pending, verified, failed]
          description: verified 只表示商品映射通过，不是商店回执。
        credit_status:
          type: string
          enum: [none, credited, amount_unconfigured, skipped_expired, deferred]
          description: credited 已入账；amount_unconfigured 发放量未配置；skipped_expired 订阅已过期未入账；deferred 当前周期未结束，下一期额度尚未入账。
        credited_quota:
          type: integer
          nullable: true
          description: 会员或补充包本次入账额度。年运、牌组、未配置为 null。
        period_start:
          type: string
          format: date-time
          nullable: true
          description: 订阅周期开始。消耗型为 null。
        period_end:
          type: string
          format: date-time
          nullable: true
          description: 订阅周期结束。消耗型为 null。
        source:
          type: string
          enum: [verify, restore]
          description: 来自验单还是恢复购买。
        verify_message:
          type: string
          description: 验单说明或失败原因。成功可为空。
        quota_remaining:
          type: integer
          description: 入账后统一额度。
        subscription:
          $ref: '#/components/schemas/IAPSubscription'
          description: 当前订阅摘要。无订阅为 null。
        resumed_tasks:
          type: array
          description: 仅当本次 credit_status=credited 且存在可继续的 paywall 时出现。
          items:
            $ref: '#/components/schemas/ResumedTask'
        transaction_id:
          type: string
          description: 单笔失败、尚未形成订单快照时，restore 结果里可能只有这个字段。
        message:
          type: string
          description: 单笔失败时的原因。成功快照一般不出现。
    IAPSKU:
      type: object
      description: |
        价位：会员月/年卡、额度补充包（仅会员目录可见）、年运解锁。consumable_pack（塔塔币）已下线。
        种子已填设计价（分）和 App Store 占位商品号；管理员改过的值保留。
        kind：month_subscription（会员月卡）、year_subscription（会员年卡）、quota_pack（额度补充包）、consumable_pack（已下线）、yearly_unlock（年运解锁）。
      properties:
        id:
          type: integer
          format: int64
          description: SKU id。
        code:
          type: string
          description: 内部编码，例如 sub_month、pack_60。
        kind:
          type: string
          enum: [month_subscription, year_subscription, quota_pack, yearly_unlock, deck_year, deck_bundle, deck_single, deck_addon]
          description: 价位种类。会员月/年卡、额度补充包、年运单买、牌组。
        display_name:
          type: string
          description: 客户端展示名。
        app_store_product_id:
          type: string
          nullable: true
          description: App Store 商品 ID。验单按票据 product_id 映射本列。种子为占位编码（tata.membership.month 等），上架前换成 Connect 正式 ID。
        play_product_id:
          type: string
          nullable: true
          description: Google Play 商品 ID。未配置为 null。
        price_amount_minor:
          type: integer
          format: int64
