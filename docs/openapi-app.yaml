                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/detect:
    post:
      tags: [抽牌]
      operationId: appDetect
      summary: 问题检测
      description: |
        用绑定的 detect 任务跑模型。无请求体。
        成功后把 skip_detect 置为 false。suggestions 固定为 3。
        模型错误以业务错误返回 step.Error，不写解读正文。
        需要打字机效果时用 `/detect/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: code=0 时 data 为检测文本。
