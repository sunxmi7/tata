        cancelled:
          type: boolean
          description: action=cancel 时为 true。
        kept:
          type: boolean
          description: 占卜记录是否保留。
        generated:
          type: boolean
          description: resume 成功后是否已生成。
        reading_id:
          type: integer
          format: int64
          description: 相关占卜 id。
        resumed_tasks:
          type: array
          description: resume 且扣费成功时继续的任务。cancel 时为空。
          items:
            $ref: '#/components/schemas/ResumedTask'
    AppWorkflowResult:
