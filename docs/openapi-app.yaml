                  spread_id: 1
      responses:
        '200':
          description: 成功 data 为 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/shuffle:
    post:
      tags: [抽牌]
      operationId: appShuffle
      summary: 洗牌
      description: |
        登录用户先过 play 额度门槛，不够则返回 QuotaBlockEnvelope（code=1），状态不变。
        匿名不预扣。成功把 SPREAD_SELECTED 改为 SHUFFLING。无请求体。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功为 Reading；额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/cut:
    post:
      tags: [抽牌]
      operationId: appCut
      summary: 切牌
      description: 仅 SHUFFLING 可进入 CUTTING。不再次扣费。无请求体。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功 data 为 Reading。状态不对时「请先洗牌」。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/draw:
    post:
      tags: [抽牌, 牌阵界面]
      operationId: appDraw
      summary: 抽牌
      description: |
        登录用户先过 play 额度门槛。状态须为 SPREAD_SELECTED 或 CUTTING。
        SHUFFLING 会提示先切牌。mode 为 normal（随机）或 numerology（灵数 1–78 不重复、个数=牌位数，映射 Rider-Waite 顺序，正位）。
        成功后状态 CARDS_FIXED。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrawBody'
            examples:
              成功:
                summary: 随机抽牌
                value:
                  mode: normal
      responses:
        '200':
          description: 成功为 Reading；额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/interpret:
    post:
      tags: [抽牌]
      operationId: appInterpret
      summary: 生成解读
      description: |
        explore 且问题为空会拒绝。登录用户先过 play 门槛。
        生成前必须已登录、牌面已固定、额度已结算。未绑定供应商会把状态写成 FAILED_RETRYABLE。
        失败文案「解读失败，可重试，未重新扣费」。无请求体。
        JSON 等完整解读；打字机请用 `/interpret/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
        生成会先落成 ai_jobs 任务，不绑 HTTP 连接。App 退出后任务继续；再进来用 GET /readings/{id}：INTERPRETING 为进行中（interpretation 可能是片段），COMPLETED 为全文。未完成可再调 `/interpret/stream` 续听，不会重扣费。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功 data 为完成后的 Reading。额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/interpret/stream:
    post:
      tags: [抽牌]
      operationId: appInterpretStream
      summary: 生成解读（SSE 流式）
      description: |
        与 interpret 相同的额度门槛与落库，但以 SSE 逐段下发，供打字机效果。无请求体。
        额度拦截发生在切换到流之前，仍返回普通 JSON 的 QuotaBlockEnvelope（Content-Type application/json）。
        先创建后台任务再推流：SSE 断开不会取消生成，结果写入 readings。重连先回放已产出文本（一条较大的 delta），再继续增量。
        通过后 Content-Type 为 text/event-stream，事件：
        - `delta`：`data: {"text":"增量片段"}`，多次；重连时第一条可能是已生成全文片段。
        - `done`：`data: {"reading": Reading}`，解读已 COMPLETED 并落库。
        - `error`：`data: {"message":"..."}`，生成失败（已置 FAILED_RETRYABLE，未重新扣费）。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功为 text/event-stream 事件流；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流：每个事件形如 event 行 + data 行（JSON），空行分隔。"
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/confirm-quota:
    post:
      tags: [抽牌]
      operationId: appConfirmQuota
      summary: 确认是否扣额度
      description: |
        匿名用户拒绝。已经扣过则 code=0，message「已经扣过，不再扣」，不再扣。
        consume 不为 true 时不扣，记录保留。
        consume=true 时按共享优先级扣 play；不够则 QuotaBlockEnvelope。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmQuotaBody'
            examples:
              成功:
                summary: 确认扣费
                value:
                  consume: true
      responses:
        '200':
          description: 确认结果或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/ConfirmQuotaData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/use-reward:
    post:
      tags: [抽牌]
      operationId: appUseReward
      summary: 按共享优先级扣一次
      description: |
        无请求体。名字是 use-reward，实现是 chargeOwned(play)，顺序仍是注册奖励、今日免费、人工补发、钻石。
        不保证扣到注册奖励。reward_consumed 仅在 entitlement=registration_reward 时为 true。
        钻石单价未配置或余额不足时返回 QuotaBlockEnvelope，不编造消耗数量。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 扣费结果或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/UseRewardData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/paywall:
    post:
      tags: [会员中心, 抽牌]
      operationId: appPaywall
      summary: 取消或继续付费等待
      description: |
        cancel：保留记录，不生成。没有 pending/unconfigured 行时「没有可取消的付费等待」。
        resume：对当前用户所有挂起的 paywall 再试一次扣费。单价未配置或钻石仍不足的任务被跳过，不会伪造支付成功。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallBody'
            examples:
              成功:
                summary: 继续付费墙
                value:
                  action: resume
      responses:
        '200':
          description: code=0 时 data 为取消结果或 resumed_tasks。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/PaywallResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/followups:
    post:
      tags: [抽牌]
      operationId: appFollowup
      summary: 追问
      description: |
        continuation 必填。false 时新建 normal 占卜。
        true 时记录类型须为 normal、explore、daily、tarotist，且解读已完成、牌面已固定。
        匿名用户在延续追问时被拒绝。登录后按 followup:{turn} 扣费，不够则 QuotaBlockEnvelope，并把追问文本记在 resume_payload。
        每条解读追问次数受 quota_settings.followup_limit 限制（种子 5，null 不限制）；超限返回「本条解读追问已达上限」。
        含「别这样说」或「不舒服」会关掉照野调侃。模型失败不重复扣费。气泡最多 4 条。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupBody'
            examples:
              成功:
                summary: 追问
                value:
                  text: 能再详细说说吗？
                  continuation: true
      responses:
        '200':
          description: 延续追问、新建占卜，或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/FollowupOKData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/followups/stream:
    post:
      tags: [抽牌]
      operationId: appFollowupStream
      summary: 追问（SSE 流式）
      description: |
        仅支持延续追问（continuation 必须为 true；新建占卜请用非流式 followups）。
        额度/轮次/扣费与非流式一致；额度拦截在切换到流之前，返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream，事件：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"followup": FollowupOKData}`，气泡已落库。
        - `error`：`data: {"message":"..."}`。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupBody'
            examples:
              成功:
                summary: 追问
                value:
                  text: 能再详细说说吗？
                  continuation: true
      responses:
        '200':
          description: 成功为 text/event-stream 事件流；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/messages:
    get:
      tags: [历史记录, 抽牌]
      operationId: appMessages
      summary: 追问消息
      description: 按 turn_id、seq 升序。须拥有该占卜。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为消息数组。App 列表不含 reading_id。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/workflow:
    post:
      tags: [抽牌]
      operationId: appWorkflow
      summary: 按步骤跑工作流
      description: |
        请求体可空。detect / rewrite / recommend 不落库。
        interpret / tarotist 在牌面已固定时调用 generate，会写解读并扣已有额度规则。
        未知步骤记在 step.error，不让整个请求失败。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowBody'
            examples:
              成功:
                summary: 默认步骤
                value: {}
      responses:
        '200':
          description: code=0 时 data 含 reading 与 steps。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppWorkflowResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/daily:
    post:
      tags: [首页, 日历记录, 我的小组件]
      operationId: appDaily
      summary: 今日或明日一牌
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录。同一用户、同一 business_date 已有牌面则 code=1，reused=true，charged=false，不重复扣费。
        否则按共享优先级扣 play（不允许塔罗师试用）。单价未配置或钻石不足为 QuotaBlockEnvelope。
        扣费成功后抽一张牌并生成解读。生成失败仍 code=0，返回已固定牌面、可能为 FAILED_RETRYABLE 的记录。
        JSON 等完整解读；打字机请用 `/daily/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
        解读走后台任务。App 退出后再进：GET /readings/{id} 或再调 `/daily`（已有牌面则 reused，COMPLETED 直接返回）。
        成功/复用记录带首页卡字段：card_name、short_text、yi（可空）、card_thumbnail（有牌则必有 URL，未配正式图时为内置默认牌背）、target、business_date、has_result。不编造宜忌文案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyBody'
            examples:
              成功:
                summary: 今日一牌
                value:
                  target: today
      responses:
        '200':
          description: 新结果、复用或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/DailyReuseEnvelope'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/daily/stream:
    post:
      tags: [首页, 日历记录, 我的小组件]
      operationId: appDailyStream
      summary: 今日或明日一牌（SSE 流式）
      description: |
        与 daily 相同的登录、扣费、抽牌与复用规则。额度拦截仍返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"reading": Reading}`；复用已完成记录时带 `"reused": true`，无 delta。
        - `error`：`data: {"message":"..."}`，生成失败（已置 FAILED_RETRYABLE，未重新扣费）。
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyBody'
            examples:
              成功:
                summary: 今日一牌
                value:
                  target: today
      responses:
        '200':
          description: 成功为 text/event-stream；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流：每个事件形如 event 行 + data 行（JSON），空行分隔。"
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/calendar:
    get:
      tags: [日历记录]
      operationId: appCalendar
      summary: 日历
      description: |
        必须登录。data 为 {days, cycle, tomorrow_date}。days 只含未删除且 business_date 非空的记录。
        month 按前缀匹配，例如 2026-10。type 可按 normal/tarotist/explore/daily 过滤。
        日详情字段与定稿 574:2 对齐：今日一牌含牌名/正逆位/短文/缩略图；普通占卜含多张缩略图；占卜师含姓名与头像；时分取 created_at。
        不返回完整牌面 JSON 与解读正文，短文从 interpretation 截取，不编造。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: 2026-10
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [normal, tarotist, explore, daily]
      responses:
        '200':
          description: data 为日历条目，含日详情预览字段。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CalendarView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/iap/verify:
    post:
      tags: [塔塔币购买, 会员中心]
      operationId: appIAPVerify
      summary: 验单并入账钻石
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录，且账号未注销、未合并。
        不调用 App Store 或 Google Play。票据非空且商品映射到启用的 SKU 时 verify_status=verified。
        diamond_grant 为 null：credit_status=amount_unconfigured，不写钻石，不把 null 当成 0。
        订阅缺少 expires_at、商品未映射、商品未启用、交易号已被别人使用，都会失败。
        订阅钻石按周期刷新（替换该桶余额）；消耗型累加 pack。免费次数不会被这次入账改动。
        本次若真正入账（credited），会尝试继续该用户挂起的 paywall。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAPVerifyBody'
            examples:
              成功:
                summary: 本地验单
                value:
                  platform: app_store
                  product_id: unmapped
                  transaction_id: txn-demo
                  receipt: demo-receipt
      responses:
        '200':
          description: code=0 时 data 为订单快照。业务拒绝仍是 code=1、data=null，例如「票据为空」「平台不正确」。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/IAPOrderSnapshot'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/iap/restore:
    post:
      tags: [塔塔币购买]
      operationId: appIAPRestore
      summary: 恢复购买
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        restore_hook_enabled=false 时直接「恢复购买钩子已关闭」，不写订单。verify 不受此开关影响。
        最多 20 笔。单笔失败记在 results 里，不让整批变成 code=1。
        验单规则与 /iap/verify 相同：不访问商店，价格与发放量未配置则不入账。
        restore_required_first_pack 只出现在响应里，不作为拦截条件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAPRestoreBody'
            examples:
              成功:
                summary: 恢复购买
                value:
                  platform: app_store
                  purchases:
                    - product_id: unmapped
                      transaction_id: txn-demo
                      receipt: demo-receipt
      responses:
        '200':
          description: code=0 时 data 含开关和 results。钩子关闭时为普通业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            allOf:
                              - $ref: '#/components/schemas/IAPConfig'
                              - type: object
                                properties:
                                  results:
                                    type: array
                                    items:
                                      $ref: '#/components/schemas/IAPOrderSnapshot'
                                  resumed_tasks:
                                    type: array
                                    items:
                                      $ref: '#/components/schemas/ResumedTask'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/iap/entitlements:
    get:
      tags: [塔塔币购买, 会员中心, 我的中心]
      operationId: appIAPEntitlements
