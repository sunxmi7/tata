      description: |
        匿名令牌可读。返回标题与正文。种子正文为「待确认」，body_status=pending。
        不编写额度、退款或会员规则。反馈入口走已有 POST /api/app/v1/feedback，不在本文返回规则。
        未知 id 的 message=问题不存在。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: how_to_start
      responses:
        '200':
          description: 成功为 HelpArticle；不存在为 ErrorEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/HelpArticle'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/push/register:
    post:
      tags: [通知设置]
      operationId: appRegisterPush
      summary: 注册推送设备
      security:
        - AppBearer: []
      description: |
        必须登录。上报个推 CID 与平台，按 (user_id, cid) 幂等 upsert。
        今日/明日抽牌提醒走 App 本地通知，不经此接口；此处仅用于优惠/活动等消息类的服务端下发（个推）。
        cid 为空返回「缺少推送 CID」；platform 只接受 ''/ios/android。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRegisterBody'
      responses:
        '200':
          description: 成功返回登记的 cid/platform/enabled。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/PushDevice'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/messages:
    get:
      tags: [通知设置]
      operationId: appListInbox
      summary: 消息中心（站内信）
      security:
        - AppBearer: []
      description: |
        必须登录。返回广播（audience=all）与定向给本人的消息，按时间倒序，最多 100 条。
        每条带 read 标记，unread_count 为未读数。优惠/活动的服务端推送会在此留底，可回看。
        定稿 UI 暂无消息中心入口，本接口先行落底；客户端可暂不展示。
      responses:
        '200':
          description: data 为 InboxList。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/InboxList'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/messages/{id}/read:
    post:
      tags: [通知设置]
      operationId: appReadMessage
      summary: 标记消息已读
      security:
        - AppBearer: []
      description: 必须登录。消息不存在或既非广播也非本人定向时返回「消息不存在」。重复标记无副作用。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/monthly-reports:
    get:
      tags: [月度报告, 我的中心]
      operationId: appMonthlyReports
      summary: 月度报告
      security:
        - AppBearer: []
      description: |
        必须登录。month 缺省为用户时区当前月。未来月份拒绝。
        统计来自该月 readings：探索次数、陪伴天数、关注主题（问题命中探索主题标题）。
        寄语截取当月已完成解读，无则 quote_status=pending，不编造。无记录时 status=empty。
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: 2026-11
      responses:
        '200':
          description: data 为 MonthlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/MonthlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/monthly-reports/save:
    post:
      tags: [月度报告]
      operationId: appSaveMonthlyReport
      summary: 保存月度报告
      security:
        - AppBearer: []
      description: 必须登录。按 user+month 幂等保存。返回保存后的 MonthlyReport。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlySaveBody'
      responses:
        '200':
          description: data 为 MonthlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/MonthlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}:
    get:
      tags: [年度运势, 我的中心]
      operationId: appYearlyReport
      summary: 年度运势
      security:
        - AppBearer: []
      description: |
        必须登录。路径 id 为年份。年卡有效则 unlocked=true。
        单独购买价格取已启用的 yearly_unlock SKU（种子 ¥28.8）。正文取 app_config yearly.{year}.*，未填 content_status=pending。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/unlock:
    post:
      tags: [年度运势]
      operationId: appUnlockYearlyReport
      summary: 解锁年度运势
      security:
        - AppBearer: []
      description: 必须登录。年卡有效则免费解锁；已定价则提示通过内购单独解锁；未定价则「年卡未开通，单独购买价格未配置」。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/deck-preference:
    get:
      tags: [首页]
      operationId: appGetDeckPreference
      summary: 牌面风格
      security:
        - AppBearer: []
      description: 必须登录。available 来自已启用牌组；种子仅 rider-waite（莱德韦特）。预览图未配则用内置默认牌背。不编造未上架牌组。
      responses:
        '200':
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DeckPreference'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [首页]
      operationId: appPutDeckPreference
      summary: 更换牌面风格
      security:
        - AppBearer: []
      description: 必须登录。code 须为已启用牌组，否则「该牌面风格尚未开放」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckPreferenceBody'
      responses:
        '200':
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DeckPreference'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    AppBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        App access JWT。Claims：`aud=app`，`typ=access`，`sub` 为用户 id（匿名为 0），`anon` 为匿名 id，`role` 为空，`exp` 约 2 小时，HS256。
        不能把管理端令牌用于 App 接口。
  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: 正整数路径 id。无法解析或小于等于 0 时 HTTP 200、code=1、message 为「id 不正确」。
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        可选。空则不去重。同一 scope 下：首次插入 pending；完成后原样重放当时的 JSON 包络；仍为 pending 时 HTTP 200、code=1、「重复请求处理中」。
        `POST /api/app/v1/readings` 的 scope 为 `user:{id}` 或 `anon:{anonymous_id}`。
        `POST /api/app/v1/readings/{id}/followups` 的 scope 为 `followup:{readingId}`。
      schema:
        type: string
  responses:
    Unauthorized:
      description: HTTP 401。令牌缺失、无效、aud 不匹配，或账号已停用 / 已合并 / 不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 1
            message: 未登录或令牌无效
            data: null
  schemas:
    SuccessMeta:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
          example: ''
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
        error_code:
          type: string
          description: |
            稳定错误码，供客户端按码分支（message 仍为中文原因）。有界推进中：
            已归类 unauthorized、invalid_request_body、invalid_path_id、reading_not_found、reading_deleted、reading_forbidden、internal；
            其余尚未归类的业务错误为空字符串，仅凭 message。
        data:
          nullable: true
          description: 普通 writeErr 为 null。配额拦截、绑定冲突、今日一牌复用不用这个 schema。
    BoolOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: boolean
              example: true
    Position:
      type: object
      additionalProperties: false
      required: [index, name, meaning]
      properties:
        index:
          type: integer
        name:
          type: string
        meaning:
          type: string
    DrawnCard:
      type: object
      properties:
        position:
          type: integer
        position_name:
          type: string
        card_id:
          type: integer
          description: 韦特牌序，力量为 VIII、正义为 XI。
        name:
          type: string
        orientation:
          type: string
          enum: [upright, reversed]
    Reading:
      type: object
      description: scanReading / loadReading 的字段。时间是 RFC3339。
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          nullable: true
        anonymous_id:
          type: string
          description: 无匿名 id 时为空字符串，不是 null。
        type:
          type: string
          description: normal、tarotist、explore、daily。
        question:
          type: string
        spread_id:
          type: integer
          format: int64
          nullable: true
        tarotist_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [QUESTION_CREATED, SPREAD_SELECTED, SHUFFLING, CUTTING, CARDS_FIXED, INTERPRETING, COMPLETED,
            FAILED_RETRYABLE]
        cards:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DrawnCard'
        interpretation:
          type: string
          nullable: true
        vendor_name:
          type: string
          nullable: true
        model_name:
          type: string
          nullable: true
        fail_reason:
          type: string
          nullable: true
        quota_consumed:
          type: boolean
          description: 数据库标记，表示已扣今日免费次数。注册奖励走 reward_consumed，不在此列表字段中。
        first_experience:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: string
        continue:
          type: string
          description: 建议的下一步动作名；完成时为空字符串。
        card_name:
          type: string
          description: 第一张牌名。无牌时为空。列表与详情、今日一牌共用。
        short_text:
          type: string
          description: 从 interpretation 截取的一句预览，无解读时为空，不编造。
        status_label:
          type: string
          description: COMPLETED 为「已解读」，其余为「待继续」。
        yi:
          type: string
          nullable: true
          description: 今日一牌「宜」。取 app_config 的 card.{牌名}.yi；未配置为 null。
        card_thumbnail:
          type: string
          nullable: true
          description: 牌面缩略图。优先 card.{牌名}.thumbnail，否则 card.thumbnail_template（{id}/{name}），再否则 card.thumbnail_default；都未配置则返回内置默认牌背 /uploads/card-default.png。无牌名时为 null。
        target:
          type: string
          description: today 或 tomorrow。仅 daily 响应。
        business_date:
          type: string
          description: 业务日 YYYY-MM-DD。仅 daily 响应。
        has_result:
          type: boolean
          description: 已有牌名时为 true。
    ReadingCreated:
      description: |
        创建占卜在 Reading 之上附加的额度结果。成功包络仍是 code=0。
        登录用户的普通 / 塔罗师占卜在这一步就按共享优先级扣费；explore 推迟到仪式门槛；匿名不预扣。
        额度用尽时记录仍保留（kept=true，generated=false），不会编造钻石单价。
      allOf:
        - $ref: '#/components/schemas/Reading'
        - type: object
          properties:
            quota_exhausted:
              type: boolean
            quota_consumed:
              type: boolean
            reward_consumed:
              type: boolean
            needs_confirm:
              type: boolean
              description: 当前实现恒为 false。
            quota_outcome:
              type: string
              enum: [charged, already, paywall, diamond_cost_unconfigured, anonymous, deferred]
            entitlement:
              type: string
              description: |
                可能为空。取值：registration_reward、daily_free、admin_grant_free、diamond_pack、diamond_subscription、ai_trial。
            paywall:
              type: boolean
            diamond_cost_unconfigured:
              type: boolean
            kept:
              type: boolean
            generated:
              type: boolean
            quota_prompt:
              type: string
              description: 仅在额度用尽且决策带有文案时出现。
    ReadingOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Reading'
    ReadingListOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Reading'
    ReadingPage:
      type: object
      description: 占卜列表的游标分页结果。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        has_more:
          type: boolean
        next_cursor:
          type: integer
          format: int64
          description: 下一页的 before_id。has_more=false 时为 0。
        limit:
          type: integer
    ReadingCreatedOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReadingCreated'
    QuotaBlock:
      type: object
      properties:
        reading_id:
          type: integer
          format: int64
        quota_outcome:
          type: string
          enum: [paywall, diamond_cost_unconfigured]
        entitlement:
          type: string
        paywall:
          type: boolean
        diamond_cost_unconfigured:
          type: boolean
          description: diamond_cost 未配置时为 true，本次不扣钻石。
        kept:
          type: boolean
          example: true
        generated:
          type: boolean
          example: false
    QuotaBlockEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
          description: |
            paywall：「今日免费次数已用完，钻石不足，请付费后自动继续；取消则保留记录且不继续生成」。
            未配置：「今日免费次数已用完，钻石消耗未配置，本次未扣钻石，记录已保留」。
        data:
          $ref: '#/components/schemas/QuotaBlock'
    Spread:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        card_count:
          type: integer
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        enabled:
          type: boolean
        charged:
          type: boolean
    Banner:
      type: object
      properties:
        id:
          type: integer
          format: int64
        copy:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        priority:
          type: integer
        target:
          type: string
    TarotistPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        display_copy:
          type: string
        title:
          type: string
          description: 首页列表标签文案，与 display_copy 相同。
        tags:
          type: array
          items:
            type: string
        blurb:
          type: string
          description: 首页简介。缺省时回退 display_copy。不返回人设/禁止项正文。
        avatar_url:
          type: string
          nullable: true
          description: 未配置时为 null，不编造头像地址。
    QuotaView:
      type: object
      description: |
        用户可见「次数」与「钻石」分开。扣减顺序固定：注册奖励 → 今日免费次数 → 人工补发免费次数 → 钻石 → 付费等待。
        钻石先扣 pack（consumable），再扣 subscription，单次不拆桶。
        diamond_cost 未配置时为 null，不会出现猜测出来的单价。
        followup_limit 为每条解读可追问次数，种子默认 5，null 不限制。
      properties:
        cycle:
          type: string
          description: 业务日，默认按用户时区、重置点为北京时间 08:00。
          example: '2026-10-26'
        reset_at:
          type: string
          example: 北京时间 08:00
        daily_free_used:
          type: boolean
        daily_free_count:
          type: integer
          example: 1
        daily_free_remaining:
          type: integer
        daily_used_flags:
          type: integer
        reward_remaining:
          type: integer
        admin_grant_free_remaining:
          type: integer
        subscription_prompt_required:
          type: boolean
        free_label:
          type: string
          example: 次数
        paid_label:
          type: string
          example: 钻石
        priority:
          type: string
          example: 注册奖励 → 今日免费次数 → 人工补发免费次数 → 钻石 → 付费
        diamond_spend_order:
          type: string
          example: pack_then_subscription
        diamond_cost:
          type: integer
          nullable: true
          description: quota_settings.diamond_cost。未配置为 null。
        diamond_cost_configured:
          type: boolean
        subscription_diamonds:
          type: integer
        pack_diamonds:
          type: integer
        display_label:
          type: string
          example: 塔塔币
          description: UI 展示名。账本单位仍是钻石。
        balance:
          type: integer
          description: pack_diamonds + subscription_diamonds。我的页余额用这个合计。
        followup_limit:
          type: integer
          nullable: true
          description: 每条解读可追问次数。种子默认 5；null 表示不限制。
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        birth_date:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        wechat_openid:
          type: string
          nullable: true
        apple_sub:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
        name:
          type: string
          description: 姓名。未设置时为空字符串。
        bio:
          type: string
          description: 简介。未设置时为空字符串。
        avatar_url:
          type: string
          nullable: true
        public_id:
          type: string
