  /api/app/v1/uploads:
    post:
      tags: [账号, 我的中心, 功能心愿单, 反馈意见]
      operationId: appUploads
      summary: 上传图片（头像 / 心愿 / 反馈）
      description: |
        必须登录。没有单独的上传头像接口；改头像也走这里。
        JSON（filename/content_type/content_base64）或 multipart 字段 file。
        query folder：头像用 misc（缺省）；心愿/反馈用 feedback；spreads/decks/cards 给管理端图。
        成功把 data.url 写入 PUT /profile 的 avatar_url，或心愿/反馈的 image_url。
        仅 jpg/png/webp/gif，最大 5MB。落地由 config.yaml 的 upload.driver 决定（local 或阿里云 OSS）。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: folder
          in: query
          required: false
          schema:
            type: string
            enum: [spreads, decks, cards, feedback, misc]
          description: 子目录。头像用 misc（缺省）；心愿/反馈用 feedback。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadBody'
            examples:
              头像:
                summary: 上传头像（folder 缺省 misc）
                value:
                  filename: avatar.png
                  content_type: image/png
                  content_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
              成功:
                summary: JSON 上传
                value:
                  filename: demo.png
                  content_type: image/png
                  content_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功返回 url。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/UploadResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
