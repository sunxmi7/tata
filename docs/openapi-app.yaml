    post:
      tags: [年度运势]
      operationId: appYearlyDomains
      summary: 年运抽四季牌阵
      description: |
        必须已抽完十二宫。四季顺序：春、夏、秋、冬。
        从剩余 66 张中抽取，不与十二宫牌重复。mode=pick 时 numbers 为 4 个不重复的 1–78。抽完不可重抽。
        响应 domain_cards 与 season_cards 同内容。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearlyDrawBody'
            examples:
              成功:
                summary: 抽取四季牌
                value:
                  mode: normal
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/generate:
    post:
      tags: [年度运势]
      operationId: appYearlyGenerate
      summary: 生成年度报告
      description: |
        必须已抽完十二宫 12 + 四季 4。走 interpret 供应商，按牌面生成报告，不编造。
        已生成则原样返回。失败可重试，不改牌面。
        JSON 等完整报告；打字机请用 `/generate/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/generate/stream:
    post:
      tags: [年度运势]
      operationId: appYearlyGenerateStream
      summary: 生成年度报告（SSE 流式）
      description: |
        与 generate 相同的解锁与牌面门槛。已生成则直接 `done`（data 含 report、reused=true）。
        否则以 SSE 逐段下发 interpret 供应商输出。请求体为 `{}`。
        事件：delta（data:{"text":"片段"}）、done（data:{"report": YearlyReport}）、error。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 成功为 text/event-stream。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流。"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/deck-preference:
    get:
      tags: [我的塔罗牌]
      operationId: appGetDeckPreference
      summary: 我的牌组列表
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录。available 来自已启用牌组；种子仅 rider-waite（莱德韦特）。
        每项含 name / thumbnail（封面）/ cover_url / back_url / description / tags。介绍与标签未填时为空串和空数组，不编造。
        封面未配则用内置默认牌背。每套独立 78 张卡面走 GET /cards?deck=（优先 deck_faces，否则回落全局 cards）。
      responses:
        '200':
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DeckPreference'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [我的塔罗牌]
      operationId: appPutDeckPreference
      summary: 选用牌组
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: 必须登录。code 须为已启用牌组，否则「该牌面风格尚未开放」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckPreferenceBody'
            examples:
              成功:
                summary: 选择莱德韦特
                value:
                  code: rider-waite
      responses:
        '200':
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DeckPreference'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      description: |
        填 `Bearer ` + 登录返回的 accessToken。Bearer 后面有一个空格。
        放在 Headers，不要放进请求体。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    AuthorizationOptional:
      name: Authorization
      in: header
      required: false
      description: |
        登录发码不用填。scene=bind 时必填 `Bearer <accessToken>`。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    DivinationAuthorization:
      name: Authorization
      in: header
      required: false
      description: |
        已登录填 `Bearer ` + accessToken。未登录不带这个头，改用 device_id。
        带了头但令牌无效，返回 HTTP 401。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    DeviceIdQuery:
      name: device_id
      in: query
      required: false
      description: 未登录必填。已登录可省略。用来认出这台设备上的占卜。
      schema:
        type: string
    PathId:
      name: id
      in: path
      required: true
      description: 正整数路径 id。无法解析或小于等于 0 时 HTTP 200、code=1、message 为「id 不正确」。
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        可选。空则不去重。同一 scope 下：首次插入 pending；完成后原样重放当时的 JSON 包络；仍为 pending 时 HTTP 200、code=1、「重复请求处理中」。
        `POST /api/app/v1/readings` 的 scope 为 `user:{id}` 或 `device:{device_id 小写}`。
        `POST /api/app/v1/readings/{id}/followups` 的 scope 为 `followup:{readingId}`。
      schema:
        type: string
  responses:
    Unauthorized:
      description: HTTP 401。令牌缺失、无效、aud 不匹配，或账号已停用 / 已合并 / 不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 1
            message: 未登录或令牌无效
            data: null
  schemas:
    SuccessMeta:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
          description: 成功固定为 0。
        message:
          type: string
          example: ''
          description: 成功时一般为空字符串。
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 业务失败固定为 1。HTTP 多为 200；鉴权失败为 401。
        message:
          type: string
          description: 失败原因，按 Accept-Language / X-Language 本地化；缺省简体中文。例如「验证码不正确或已过期」或 Not logged in or token invalid。
        error_code:
          type: string
          description: |
            稳定错误码，供客户端按码分支（不随语言变化）。有界推进中：
            已归类 unauthorized、invalid_request_body、invalid_path_id、reading_not_found、reading_deleted、reading_forbidden、internal；
            其余尚未归类的业务错误为空字符串，仅凭 message。
        data:
          nullable: true
          description: 普通 writeErr 为 null。配额拦截、绑定冲突、今日一牌复用不用这个 schema。
    BoolOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: boolean
              example: true
              description: 成功为 true。
    Position:
      type: object
      additionalProperties: false
      required: [index, name, meaning]
      properties:
        index:
          type: integer
          description: 阵位序号，从 0 或 1 起，与抽牌 position 对应。
        name:
          type: string
          description: 阵位名，例如「过去」。
        meaning:
          type: string
          description: 阵位含义说明。
    DrawnCard:
      type: object
      description: 牌面对象。出现在 Reading.cards 与对话气泡 messages[].cards 中。
      properties:
        position:
          type: integer
          description: 牌位序号，从 1 开始。
        position_name:
          type: string
          description: 牌位名，例如「过去」「现在」。
        card_id:
          type: integer
          description: 韦特牌序编号。力量为 VIII、正义为 XI。
        name:
          type: string
          description: 牌名，例如「愚者」。
        orientation:
          type: string
          enum: [upright, reversed]
          description: upright=正位，reversed=逆位。
        image:
          type: string
          description: 牌图绝对 URL。对话气泡里的牌常用此字段；无图时可能为空字符串。
        number:
          type: integer
          description: 仅灵数抽牌出现。用户输入的 1–78 数字。普通抽牌没有此字段。
    Reading:
      type: object
      description: |
        单条占卜记录。列表 items[] 与详情 data（去掉 messages 后）共用本结构。
        时间均为 RFC3339。App 分入口看 conversation_type，分续做屏看 stage。
      properties:
        id:
          type: integer
          format: int64
          description: 占卜记录 id。详情里与 reading_id 相同。
        user_id:
          type: integer
          format: int64
          nullable: true
          description: 归属用户 id。未登录创建的记录为 null，登录后按 device_id 挂上。
        type:
          type: string
          enum: [normal, tarotist, explore, daily]
          description: |
            底层业务类型（4 种）。
            explore 同时覆盖「此刻抉择」和「主题占卜」，不能单靠本字段区分；
            必须再用 conversation_type 或 theme_key，见 conversation_type。
        theme_key:
          type: string
          description: |
            探索主题键。创建 explore 时可写；选阵后若为空从牌阵回填。非 explore 一般为空字符串。
            - yes_or_no / either_or → 此刻抉择
            - relationship / communication / career / study / interpersonal / shopping / outfit / wellbeing / inner → 主题占卜
            - 空 → 探索记录尚未绑定主题，conversation_type 也为空
        conversation_type:
          type: string
          enum: ['', daily, moment, theme]
          description: |
            历史对话三类（App 分 UI 用这个）：
            - daily：今日运势（type=daily 且 target=today）
            - moment：普通占卜（type=normal，或 type=daily 且 target=tomorrow）/ 占卜师（type=tarotist）/ 此刻抉择（type=explore 且 theme_key 为 yes_or_no|either_or）
            - theme：主题占卜（type=explore 且其余 theme_key）
            - 空字符串：explore 尚未有 theme_key
            判定：type=explore && conversation_type=moment → 此刻抉择；
            type=explore && conversation_type=theme → 主题占卜；
            type=daily && target=tomorrow → 按普通占卜展示（仍可用 target / target_date 识别明日运势）。
        conversation_label:
          type: string
          description: |
            列表/详情展示名：今日运势、普通占卜、占卜师、此刻抉择、主题占卜。
            提前抽的明日运势展示为「普通占卜」（不再单独用「明日运势」标签）。
            conversation_type 为空时为空字符串。
        stage:
          type: string
          description: |
            按 conversation_type 区分的阶段键，续做 UI 用这个（优先于 progress）。
            daily 常见：pending_draw / pending_interpret / interpreting / completed / failed_retryable
            moment 常见：question_submitted / spread_selected / shuffling / cutting / cards_fixed / interpreting / completed / failed_retryable
            theme 常见：pending_spread / spread_selected / shuffling / cutting / cards_fixed / interpreting / completed / failed_retryable
        stage_label:
          type: string
          description: |
            阶段中文。例如待抽牌、待解读、问题已提交、待选牌阵、牌阵已选择、洗牌中、切牌中、
            牌面已固定、解读生成中、已完成、失败可重试。
        question:
          type: string
          description: 用户问题原文。探索主题占卜允许为空字符串。
        spread_id:
          type: integer
          format: int64
          nullable: true
          description: 所选牌阵 id。未选阵为 null。
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: 占卜师 id。非占卜师为 null。
        status:
          type: string
          enum: [QUESTION_CREATED, SPREAD_SELECTED, SHUFFLING, CUTTING, CARDS_FIXED, INTERPRETING, COMPLETED,
            FAILED_RETRYABLE]
          description: |
            底层状态机（三类对话共用）。新 App 优先用 stage；本字段兼容旧逻辑。
            QUESTION_CREATED → SPREAD_SELECTED → SHUFFLING → CUTTING → CARDS_FIXED → INTERPRETING → COMPLETED；
            FAILED_RETRYABLE 表示生成失败可重试。
        draw_mode:
          type: string
          description: |
            抽牌方式。normal=常规，numerology=灵数；未选时为空字符串。
            探索 / 塔罗师 / 今日一牌一般为空。
        cards:
          type: array
          nullable: true
          description: 已抽牌列表。尚未抽牌为 null 或空数组。
          items:
            $ref: '#/components/schemas/DrawnCard'
        interpretation:
          type: string
          nullable: true
          description: 解读正文。未生成时为 null。INTERPRETING 时可能是片段；COMPLETED 为全文。
        vendor_name:
          type: string
          nullable: true
          description: 生成解读的供应商名。未生成为 null。
        model_name:
          type: string
          nullable: true
          description: 生成解读的模型名。未生成为 null。
        fail_reason:
          type: string
          nullable: true
          description: 生成失败原因。成功或未失败为 null。
        quota_consumed:
          type: boolean
          description: 是否已扣今日免费次数（库标记）。注册奖励不走本字段。
        first_experience:
          type: boolean
          description: 是否该用户首次体验占卜。
        created_at:
          type: string
          format: date-time
          description: 创建时间，RFC3339。
        updated_at:
          type: string
          format: date-time
          description: 最近更新时间，RFC3339。
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 软删时间。未删除为 null。列表不会返回已删除记录。
        progress:
          type: string
          description: |
            旧进度文案（按 status）：问题已提交 / 牌阵已选择 / 洗牌中 / 切牌中 / 牌面已固定 /
            解读生成中 / 已完成 / 失败可重试。新客户端优先用 stage_label。
        continue:
          type: string
          description: |
            建议下一步动作名。例如 detect、shuffle、cut、draw、interpret；完成时为空字符串。
        card_name:
          type: string
          description: 第一张牌名。无牌时为空字符串。
        short_text:
          type: string
          description: 从 interpretation 截取的预览（最多约 48 字）。无解读时为空，不编造。
        status_label:
          type: string
          description: COMPLETED 为「已解读」，其余为「待继续」。粗粒度；细阶段看 stage_label。
        card_thumbnail:
          type: string
          nullable: true
          description: |
            第一张牌缩略图完整 URL。优先单牌图 → 模板 → 默认图 → 内置默认牌背。
            无牌名时为 null。
        yi:
          type: string
          nullable: true
          description: 今日一牌「宜」。按正逆位取文案；都空为 null。列表非 daily 也可能出现。
        card_message:
          type: string
          nullable: true
          description: 今日一牌寄语。按正逆位取 upright_message / reversed_message；无则为 null。
        target:
          type: string
          enum: [today, tomorrow, '']
          description: 仅 daily 有意义。today=今日运势，tomorrow=明日运势。非 daily 可为空或不使用。
        business_date:
          type: string
          description: |
            业务日 YYYY-MM-DD。日历/历史按此字段归天打点。
            daily：抽牌日（提前抽明日运势时为抽牌当天，不是运势日）。
        target_date:
          type: string
          description: |
            仅 daily 有意义。运势目标日 YYYY-MM-DD；与 target 对应，用作复用唯一键。
            旧数据可能缺省，此时服务端用 business_date 兜底。
        has_result:
          type: boolean
          description: 已有牌名时为 true（今日一牌首页卡常用）。列表项也可能带。
        redraw_pending:
          type: boolean
          description: 是否有未点选的补抽提示（类型十七 pending）。列表与详情都会带。
        redraw:
          description: 仅 redraw_pending=true 时出现。结构与 messages 里 style=redraw 的气泡相同。
          allOf:
            - $ref: '#/components/schemas/ConversationMessage'
    ReadingCreated:
      description: |
        创建占卜在 Reading 之上附加的额度结果。成功包络仍是 code=0。
        登录用户的普通 / 塔罗师占卜在这一步就按共享优先级扣费；explore 推迟到确认牌阵。未登录不预扣，quota_outcome=anonymous。
        额度用尽时记录仍保留（kept=true，generated=false），不会编造钻石单价。
      allOf:
        - $ref: '#/components/schemas/Reading'
        - type: object
          properties:
            quota_exhausted:
              type: boolean
              description: 额度不足以继续生成时为 true。记录仍可能保留。
            quota_consumed:
              type: boolean
              description: 本次是否扣了今日免费次数。
            reward_consumed:
              type: boolean
              description: 本次是否扣了注册奖励。
            needs_confirm:
              type: boolean
              description: 当前实现恒为 false。
            quota_outcome:
              type: string
              enum: [charged, already, paywall, quota_cost_unconfigured, anonymous, deferred]
              description: 额度结算结果。charged 已扣、already 此前已扣、paywall 待付费、anonymous 未登录不预扣、deferred 推迟到确认牌阵。
            entitlement:
              type: string
              description: |
                可能为空。取值：registration_reward、daily_free、admin_grant_free、quota_pack、quota_subscription、ai_trial。
            paywall:
              type: boolean
              description: 需要付费墙时为 true。
            quota_cost_unconfigured:
              type: boolean
              description: 走到钻石步但单价未配置时为 true，本次不扣钻石。
            kept:
              type: boolean
              description: 额度不足时记录是否保留。拦截场景一般为 true。
            generated:
              type: boolean
              description: 是否已生成解读。拦截时为 false。
            quota_prompt:
              type: string
              description: 仅在额度用尽且决策带有文案时出现。
    ReadingOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Reading'
              description: 单条占卜。
    ReadingDetail:
      description: |
        GET /readings/{id} 的 data = Reading 全部字段 + 对话三字段。
        App 点进历史：先读 conversation_type/stage 决定续做或聊天屏，再用 messages 画气泡。
      allOf:
        - $ref: '#/components/schemas/Reading'
        - type: object
          required: [reading_id, messages, has_more]
          properties:
            reading_id:
              type: integer
              format: int64
              description: 与 id 相同。
            messages:
              type: array
              description: |
                对话气泡，按发生顺序。用 kind + style 选组件；from 区分 user/server。
                query limit/offset 只切本数组。画面对照见各 style 字段说明与 docs/app-conversation.md。
              items:
                $ref: '#/components/schemas/ConversationMessage'
            has_more:
              type: boolean
              description: messages 是否还有下一页。未传 limit 或已到末尾为 false。
    ReadingDetailOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReadingDetail'
              description: 单条占卜进度 + 对话。
    ConversationMessage:
      type: object
      description: |
        一条对话气泡。必有 kind、from、style；其余字段随 style 出现。
        客户端不渲染的类型（点赞十一、更多问题十五、空输入十八、空气泡二十）接口不返回。
      required: [kind, from, style]
      properties:
        kind:
          type: string
          enum: [question, cards, interpretation, suggestion]
          description: 大类。
        from:
          type: string
          enum: [user, server]
          description: user=用户，server=服务端。
        style:
          type: string
          enum: [labeled, bubble, chip, option, followup, recommend, spread, single, pick, choose, body, detect, guide, error, redraw]
          description: |
            与 kind 组合选组件：
            question+labeled=类型二；question+bubble=类型十八；
            suggestion+chip/option/followup/recommend/redraw=类型十二/十四/四/五/十七；
            cards+spread/single/pick/choose=类型一/十九/七/十六；
            interpretation+body/detect/guide/error=类型三/六/八/九十。
        turn_id:
          type: integer
          format: int64
          description: 追问轮次。类型十八/十九/十七及追问回答等会带。
        seq:
          type: integer
          description: 同一轮内顺序。追问解读分段时出现。
        label:
          type: string
          description: 小标题。类型二一般为「你的问题」。
        text:
          type: string
          description: 正文。问题、解读、错误提示、胶囊文案等。
        title:
          type: string
          description: 块标题。牌面预览、补抽、推荐、检测、灵数引导等。
        hint:
          type: string
          description: 类型十四选项的灰色说明。
        selected:
          type: boolean
          description: 类型十四是否选中。
        placeholder:
          type: string
          description: 类型八输入框占位。
        status:
          type: string
          description: 类型六检测状态文案，例如「已完成」。
        reason_title:
          type: string
          description: 类型六「为什么建议修改？」一类标题。
        pending:
          type: boolean
          description: 类型十七是否还未点选。
        choice:
          type: string
          description: 类型十七点选结果。draw=去抽牌，skip=跳过；未点选不出现。
        card_count:
          type: integer
          description: 类型七/八等场景的张数提示。
        input_rows:
          type: integer
          description: 类型八灵数输入区建议行数。张数 ≤6 为 1，否则按每行约 6 个估算。
        options:
          type: array
          description: |
            类型四/五的选项列表。
            类型四每项常见字段只有 text；类型五每项常见 text、hint、selected。
          items:
            type: object
            properties:
              text:
                type: string
                description: 选项正文。
              hint:
                type: string
                description: 灰色说明（类型五常见）。
              selected:
                type: boolean
                description: 是否选中（类型五常见）。
        actions:
          type: array
          description: 类型十七按钮。一般含去抽牌、跳过。
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
                enum: [draw, skip]
                description: draw=去抽牌，skip=跳过。
              label:
                type: string
                description: 按钮文案，如「去抽牌」「跳过」。
        rules:
          type: array
          description: 类型八灰色规则文案列表。
          items:
            type: string
        numbers:
          type: array
          description: 类型九/十已输入数字。
          items:
            type: integer
        slots:
          type: array
          description: 类型七牌位输入区。
          items:
            $ref: '#/components/schemas/ConversationSlot'
        cards:
          type: array
          description: 类型一/十九的牌列表。
          items:
            $ref: '#/components/schemas/DrawnCard'
        spreads:
          type: array
          description: 类型十六当前可选牌阵卡。
          items:
            $ref: '#/components/schemas/ConversationSpreadChoice'
        more_spreads:
          type: string
          description: 类型十六「更多牌阵」入口文案，固定为「更多牌阵」。完整目录另走 GET /spreads。
        draw_mode_label:
          type: string
          description: 类型十六抽牌方式区标题，一般为「抽牌方式」。
        draw_modes:
          type: array
          description: 类型十六可选抽牌方式（常规 / 灵数）。
          items:
            $ref: '#/components/schemas/ConversationDrawMode'
    ConversationSlot:
      type: object
      description: 类型七（cards+pick）单个牌位输入格。
      properties:
        position:
          type: integer
          description: 牌位序号，从 1 开始。
        position_name:
          type: string
          description: 牌位名。
        number:
          type: string
          description: 用户输入的数字字符串；未填可为空字符串。
        mark:
          type: string
          description: 状态文案，如待选择 / 已选择 / 重复数字 / 超出范围。
        invalid:
          type: boolean
          description: true 时该格标红。
    ConversationSpreadChoice:
      type: object
      description: 类型十六（cards+choose）里的一张牌阵卡。
      properties:
        id:
          type: integer
          format: int64
          description: 牌阵 id。提交选阵时用这个。
        name:
          type: string
          description: 牌阵名。
        description:
          type: string
          description: 牌阵含义说明。
        short_sentence:
          type: string
          description: 短句；没有则为空字符串。
        card_count:
          type: integer
          description: 张数。
        recommended:
          type: boolean
          description: true 时画面显示「推荐牌阵」。
        selected:
          type: boolean
          description: 当前占卜是否已选中该阵。
        thumbnail:
          type: string
          description: 缩略图绝对 URL；无图可为空字符串。
    ConversationDrawMode:
      type: object
      description: 类型十六里的一种抽牌方式。
      properties:
        id:
          type: string
          enum: [normal, numerology]
          description: normal=常规抽牌，numerology=灵数抽牌。
        label:
          type: string
          description: 展示名，如「常规抽牌」「灵数抽牌」。
        hint:
          type: string
          description: 灰色说明。
    ReadingListOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              description: 占卜数组。无记录时为空数组。
              items:
                $ref: '#/components/schemas/Reading'
    ReadingPage:
      type: object
      description: GET /readings 的 data。游标分页。
      required: [items, has_more, next_cursor, limit]
      properties:
        items:
          type: array
          description: 本页占卜（Reading）。无记录时为空数组。不含 messages。
          items:
            $ref: '#/components/schemas/Reading'
        has_more:
          type: boolean
          description: 是否还有更早的记录。
        next_cursor:
          type: integer
          format: int64
          description: 下一页请求的 before_id。has_more=false 时为 0。
        limit:
          type: integer
          description: 本页实际使用的条数上限（已按默认 20 / 上限 100 规范化）。
    ReadingCreatedOK:
      allOf:
        - $ref: '#/components/schemas/SuccessMeta'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ReadingCreated'
              description: 新建占卜及其额度结果。
    QuotaBlock:
      type: object
      properties:
        reading_id:
          type: integer
          format: int64
          description: 被拦截的占卜 id。记录一般已保留。
        quota_outcome:
          type: string
          enum: [paywall, quota_cost_unconfigured]
          description: paywall 为额度不足或请开通会员；quota_cost_unconfigured 单价未配置。
        entitlement:
          type: string
          description: 本应扣的权益种类，可能为空。
        paywall:
          type: boolean
          description: 需要弹出付费墙时为 true。
        quota_cost_unconfigured:
          type: boolean
          description: quota_cost 未配置时为 true，本次不扣钻石。
        kept:
          type: boolean
          example: true
          description: 记录是否保留。拦截时为 true。
        generated:
          type: boolean
          example: false
          description: 是否已生成。拦截时为 false。
    QuotaBlockEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 额度拦截固定为 1。
        message:
          type: string
          description: |
            免费用户：「请开通会员后继续」。会员额度不够：「额度不足，请购买额度补充包后自动继续；取消则保留记录且不继续生成」。
            未配置：「会员额度单价未配置，本次未扣额度，记录已保留」。
        data:
          $ref: '#/components/schemas/QuotaBlock'
          description: 拦截详情。
    Spread:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 牌阵 id。
        name:
          type: string
          description: 牌阵名，例如「时间流」。
        name_en:
          type: string
          description: 英文名称。更多牌阵文字稿里的英文名。未填为空字符串。
        description:
          type: string
          description: 含义说明。未填为空字符串。
        card_count:
          type: integer
          description: 需要抽取的牌数。
        positions:
          type: array
          description: 阵位列表，长度等于 card_count。
          items:
            $ref: '#/components/schemas/Position'
        enabled:
          type: boolean
          description: 是否对 App 可见。目录接口只返回启用中的。
        charged:
          type: boolean
          description: 旧收费开关。普通占卜扣次看 quota_cost，不看这个字段。
        depth_group:
          type: string
          description: 普通占卜分组。quick 快速指引，advanced 进阶分析，panorama 深度全景。空字符串表示不是这 19 套。不是免费白名单。
        depth_label:
          type: string
          description: depth_group 的中文名。未分组为空字符串。
        quota_cost:
          type: integer
          nullable: true
          description: 普通占卜扣次，单位是额度次数。null 表示未标价。不是人民币，也不是塔塔币。结算尚未读取。
        price_ledger:
          type: string
          nullable: true
          description: 有扣次时为 quota_count。未标价为 null。不会是会员、补充包、年运或牌组账本。
        recommended:
          type: boolean
          description: 选阵屏「推荐牌阵」角标。全表最多一张为 true。未推荐为 false，不编造。
        thumbnail:
          type: string
          description: 选阵屏牌阵示意图完整 URL。未配置时为当前服务地址下的内置默认牌背，例如 http://127.0.0.1:8080/uploads/card-default.png。已配置的 http(s) 地址原样返回。
        theme_key:
          type: string
          description: 探索牌阵主题键。空则未分组。对应文字总结版主题。
        theme_title:
          type: string
          description: 探索牌阵主题标题。未填为空串。
        theme_subtitle:
          type: string
          description: 探索牌阵主题副标题。未填为空串。
        short_sentence:
          type: string
          description: 牌阵短句。未填为空串，不编造。
    ExploreTopics:
      type: object
      properties:
        themes:
          type: array
          description: 探索主题摘要。无条目时为空数组。列表接口不含 spreads。
          items:
            $ref: '#/components/schemas/ExploreTheme'
    ExploreTheme:
      type: object
      properties:
        theme_key:
          type: string
          example: yes_or_no
          description: 主题键。
        title:
          type: string
          example: Yes or No
          description: 主题标题。
        subtitle:
          type: string
          example: 听听此刻的倾向
          description: 主题副标题。
        spreads:
          type: array
          description: 该主题下的牌阵。主题列表接口不返回本字段；带 theme_key 详情才有。
          items:
            $ref: '#/components/schemas/ExploreThemeSpread'
    ExploreThemeSpread:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 牌阵 id。创建探索占卜后用它选阵。
        name:
          type: string
          description: 牌阵名称。
        card_count:
          type: integer
          description: 抽牌张数。
        short_sentence:
          type: string
          description: 牌阵短句。
        description:
          type: string
          description: 含义说明。额度未标价，不在此返回。
        positions:
          type: array
          description: 阵位列表。
          items:
            type: object
            additionalProperties: true
        quick_questions:
          type: array
          description: 该入口快捷预设问题。点击后填入输入框，不直接提交。
          items:
            type: string
            example: 他近期会主动联系我吗？
    Banner:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 提示窗 id。
        copy:
          type: string
          description: 提示窗文案。
        start_at:
          type: string
          format: date-time
          description: 生效开始时间。接口只返回当前有效的。
        end_at:
          type: string
          format: date-time
          description: 生效结束时间。
        priority:
          type: integer
          description: 越大越靠前。
        target:
          type: string
          description: 点击跳转目标，可空。
    TarotistPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 占卜师 id。创建占卜 type=tarotist 时用这个。
        name:
          type: string
          description: 占卜师姓名。
        display_copy:
          type: string
          description: 对外展示文案，首页标签与简介缺省时回退这里。
        title:
          type: string
          description: 首页列表标签文案，与 display_copy 相同。
        tags:
          type: array
          description: 首页标签。未填为空数组。
          items:
            type: string
        blurb:
          type: string
          description: 首页简介。缺省时回退 display_copy。不返回人设/禁止项正文。
        avatar_url:
          type: string
          nullable: true
          description: 未配置时为 null，不编造头像地址。
    QuotaView:
      type: object
      description: |
        按当前是否会员分流。免费用户返回注册赠送、邀请和兑换免费次数，不返回额度余额，也不再返回每日免费。
        会员返回统一额度 quota_remaining。
        免费扣费顺序：注册赠送 → 邀请奖励 → 兑换免费次数 → 开通会员。不再发放每日免费。
        会员每次扣 quota_settings.quota_cost；未配置为 null。池子大于 0 但不够时只提示额度不足。
        followup_limit 为每条解读可追问次数，种子默认 5，null 不限制。
      properties:
        cycle:
          type: string
          description: 业务日，默认按用户时区、重置点为北京时间 08:00。
          example: '2026-10-26'
        reset_at:
          type: string
          description: 已不再返回。每日免费和 08:00 刷新已取消。
        daily_free_used:
          type: boolean
          description: 已不再返回。
        daily_free_count:
          type: integer
          description: 已不再返回。
        daily_slot_count:
          type: integer
          description: 已不再返回。今日和明日是同账号、同目标日一份结果。
        daily_free_remaining:
          type: integer
          description: 已不再返回。
        daily_used_flags:
          type: integer
          description: 已不再返回。
        reward_remaining:
          type: integer
          description: 历史字段。旧注册奖励余额已下线。新的注册赠送见 registration_gift。
        registration_gift:
          type: object
          nullable: true
          description: 登录用户的注册赠送记录。间隔未配置时 granted_at 为 null、remaining 为 0。未登录不返回。
        invite_remaining:
          type: integer
          description: 邀请奖励剩余次数。不过日清。仅免费用户返回。
        invite_count:
          type: integer
          description: 已成功邀请人数。上限 5。
        max_invites:
          type: integer
          example: 5
          description: 邀请人数上限。
        is_member:
          type: boolean
          description: 当前是否有效会员。
        can_buy_pack:
          type: boolean
          description: 是否可买额度补充包。仅会员为 true。
        quota_remaining:
          type: integer
          description: 会员统一额度。免费用户不返回。
        membership:
          type: object
          description: 当前会员摘要。非会员为 null 或不出现。
        admin_grant_free_remaining:
          type: integer
          description: 人工补发的免费次数剩余。仅免费用户返回。
        subscription_prompt_required:
          type: boolean
          description: 合并账号后订阅需要用户选择时为 true。
        free_label:
          type: string
          example: 次数
          description: 免费次数在 UI 上的名称。
        paid_label:
          type: string
          example: 额度
          description: 付费额度在 UI 上的名称。
        priority:
          type: string
          example: 注册赠送 → 邀请奖励 → 兑换免费次数
          description: 扣减顺序说明文案。会员为「会员统一额度」。
        quota_spend_order:
          type: string
          description: 历史字段。两桶钻石已并入统一额度。
        quota_cost:
          type: integer
          nullable: true
          description: 会员每次扣额度的单价。未配置为 null。
        quota_cost_configured:
          type: boolean
          description: quota_cost 是否已配置。false 时会员扣费停住。
        display_label:
          type: string
          example: 额度
          description: UI 展示名。
        balance:
          type: integer
          description: 会员统一额度。免费用户不返回。
        followup_limit:
          type: integer
          nullable: true
          description: 每条解读可追问次数。种子默认 5；null 表示不限制。
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户数字 id，服务端主键。不是公开短 ID。
        email:
          type: string
          description: 已绑邮箱。未绑为空字符串或 null。
        birth_date:
          type: string
          nullable: true
          description: 生日 YYYY-MM-DD。未填为 null。
        gender:
          type: string
          nullable: true
          description: 女性 / 男性 / 其他 / 不愿透露。未填为 null。PUT 也接受 UI 用的「女」「男」。
        explore_preferences:
          type: array
          description: 探索偏好，可多选。取值仅限个人档案八项。未填为空数组。
          items:
            type: string
            enum: [感情与关系, 工作与学业, 自我成长, 人生选择, 日常生活, 财务与规划, 情绪与疗愈, 人际相处]
        explore_preference_options:
          type: array
          description: 个人档案可选的探索偏好全集，便于客户端渲染选项。
          items:
            type: string
        wechat_openid:
          type: string
          nullable: true
          description: 已绑微信身份。未绑为 null。值为服务端换票后的 unionid 或 openid，不是客户端 code。
        apple_sub:
          type: string
          nullable: true
          description: 已绑苹果 sub。未绑为 null。
        timezone:
          type: string
          description: IANA 时区，默认 Asia/Shanghai。影响业务日与今日免费重置。
        name:
          type: string
          description: 昵称。微信登录优先微信昵称；邮箱/苹果登录生成 4–6 个汉字随机昵称。可自行修改。
        nickname:
          type: string
          description: 与 name 相同。账号页展示昵称。
        bio:
          type: string
          description: 简介。未设置时为空字符串。
        avatar_url:
          type: string
          nullable: true
          description: 头像 URL。已上传或微信转存的地址；未设置时返回内置默认头像 /uploads/avatar-default.png。可 POST /uploads 后再 PUT 更换。
        public_id:
          type: string
          description: 6 位短公开 ID，首次读档案时生成并固化。
        account_display:
          type: string
          description: |
            账号页主展示。优先脱敏邮箱（本地第一部分字符 + *** + @域名）。
            无邮箱则「微信已绑定」或「Apple 已绑定」。无手机号。
    ProfileBody:
      type: object
      additionalProperties: false
      properties:
        birth_date:
          type: string
          description: 空字符串表示不修改。服务端不校验日期格式。
        gender:
          type: string
          description: |
            空字符串表示不修改。非空允许「女性」「男性」「其他」「不愿透露」，以及个人档案 UI 的「女」「男」。
            「女」存为女性，「男」存为男性，「其他」原样入库，不再映射为不愿透露。
          enum: ['', 女性, 男性, 其他, 不愿透露, 女, 男]
        explore_preferences:
          type: array
          description: 省略不修改。传数组则整表替换。只允许个人档案八项，可空数组清空。
          items:
            type: string
            enum: [感情与关系, 工作与学业, 自我成长, 人生选择, 日常生活, 财务与规划, 情绪与疗愈, 人际相处]
        timezone:
          type: string
          description: 空字符串表示不修改。非空必须是 time.LoadLocation 可识别的 IANA 时区。
        name:
          type: string
          description: 空字符串表示不修改。非空最多 32 个字。账号中心「昵称」。
        nickname:
          type: string
          description: 与 name 同一列。仅填 nickname 时写入 name；两个都传则以 name 为准。
        bio:
          type: string
          description: 空字符串表示不修改。非空最多 200 个字。
        avatar_url:
          type: string
          description: |
            空字符串表示不修改。非空须为 http(s) URL 或 /uploads/{name}。
            改头像先 POST /api/app/v1/uploads（folder=misc），再把返回的 data.url 写到这里。没有单独的上传头像 path。
    AppAuthSession:
      type: object
      properties:
        accessToken:
          type: string
          description: App JWT，放进 Authorization Bearer。约 7 天过期。不签发 refresh。
        id:
          type: integer
          format: int64
          description: 登录用户数字 id。
        reward_consumed:
          type: boolean
          description: 登录后尝试结算未扣费占卜时，是否扣了注册奖励。
        needs_confirm:
          type: boolean
          description: 额度结算是否需要确认。当前实现多为 false。
        quota_prompt:
          type: string
