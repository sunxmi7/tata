          description: 检测所用模型。
        suggestions:
          type: integer
          description: 当前实现固定为 3，不是从模型输出解析的条数。
          example: 3
    CreateReadingBody:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          description: 最长 200 个码点。超长文案为「问题超过 200 个码点，正式计数口径尚未确认」。
        type:
          type: string
          description: 省略或空字符串时为 normal。只允许 normal、tarotist、explore。
          enum: ['', normal, tarotist, explore]
        source:
          type: string
          description: |
            explore：把 normal/explore 记为 explore，并跳过检测。
            preset：跳过检测。
            其他字符串没有额外效果。
        skip_detect:
          type: boolean
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: type=tarotist 时必填，且塔罗师必须启用。
    QuestionBody:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
    SpreadSelectBody:
      type: object
      additionalProperties: false
      required: [spread_id]
      properties:
        spread_id:
          type: integer
          format: int64
    DrawBody:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          description: normal 随机抽牌；numerology 按 numbers 映射牌面。
          enum: [normal, numerology]
        numbers:
          type: array
          items:
            type: integer
          description: mode=numerology 时必填。1–78、不重复、长度等于牌阵牌位数。number N 对应 Rider-Waite 第 N 张（1=愚者）。
    ConfirmQuotaBody:
      type: object
      additionalProperties: false
      properties:
        consume:
          type: boolean
          description: 省略、非法 JSON 或 false：不扣额度，记录保留。true：按共享优先级扣一次 play。
    PaywallBody:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [cancel, resume]
          description: |
            cancel：把 pending / unconfigured 的 paywall 标为 cancelled，不生成。
            resume：再次尝试扣费并继续当时挂起的动作（洗牌、抽牌、解读、今日一牌、追问）。余额或单价仍不足时该任务不会出现在结果里。
    FollowupBody:
      type: object
      additionalProperties: false
      required: [text, continuation]
      properties:
        text:
          type: string
        continuation:
          type: boolean
          description: |
            false：另开一条 normal 占卜，本接口不扣费（charged_here=false），新记录自己的创建逻辑会扣。
            true：必须已经完成解读且牌面已固定，登录后按共享优先级扣 followup:{turn}。
    WorkflowBody:
      type: object
      description: 正文可省略。解析失败时按「有没有牌面」选择默认步骤。未知字段不会被拒绝。
      properties:
        steps:
          type: array
          items:
            type: string
          description: |
            已知步骤为 detect、rewrite、recommend、interpret、tarotist。
            空数组时：还没有牌面则 detect、rewrite、recommend；已有牌面则 interpret。
            interpret / tarotist 会调用 generate 并写库。其余已知步骤不落库。
            未知字符串不会让整个请求失败，对应 step.error 为「未知步骤」。
    DailyBody:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: 省略或 today 为今日一牌；tomorrow 为明日运势。其他值拒绝。
          enum: ['', today, tomorrow]
    EmailCodeBody:
      type: object
      additionalProperties: false
      required: [email, scene]
      properties:
        email:
          type: string
          description: 必填。收验证码的邮箱。服务端转小写后比较；含空格或格式不对返回「邮箱不正确」。
        scene:
          type: string
          description: |
            必填。发码场景：
            register 注册前发码，该邮箱已有账号时返回「邮箱已注册」；
            bind 绑定邮箱，必须先登录，未登录为 HTTP 401。
            登录不发码。同一邮箱同一 scene 60 秒内只能发一次，每小时最多 10 次。
          enum: [register, bind]
      example:
        email: demo@tata.local
        scene: register
    EmailCodeResult:
      type: object
      properties:
        expires_in:
          type: integer
          description: 验证码有效秒数，固定 300。响应里不回验证码，验证码只在邮件正文。
    RegisterBody:
      type: object
      additionalProperties: false
      required: [email, password, code]
      properties:
        email:
          type: string
          description: 必填。注册邮箱，按小写比较。已注册返回「邮箱已注册」。
        password:
          type: string
          description: 必填。登录密码。
        code:
          type: string
          description: 必填。邮箱验证码，6 位数字，5 分钟有效。先调 POST /auth/email/code 且 scene=register。不对或过期返回「验证码不正确或已过期」。
        anonymous_id:
          type: string
          description: 选填。传入匿名进入拿到的 anonymous_id 时，把该 id 下尚未归属的占卜转到新用户。
    LoginBody:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: 必填。登录邮箱，按小写比较。
        password:
          type: string
          description: 必填。登录密码。邮箱、密码错误或账号已注销，均返回「邮箱或密码错误」。
        anonymous_id:
          type: string
          description: 选填。传入匿名进入拿到的 anonymous_id 时，把该 id 下尚未归属的占卜转到此用户。
    WechatBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: 必填。微信开放平台移动应用 SDK 返回的临时授权码。iOS / Android 共用同一套 appId。服务端拿它向微信换 openid 或 unionid，客户端不要传 openid。
    AppleBody:
      type: object
      additionalProperties: false
      required: [identity_token]
      properties:
        identity_token:
          type: string
          description: 必填。仅 iOS。Sign in with Apple 返回的 identity_token（JWT）。服务端用 Apple JWKS 校验后取 sub，客户端不要传 sub。安卓没有苹果登录。
    EmailBindBody:
      type: object
      additionalProperties: false
      required: [email, password, code]
      properties:
        email:
          type: string
          description: 必填。要绑定的邮箱，按小写比较。已绑过邮箱不能换绑。
        password:
          type: string
          description: 必填。给该邮箱设置的登录密码。
        code:
          type: string
          description: 必填。邮箱验证码。先调 POST /auth/email/code 且 scene=bind。不对或过期返回「验证码不正确或已过期」。
    MergeConfirmBody:
      type: object
      additionalProperties: false
      required: [merge_request_id, confirm]
      properties:
        merge_request_id:
          type: integer
          format: int64
        confirm:
          type: boolean
          description: false 时直接拒绝，不合并。
    BindConflict:
      type: object
      properties:
        bound:
          type: boolean
          example: false
          description: 当前请求是否已绑定成功。冲突时为 false。
        conflict:
          type: boolean
          example: true
          description: 该身份已被其他未注销账号占用。
        merged:
          type: boolean
          example: false
          description: 是否已经合并。冲突响应里为 false。
        confirm_required:
          type: boolean
          example: true
          description: 需要再调 merge-confirm。冲突时为 true。
        merge_request_id:
          type: integer
          format: int64
          description: 待确认的合并请求 id。交给 POST /auth/merge-confirm。
        primary_user_id:
          type: integer
          format: int64
          description: 当前登录用户，合并后的主账号。
        secondary_user_id:
          type: integer
          format: int64
          description: 占用该身份的另一个账号。
        identity_kind:
          type: string
          enum: [wechat, apple, email]
          description: 发生冲突的身份种类。
    BindConflictEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 绑定冲突固定为 1。
        message:
          type: string
          example: 身份已被其他账号占用，需要确认后才会合并
          description: 冲突说明。
        data:
          $ref: '#/components/schemas/BindConflict'
          description: 冲突详情，含 merge_request_id。
    MergeParties:
      type: object
      properties:
        primary_user_id:
          type: integer
          format: int64
          description: 主账号 id。
        secondary_user_id:
          type: integer
          format: int64
          description: 被合并的次账号 id。
        surviving_user_id:
          type: integer
          format: int64
          description: 仅 after 中出现，等于主账号。
    MergeOutcome:
      type: object
      description: |
        只在 confirm=true 且合并成功（或已经合并、重放保存结果）时作为 data。
        钻石余额会在库内加总到主账号并迁移 diamond_ledger，但本对象不返回钻石数量。iap_orders 不改写。
        次账号的 App refresh（若有）会被吊销，之后次账号 access 也会因 merged_into 失效。
      properties:
        merged:
          type: boolean
          description: 是否已合并。成功或重放为 true。
        before:
          $ref: '#/components/schemas/MergeParties'
          description: 合并前双方 id。
        after:
          $ref: '#/components/schemas/MergeParties'
          description: 合并后双方 id，surviving 等于主账号。
        confirm_at:
          type: string
          format: date-time
          description: 确认合并的时间。
        reward_before_primary:
          type: integer
          description: 合并前主账号注册奖励剩余。
        reward_before_secondary:
          type: integer
          description: 合并前次账号注册奖励剩余。
        reward_remaining:
          type: integer
          description: 合并后主账号注册奖励剩余（两者相加）。
        daily_free_remaining:
          type: integer
          description: 合并后今日免费次数剩余。
        daily_used_flags:
          type: integer
          description: 合并后今日已用标记。
        daily_slot_remaining:
          type: integer
          description: 合并后今日免费槽剩余。
        daily_slot_used:
          type: integer
          description: 合并后今日免费槽已用。
        readings_moved:
          type: integer
          format: int64
          description: 从次账号迁到主账号的占卜条数。
        messages_kept:
          type: integer
          format: int64
          description: 保留的对话消息条数。
        subscription_resolution:
          type: string
          enum: [none, selected, prompt_required]
          description: none 双方无订阅；selected 已选定一方；prompt_required 需要用户选。
        subscription_prompt_required:
          type: boolean
          description: 两边都有订阅、需要客户端提示选择时为 true。
        subscription_winner_id:
          type: integer
          format: int64
          description: 保留订阅的用户 id。无需选择时为胜出方。
        identity_prompt_required:
          type: boolean
          description: 两边同一槽都有身份、需要客户端提示时为 true。
        retained_identities:
          type: array
          items:
            type: string
          description: 主账号该槽已占用时留下的身份，形如 wechat:openid。
    IAPVerifyBody:
      type: object
      additionalProperties: false
      required: [platform, product_id, transaction_id, receipt]
      properties:
        platform:
          type: string
          enum: [app_store, play]
        product_id:
          type: string
          description: 必须能映射到 iap_skus 的商店商品号。种子 SKU 的商品号为 null，直接验单会得到「商品未映射」。
        transaction_id:
          type: string
          maxLength: 128
        original_transaction_id:
          type: string
          description: 可省略，省略时等于 transaction_id。
        receipt:
          type: string
          maxLength: 8192
          description: 非空即可进入本地映射。服务端不向商店验票，只存 SHA-256。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅桶必填，RFC3339。消耗型可省略。
        purchased_at:
          type: string
          format: date-time
          nullable: true
    IAPRestoreBody:
      type: object
      additionalProperties: false
      required: [purchases]
      properties:
        platform:
          type: string
          enum: [app_store, play]
          description: 单笔 purchase 未写 platform 时继承这里。
        purchases:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/IAPVerifyBody'
    IAPSubscription:
      type: object
      nullable: true
      properties:
        status:
          type: string
          description: 订阅状态，例如 active。无订阅时整个对象为 null。
        sku_kind:
          type: string
          nullable: true
          description: 当前订阅 SKU 种类，如 year_subscription。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅到期时间。
        auto_renew:
          type: boolean
          nullable: true
          description: 是否自动续订。本地验单时可能为 null。
    IAPOrderSnapshot:
      type: object
      description: |
        本地验单结果。verify_status=verified 只表示商品映射通过，不是商店回执。
        credit_status=amount_unconfigured 表示发放量未配置（钻石或次卡次数），对应 credited_* 为 null，余额不变。
        同一 platform+transaction_id 再次提交且已 verified 时 idempotent=true，不重复入账。
      properties:
        order_id:
          type: integer
          format: int64
          description: 本地订单 id。尚未落单的失败项可能没有。
        user_id:
          type: integer
          format: int64
          description: 入账用户 id。
        idempotent:
          type: boolean
          description: 同一 platform+transaction_id 已 verified 时为 true，不重复入账。
        unit:
          type: string
          example: diamond
          description: 账本单位，钻石为 diamond。
        sku_code:
          type: string
          description: 映射到的 iap_skus.code。
        sku_kind:
          type: string
          description: SKU 种类，见 IAPSKU.kind。
        ledger_bucket:
          type: string
          description: subscription 或 consumable。订阅入账会把该桶余额替换为发放量；消耗型在原余额上累加。
        platform:
          type: string
          description: app_store 或 play。
        product_id:
          type: string
          description: 商店商品号，按此映射 SKU。
        store_transaction_id:
          type: string
          description: 商店交易号。
        original_transaction_id:
          type: string
          description: 原始交易号。订阅续期时用来找同一订阅。
        verify_status:
          type: string
          enum: [pending, verified, failed]
          description: verified 只表示商品映射通过，不是商店回执。
        credit_status:
          type: string
          enum: [none, credited, amount_unconfigured, skipped_expired]
          description: credited 已入账；amount_unconfigured 发放量未配置；skipped_expired 订阅已过期未入账。
        credited_diamonds:
          type: integer
          nullable: true
          description: 本次入账钻石。未配置或非钻石商品为 null。
        credited_readings:
          type: integer
          nullable: true
          description: 次卡入账的解读次数。未配置或非次卡为 null。
        period_start:
          type: string
          format: date-time
          nullable: true
          description: 订阅周期开始。消耗型为 null。
        period_end:
          type: string
          format: date-time
          nullable: true
          description: 订阅周期结束。消耗型为 null。
        source:
          type: string
          enum: [verify, restore]
          description: 来自验单还是恢复购买。
        verify_message:
          type: string
          description: 验单说明或失败原因。成功可为空。
        subscription_diamonds:
          type: integer
          description: 入账后订阅桶余额。
        pack_diamonds:
          type: integer
          description: 入账后消耗包桶余额。
        subscription:
          $ref: '#/components/schemas/IAPSubscription'
          description: 当前订阅摘要。无订阅为 null。
        resumed_tasks:
          type: array
          description: 仅当本次 credit_status=credited 且存在可继续的 paywall 时出现。
          items:
            $ref: '#/components/schemas/ResumedTask'
        transaction_id:
          type: string
          description: 单笔失败、尚未形成订单快照时，restore 结果里可能只有这个字段。
        message:
          type: string
          description: 单笔失败时的原因。成功快照一般不出现。
    IAPSKU:
      type: object
      description: |
        三类价位对应三块屏：会员（月卡 / 年卡 / 次卡）、塔塔币、年运单独解锁。
        种子已填设计价（分）和 App Store 占位商品号；管理员改过的值保留。
        kind：month_subscription（会员月卡）、year_subscription（会员年卡）、reading_pack（会员次卡）、consumable_pack（塔塔币）、yearly_unlock（年运解锁）。
      properties:
        id:
          type: integer
          format: int64
          description: SKU id。
        code:
          type: string
          description: 内部编码，例如 sub_month、pack_60。
        kind:
          type: string
          enum: [month_subscription, year_subscription, reading_pack, consumable_pack, yearly_unlock]
          description: 价位种类。会员月/年/次卡、塔塔币包、年运解锁。
        ledger_bucket:
          type: string
          enum: [subscription, consumable]
          description: 入账桶。订阅类进 subscription，塔塔币包进 consumable。
        display_name:
          type: string
          description: 客户端展示名。
        app_store_product_id:
          type: string
          nullable: true
          description: App Store 商品 ID。验单按票据 product_id 映射本列。种子为占位编码（tata.membership.month 等），上架前换成 Connect 正式 ID。
        play_product_id:
          type: string
          nullable: true
          description: Google Play 商品 ID。未配置为 null。
        price_amount_minor:
          type: integer
          format: int64
          nullable: true
          description: 单位分。种子已填设计价；未配置为 null。
        price_currency:
          type: string
          nullable: true
          description: 币种，如 CNY。未配置为 null。
        diamond_grant:
          type: integer
          nullable: true
          description: 未配置为 null。验单不会把 null 当成 0 颗钻石入账。次卡与年运解锁不使用此字段。
        reading_grant:
          type: integer
          nullable: true
          description: 仅次卡。解读次数，未配置为 null。验单不会把 null 当成 0 次入账。
        period_unit:
          type: string
          description: 订阅周期单位，如 month、year。消耗型为空。
        period_count:
          type: integer
          nullable: true
          description: 周期数量。未配置为 null。
        copy:
          type: string
          description: 价位附带运营文案。年卡用于专属活动权益。空字符串表示未定稿。
        enabled:
          type: boolean
          description: 是否对 App 上架。目录只返回启用的。
        unit:
          type: string
          example: diamond
          description: 发放单位。钻石为 diamond。
        display_label:
          type: string
          example: 塔塔币
          description: UI 展示名。档位数量来自 diamond_grant。
        benefits:
          type: array
          description: 订阅 SKU 的权益结构。followup.count 取 quota_settings.followup_limit（种子 5）。年卡 campaign_perk.body 取本行 copy。消耗包为空数组。
          items:
            $ref: '#/components/schemas/SKUBenefit'
    IAPConfig:
      type: object
      properties:
        restore_hook_enabled:
          type: boolean
          description: 种子默认 true。false 时 restore 直接失败且不写订单；verify 不受影响。
        restore_required_first_pack:
          type: boolean
          description: 种子默认 false。只回传，当前恢复逻辑不检查这个开关。
    DiamondView:
      type: object
      properties:
        unit:
          type: string
          example: diamond
          description: 账本单位 diamond。
        display_label:
          type: string
          example: 塔塔币
          description: UI 展示名。
        balance:
          type: integer
          description: pack_diamonds + subscription_diamonds。
        subscription_diamonds:
          type: integer
          description: 订阅桶钻石。
        pack_diamonds:
          type: integer
          description: 消耗包桶钻石。
        subscription_period_end:
          type: string
          format: date-time
          nullable: true
          description: 当前订阅到期时间。无订阅为 null。
        subscription:
          $ref: '#/components/schemas/IAPSubscription'
          description: 当前订阅。无订阅为 null。
        user_id:
          type: integer
          format: int64
          description: 仅管理端钻石查询附带。
        ledger:
          type: array
          description: 仅管理端，最近 50 条。
          items:
            $ref: '#/components/schemas/DiamondLedgerRow'
    DiamondLedgerRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 流水 id。
        bucket:
          type: string
          enum: [subscription, consumable]
          description: 变动所在桶。
        delta:
          type: integer
          description: 变动量，带符号。正为入账，负为扣减。
        balance_after:
          type: integer
          description: 该桶变动后的余额。
        order_id:
          type: integer
          format: int64
          nullable: true
          description: 关联 IAP 订单。非购买为 null。
        store_transaction_id:
          type: string
          description: 关联商店交易号。无则为空。
        reason:
          type: string
          description: 原因，如 redeem、quota_spend、admin_grant。
        created_at:
          type: string
          format: date-time
          description: 记账时间。
    ResumedTask:
      type: object
      properties:
        reading_id:
          type: integer
          format: int64
          description: 被继续的占卜 id。
        charge_key:
          type: string
          description: 当时挂起的扣费键。
        resume_action:
          type: string
          enum: [hold, shuffle, draw, interpret, daily_draw, followup]
          description: 付费后继续的动作。
        entitlement:
          type: string
          description: 本次扣费使用的权益。
        quota_outcome:
          type: string
          description: 继续时的额度结果。
        status:
          type: string
          description: 继续后的占卜状态。
        generated:
          type: boolean
          description: 继续后是否已生成解读。
    FollowupOKData:
      type: object
      properties:
        turn_id:
          type: integer
          format: int64
          description: 本轮追问 id。
        bubbles:
          type: array
          maxItems: 4
          description: 追问气泡文案，最多 4 条。
          items:
            type: string
        cards_unchanged:
          type: boolean
          example: true
          description: 追问不改牌面，恒为 true。
        error:
          type: string
          description: 模型失败时出现。文案说明未重新扣次数或钻石。
        quota_outcome:
          type: string
          description: 本轮额度结果。另开新占卜时可能为空。
        entitlement:
          type: string
          description: 本轮扣费权益。未扣为空。
        charged:
          type: boolean
          description: 试用（ai_trial）为 false。
        new_reading:
          type: boolean
          description: continuation=false 时另开新占卜为 true。
        reading:
          $ref: '#/components/schemas/ReadingCreated'
          description: 另开新占卜时的新记录。同记录追问可不出现。
        charged_here:
          type: boolean
          description: 本接口是否当场扣费。另开新占卜为 false。
    DailyReuseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 复用已有今日/明日结果时为 1，不是失败。
        message:
          type: string
          description: 当日名额已占用，或「该日已有结果，不重复扣次数或钻石」。
        data:
          type: object
          description: 已有结果。
          properties:
            reused:
              type: boolean
              example: true
              description: 复用已有结果，恒为 true。
            charged:
              type: boolean
              example: false
              description: 未再扣费，恒为 false。
            reading:
              $ref: '#/components/schemas/Reading'
              description: 当日已有的那条占卜。
    ConfirmQuotaData:
      type: object
      properties:
        quota_consumed:
          type: boolean
          description: consume=true 且成功扣费时为 true。
        entitlement:
          type: string
          description: 扣到的权益种类。未扣为空。
        quota_outcome:
          type: string
          description: 额度结果，如 charged、already、paywall。
        message:
          type: string
          description: 给用户看的说明。无则空。
    UseRewardData:
      type: object
      description: 尽管路径叫 use-reward，实际走共享优先级，不保证扣的是注册奖励。
      properties:
        reward_consumed:
          type: boolean
          description: 仅当本次 entitlement=registration_reward 时为 true。
        already:
          type: boolean
          description: 该占卜此前已扣过额度时为 true。
        entitlement:
          type: string
          description: 实际扣到的权益。
        quota_outcome:
          type: string
          description: 额度结果。
        note:
          type: string
          example: 已按优先级处理：注册奖励，今日免费次数，人工补发免费次数，然后钻石
          description: 优先级说明文案。
    PaywallResult:
      type: object
