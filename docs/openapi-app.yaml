      tags: [首页, 抽牌]
      operationId: appListTarotists
      summary: 可用塔罗师
      security:
        - AppBearer: []
      description: 只返回启用中的塔罗师。首页卡字段：name、title/tags、blurb、avatar_url（可空）。不返回人设/禁止项正文。
      responses:
        '200':
          description: data 为塔罗师数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TarotistPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/quota:
    get:
      tags: [首页, 我的中心, 塔塔币购买]
      operationId: appQuota
      summary: 当前额度
      security:
        - AppBearer: []
      description: |
        匿名用户仍返回结构，次数与钻石为 0，daily_free_used=false。
        diamond_cost 未配置时为 null，diamond_cost_configured=false。
        followup_limit 为每条解读可追问次数，种子默认 5，null 不限制。
        display_label 为「塔塔币」（展示名）；paid_label 仍为「钻石」。balance 为两桶合计。
      responses:
        '200':
          description: data 为 QuotaView。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuotaView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings:
    get:
      tags: [历史记录]
      operationId: appListReadings
      summary: 我的占卜列表
      security:
        - AppBearer: []
      description: |
        登录用户按 user_id，匿名按 anonymous_id。不含已删除。按 id 降序（比 updated_at 翻页更稳）。
        游标分页：limit 默认 20、上限 100；用上一页的 next_cursor 作为下一页的 before_id。可按 type 过滤。
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 每页条数。空或非法用 20，超过 100 截到 100。
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 游标：只返回 id 小于该值的记录。首页省略。非正数返回「before_id 不正确」。
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [normal, tarotist, explore, daily]
          description: 按占卜类型过滤。非法值返回「type 不正确」。
      responses:
        '200':
          description: data 为分页对象 ReadingPage。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReadingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [抽牌]
      operationId: appCreateReading
      summary: 创建占卜
      security:
        - AppBearer: []
      description: |
        状态从 QUESTION_CREATED 开始。问题最长 200 个码点。
        登录用户的 normal / tarotist 在此按共享优先级扣 play；塔罗师首次可走 ai_trial。
        explore 不在此扣费（quota_outcome=deferred）。匿名不预扣（quota_outcome=anonymous）。
        额度不足时仍 code=0，记录保留，paywall 或 diamond_cost_unconfigured 在 data 里，不编造单价。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReadingBody'
      responses:
        '200':
          description: code=0 时 data 为 ReadingCreated。幂等重放会原样返回首次包络。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingCreatedOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}:
    get:
      tags: [历史记录, 抽牌]
      operationId: appGetReading
      summary: 占卜详情
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 不属于当前用户、已删除或不存在时为业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [历史记录]
      operationId: appDeleteReading
      summary: 删除占卜
      security:
        - AppBearer: []
      description: 软删除。匿名用户返回「登录后才能删除」。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/question:
    put:
      tags: [抽牌]
      operationId: appEditQuestion
      summary: 修改问题
      security:
        - AppBearer: []
      description: |
        普通占卜只能在 QUESTION_CREATED 或 SPREAD_SELECTED，且没有跳过检测。
        explore 在 COMPLETED / INTERPRETING 之前可改。抽牌后不能改。最长 200 个码点。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionBody'
      responses:
        '200':
          description: 成功 data 为更新后的 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/detect:
    post:
      tags: [抽牌]
      operationId: appDetect
      summary: 问题检测
      security:
        - AppBearer: []
      description: |
        用绑定的 detect 任务跑模型。无请求体。
        成功后把 skip_detect 置为 false。suggestions 固定为 3。
        模型错误以业务错误返回 step.Error，不写解读正文。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: code=0 时 data 为检测文本。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DetectResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/spread:
    post:
      tags: [牌阵界面, 抽牌]
      operationId: appSelectSpread
      summary: 选择牌阵
      security:
        - AppBearer: []
      description: 仅 QUESTION_CREATED 可进入 SPREAD_SELECTED。牌阵必须启用。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpreadSelectBody'
      responses:
        '200':
          description: 成功 data 为 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/shuffle:
    post:
      tags: [抽牌]
      operationId: appShuffle
      summary: 洗牌
      security:
        - AppBearer: []
      description: |
        登录用户先过 play 额度门槛，不够则返回 QuotaBlockEnvelope（code=1），状态不变。
        匿名不预扣。成功把 SPREAD_SELECTED 改为 SHUFFLING。无请求体。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功为 Reading；额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/cut:
    post:
      tags: [抽牌]
      operationId: appCut
      summary: 切牌
      security:
        - AppBearer: []
      description: 仅 SHUFFLING 可进入 CUTTING。不再次扣费。无请求体。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功 data 为 Reading。状态不对时「请先洗牌」。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/draw:
    post:
      tags: [抽牌, 牌阵界面]
      operationId: appDraw
      summary: 抽牌
      security:
        - AppBearer: []
      description: |
        登录用户先过 play 额度门槛。状态须为 SPREAD_SELECTED 或 CUTTING。
        SHUFFLING 会提示先切牌。mode 为 normal（随机）或 numerology（灵数 1–78 不重复、个数=牌位数，映射 Rider-Waite 顺序，正位）。
        成功后状态 CARDS_FIXED。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrawBody'
      responses:
        '200':
          description: 成功为 Reading；额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/interpret:
    post:
      tags: [抽牌]
      operationId: appInterpret
      summary: 生成解读
      security:
        - AppBearer: []
      description: |
        explore 且问题为空会拒绝。登录用户先过 play 门槛。
        生成前必须已登录、牌面已固定、额度已结算。未绑定供应商会把状态写成 FAILED_RETRYABLE。
        失败文案「解读失败，可重试，未重新扣费」。无请求体。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功 data 为完成后的 Reading。额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/interpret/stream:
    post:
      tags: [抽牌]
      operationId: appInterpretStream
      summary: 生成解读（SSE 流式）
      security:
        - AppBearer: []
      description: |
        与 interpret 相同的额度门槛与落库，但以 SSE 逐段下发，供打字机效果。无请求体。
        额度拦截发生在切换到流之前，仍返回普通 JSON 的 QuotaBlockEnvelope（Content-Type application/json）。
        通过后 Content-Type 为 text/event-stream，事件：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"reading": Reading}`，解读已 COMPLETED 并落库。
        - `error`：`data: {"message":"..."}`，生成失败（已置 FAILED_RETRYABLE，未重新扣费）。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功为 text/event-stream 事件流；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流：每个事件形如 event 行 + data 行（JSON），空行分隔。"
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/confirm-quota:
    post:
      tags: [抽牌]
      operationId: appConfirmQuota
      summary: 确认是否扣额度
      security:
        - AppBearer: []
      description: |
        匿名用户拒绝。已经扣过则 code=0，message「已经扣过，不再扣」，不再扣。
        consume 不为 true 时不扣，记录保留。
        consume=true 时按共享优先级扣 play；不够则 QuotaBlockEnvelope。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmQuotaBody'
      responses:
        '200':
          description: 确认结果或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/ConfirmQuotaData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/use-reward:
    post:
      tags: [抽牌]
      operationId: appUseReward
      summary: 按共享优先级扣一次
      security:
        - AppBearer: []
      description: |
        无请求体。名字是 use-reward，实现是 chargeOwned(play)，顺序仍是注册奖励、今日免费、人工补发、钻石。
        不保证扣到注册奖励。reward_consumed 仅在 entitlement=registration_reward 时为 true。
        钻石单价未配置或余额不足时返回 QuotaBlockEnvelope，不编造消耗数量。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 扣费结果或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/UseRewardData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/paywall:
    post:
      tags: [会员中心, 抽牌]
      operationId: appPaywall
      summary: 取消或继续付费等待
      security:
        - AppBearer: []
      description: |
        cancel：保留记录，不生成。没有 pending/unconfigured 行时「没有可取消的付费等待」。
        resume：对当前用户所有挂起的 paywall 再试一次扣费。单价未配置或钻石仍不足的任务被跳过，不会伪造支付成功。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaywallBody'
      responses:
        '200':
          description: code=0 时 data 为取消结果或 resumed_tasks。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/PaywallResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/followups:
    post:
      tags: [抽牌]
      operationId: appFollowup
      summary: 追问
      security:
        - AppBearer: []
      description: |
        continuation 必填。false 时新建 normal 占卜。
        true 时记录类型须为 normal、explore、daily、tarotist，且解读已完成、牌面已固定。
        匿名用户在延续追问时被拒绝。登录后按 followup:{turn} 扣费，不够则 QuotaBlockEnvelope，并把追问文本记在 resume_payload。
        每条解读追问次数受 quota_settings.followup_limit 限制（种子 5，null 不限制）；超限返回「本条解读追问已达上限」。
        含「别这样说」或「不舒服」会关掉照野调侃。模型失败不重复扣费。气泡最多 4 条。
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupBody'
      responses:
        '200':
          description: 延续追问、新建占卜，或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/FollowupOKData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/followups/stream:
    post:
      tags: [抽牌]
      operationId: appFollowupStream
      summary: 追问（SSE 流式）
      security:
        - AppBearer: []
      description: |
        仅支持延续追问（continuation 必须为 true；新建占卜请用非流式 followups）。
        额度/轮次/扣费与非流式一致；额度拦截在切换到流之前，返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream，事件：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"followup": FollowupOKData}`，气泡已落库。
        - `error`：`data: {"message":"..."}`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupBody'
      responses:
        '200':
          description: 成功为 text/event-stream 事件流；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/messages:
    get:
      tags: [历史记录, 抽牌]
      operationId: appMessages
      summary: 追问消息
      security:
        - AppBearer: []
      description: 按 turn_id、seq 升序。须拥有该占卜。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为消息数组。App 列表不含 reading_id。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/workflow:
    post:
      tags: [抽牌]
      operationId: appWorkflow
      summary: 按步骤跑工作流
      security:
        - AppBearer: []
      description: |
        请求体可空。detect / rewrite / recommend 不落库。
        interpret / tarotist 在牌面已固定时调用 generate，会写解读并扣已有额度规则。
        未知步骤记在 step.error，不让整个请求失败。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowBody'
      responses:
        '200':
          description: code=0 时 data 含 reading 与 steps。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppWorkflowResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/daily:
    post:
      tags: [首页, 日历记录, 我的小组件]
      operationId: appDaily
      summary: 今日或明日一牌
      security:
        - AppBearer: []
      description: |
        必须登录。同一用户、同一 business_date 已有牌面则 code=1，reused=true，charged=false，不重复扣费。
        否则按共享优先级扣 play（不允许塔罗师试用）。单价未配置或钻石不足为 QuotaBlockEnvelope。
        扣费成功后抽一张牌并生成解读。生成失败仍 code=0，返回已固定牌面、可能为 FAILED_RETRYABLE 的记录。
        成功/复用记录带首页卡字段：card_name、short_text、yi（可空）、card_thumbnail（有牌则必有 URL，未配正式图时为内置默认牌背）、target、business_date、has_result。不编造宜忌文案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyBody'
      responses:
        '200':
          description: 新结果、复用或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/DailyReuseEnvelope'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/calendar:
    get:
      tags: [日历记录]
      operationId: appCalendar
      summary: 日历
      security:
        - AppBearer: []
      description: 必须登录。data 为 {days, cycle, tomorrow_date}。days 只含未删除且 business_date 非空的记录。month 按前缀匹配，例如
        2026-10。type 可按 normal/tarotist/explore/daily 过滤。tomorrow_date 供首页明日运势预览。
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: 2026-10
        - name: type
          in: query
          required: false
          schema:
            type: string
