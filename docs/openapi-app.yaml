      tags: [年度运势]
      operationId: appUnlockYearlyReport
      summary: 解锁年度运势
      description: 必须登录。年卡有效则免费解锁；已定价则提示通过内购单独解锁；未定价则「年卡未开通，单独购买价格未配置」。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/profile:
    put:
      tags: [年度运势]
      operationId: appYearlyProfile
      summary: 年运填写基本信息
      description: |
        必须已解锁。birth_date（YYYY-MM-DD，不能是未来）、birth_time（HH:MM）、birth_place 必填。gender 可选：女性 / 男性 / 其他 / 不愿透露。
        同时写入档案。完成后 step=rhythm。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearlyProfileBody'
            examples:
              成功:
                summary: 填写年运资料
                value:
                  birth_date: "1990-01-01"
                  birth_time: "08:30"
                  birth_place: 北京
                  gender: 不愿透露
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/yearly-reports/{id}/rhythm:
    post:
      tags: [年度运势]
      operationId: appYearlyRhythm
      summary: 年运抽十二宫牌阵
      description: |
        必须已填基本信息。mode=normal 或不传 numbers 为随机抽 12 张（自我、财富、沟通、家庭、创造、日常、伴侣、深层、远行、事业、社群、潜意识）。
        mode=pick 或只传 numbers 时，numbers 为 12 个不重复的 1–78，映射 Rider-Waite。
        抽完不可重抽。响应 rhythm_cards 与 house_cards 同内容。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearlyDrawBody'
            examples:
              成功:
                summary: 抽取十二宫牌
                value:
                  mode: normal
      responses:
        '200':
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyReport'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
