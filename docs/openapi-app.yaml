          type: string
          description: 6 位短公开 ID，首次读档案时生成并固化。
        account_display:
          type: string
          description: |
            账号页主展示。优先脱敏邮箱（本地第一部分字符 + *** + @域名）。
            无邮箱则「微信已绑定」或「Apple 已绑定」。无手机号。
    ProfileBody:
      type: object
      additionalProperties: false
      properties:
        birth_date:
          type: string
          description: 空字符串表示不修改。服务端不校验日期格式。
        gender:
          type: string
          description: 空字符串表示不修改。非空只允许「女性」「男性」「不愿透露」。
          enum: ['', 女性, 男性, 不愿透露]
        timezone:
          type: string
          description: 空字符串表示不修改。非空必须是 time.LoadLocation 可识别的 IANA 时区。
        name:
          type: string
          description: 空字符串表示不修改。非空最多 32 个字。
        bio:
          type: string
          description: 空字符串表示不修改。非空最多 200 个字。
        avatar_url:
          type: string
          description: |
            空字符串表示不修改。非空须为 http(s) URL 或 /uploads/{name}。
            改头像先 POST /api/app/v1/uploads（folder=misc），再把返回的 data.url 写到这里。没有单独的上传头像 path。
