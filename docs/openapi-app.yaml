  /api/app/v1/readings/{id}/recommend:
    post:
      tags: [抽牌]
      operationId: appRecommend
      summary: 推荐牌阵
      description: |
        不调用模型。按 PRD §6.4 本地问题→牌阵匹配：从问题检测快照（invalid/broad/specific + main_intent/main_structure）
        对照嵌入的 19 套普通牌阵能力配置，返回 0 或 1 个 recommended_spreads。
        match_status 为 MATCHED / NO_MATCH / NO_MATCH_MAIN_INTENT / INPUT_NOT_MATCHABLE；mapping_status 为 draft_v1。
        每项含 id、name、description、short_sentence、card_count、recommended、thumbnail、depth_group、depth_label。
        已登录带令牌。未登录不带令牌，query 带 device_id。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 含 recommended_spreads。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/DetectResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/readings/{id}/spread-choices:
    get:
      tags: [牌阵界面, 抽牌]
      operationId: appSpreadChoices
      summary: 牌阵选项
      description: |
        返回这一次占卜的牌阵选项，包在 messages 里，一条类型十六（kind=cards，style=choose）。选牌阵、更多牌阵、常规/灵数抽牌在同一条消息里。
        列表中 recommended 会按该次问题的本地匹配（与 POST /recommend 同源 §6.4）覆盖角标：匹配成功时仅命中牌阵为 true 并排在最前；匹配失败则全部为 false。
        more_spreads 文案固定为「更多牌阵」；是否展示由 App 在展开前后自行控制。
        不是分组目录。分组目录走 GET /spreads。
        未登录不带令牌，query 带 device_id。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为 reading_id、has_more、messages。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConversationData'
        '401':
          $ref: '#/components/responses/Unauthorized'
