          type: string
          description: 已绑邮箱。未绑为空字符串或 null。
        birth_date:
          type: string
          nullable: true
          description: 生日 YYYY-MM-DD。未填为 null。
        gender:
          type: string
          nullable: true
          description: 女性 / 男性 / 不愿透露。未填为 null。
        wechat_openid:
          type: string
          nullable: true
          description: 已绑微信身份。未绑为 null。值为服务端换票后的 unionid 或 openid，不是客户端 code。
        apple_sub:
          type: string
          nullable: true
          description: 已绑苹果 sub。未绑为 null。
        timezone:
          type: string
          description: IANA 时区，默认 Asia/Shanghai。影响业务日与今日免费重置。
