        generated_for:
          nullable: true
        share_hint:
          type: string
        rhythm_cards:
          type: array
        domain_cards:
          type: array
    HelpCategoryList:
      type: object
      properties:
        categories:
          type: array
          description: 帮助分类。
          items:
            $ref: '#/components/schemas/HelpCategory'
    HelpCategory:
      type: object
      properties:
        id:
          type: string
          description: 分类 id。
        title:
          type: string
          description: 分类标题。
        articles_status:
          type: string
          enum: [ready, pending]
          description: 该分类是否已有条目。
        empty_note:
          type: string
          description: 分类下还没有条目、且 articles_status=pending 时展示这段说明。当前两类都是 ready，此项为空。
    HelpArticleList:
      type: object
      properties:
        items:
          type: array
          description: 文章摘要列表。无结果时为空数组。
          items:
            $ref: '#/components/schemas/HelpArticleSummary'
        query:
          type: string
          description: 本次搜索关键词。未搜索为空。
        empty_title:
          type: string
          description: 仅搜索无结果时为「暂时没有找到相关问题」，否则为空字符串。
        empty_hint:
          type: string
          description: 仅搜索无结果时为「换个关键词，或向我们反馈」。
        category_note:
          type: string
          description: 未搜索且该分类没有条目时，返回分类的 empty_note。
    HelpArticleSummary:
      type: object
      properties:
        id:
          type: string
          description: 文章 id。
        title:
          type: string
          description: 文章标题。
        category_id:
          type: string
          description: 所属分类 id。
        category_title:
          type: string
          description: 所属分类标题。
    HelpArticle:
      allOf:
        - $ref: '#/components/schemas/HelpArticleSummary'
        - type: object
          properties:
            body:
              type: string
              description: 问题正文。使用与占卜、账号与设置已写入正式问答。未定稿时为「待确认」。
            body_status:
              type: string
              enum: [pending, ready]
              description: pending 正文为「待确认」；ready 已有正式正文。
    PushRegisterBody:
      type: object
      additionalProperties: false
      required: [cid]
      properties:
        cid:
          type: string
          description: 个推客户端 CID。
        platform:
          type: string
          enum: ['', ios, android]
          description: 省略为空。
        enabled:
          type: boolean
          description: 省略默认 true。false 可临时停用该设备下发。
    PushDevice:
      type: object
      properties:
        cid:
          type: string
          description: 个推客户端 CID。
        platform:
          type: string
          description: ios、android 或空字符串。
        enabled:
          type: boolean
          description: 是否对该设备下发。false 为临时停用。
    InboxList:
      type: object
      properties:
        items:
          type: array
          description: 站内信列表。无消息时为空数组。
          items:
            $ref: '#/components/schemas/InboxMessage'
        unread_count:
          type: integer
          description: 未读条数。
    InboxMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 站内信 id。已读接口用这个。
        category:
          type: string
          description: campaign/promo/system 等。
        title:
          type: string
          description: 标题。
        body:
          type: string
          description: 正文。
        target:
          type: string
          description: 跳转链接 / 深链，可空。
        created_at:
          type: string
          format: date-time
          description: 创建时间。
        read:
          type: boolean
          description: 是否已读。
