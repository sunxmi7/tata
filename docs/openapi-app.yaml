          example: 3
    CreateReadingBody:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          description: 最长 200 个码点。超长文案为「问题超过 200 个码点，正式计数口径尚未确认」。
        type:
          type: string
          description: 省略或空字符串时为 normal。只允许 normal、tarotist、explore。
          enum: ['', normal, tarotist, explore]
        source:
          type: string
          description: |
            explore：把 normal/explore 记为 explore，并跳过检测。
            preset：跳过检测。
            其他字符串没有额外效果。
        skip_detect:
          type: boolean
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: type=tarotist 时必填，且塔罗师必须启用。
    QuestionBody:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
    SpreadSelectBody:
      type: object
      additionalProperties: false
      required: [spread_id]
      properties:
        spread_id:
          type: integer
          format: int64
    DrawBody:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          description: normal 随机抽牌；numerology 按 numbers 映射牌面。
          enum: [normal, numerology]
        numbers:
          type: array
          items:
            type: integer
          description: mode=numerology 时必填。1–78、不重复、长度等于牌阵牌位数。number N 对应 Rider-Waite 第 N 张（1=愚者）。
    ConfirmQuotaBody:
      type: object
      additionalProperties: false
      properties:
        consume:
          type: boolean
          description: 省略、非法 JSON 或 false：不扣额度，记录保留。true：按共享优先级扣一次 play。
    PaywallBody:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [cancel, resume]
          description: |
            cancel：把 pending / unconfigured 的 paywall 标为 cancelled，不生成。
            resume：再次尝试扣费并继续当时挂起的动作（洗牌、抽牌、解读、今日一牌、追问）。余额或单价仍不足时该任务不会出现在结果里。
    FollowupBody:
      type: object
      additionalProperties: false
      required: [text, continuation]
      properties:
        text:
          type: string
        continuation:
          type: boolean
          description: |
            false：另开一条 normal 占卜，本接口不扣费（charged_here=false），新记录自己的创建逻辑会扣。
            true：必须已经完成解读且牌面已固定，登录后按共享优先级扣 followup:{turn}。
    WorkflowBody:
      type: object
      description: 正文可省略。解析失败时按「有没有牌面」选择默认步骤。未知字段不会被拒绝。
      properties:
        steps:
          type: array
          items:
            type: string
          description: |
            已知步骤为 detect、rewrite、recommend、interpret、tarotist。
            空数组时：还没有牌面则 detect、rewrite、recommend；已有牌面则 interpret。
            interpret / tarotist 会调用 generate 并写库。其余已知步骤不落库。
            未知字符串不会让整个请求失败，对应 step.error 为「未知步骤」。
    DailyBody:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: 省略或 today 为今日一牌；tomorrow 为明日运势。其他值拒绝。
          enum: ['', today, tomorrow]
    RegisterBody:
