    put:
      tags: [年度运势]
      operationId: appYearlyProfile
      summary: 年运填写基本信息
      description: |
        必须已解锁。birth_date 必填（YYYY-MM-DD，不能是未来）。gender 可选：女性 / 男性 / 不愿透露。
