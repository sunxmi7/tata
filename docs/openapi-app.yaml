      description: 必须登录。返回分享图所需品牌、标题、昵称和报告正文。不编造年度关键词或四季金句。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: data 为 YearlyShare。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/YearlyShare'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
