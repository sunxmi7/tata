        confirm_required:
          type: boolean
          example: true
        merge_request_id:
          type: integer
          format: int64
        primary_user_id:
          type: integer
          format: int64
          description: 当前登录用户，合并后的主账号。
        secondary_user_id:
          type: integer
          format: int64
        identity_kind:
          type: string
          enum: [wechat, apple, email, phone]
    BindConflictEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
          example: 身份已被其他账号占用，需要确认后才会合并
        data:
          $ref: '#/components/schemas/BindConflict'
    MergeParties:
      type: object
