# 导入 Apifox（App 端）：项目 → 导入 → OpenAPI，选择本文件 docs/openapi-app.yaml。
# 完整契约（含管理端）见 docs/openapi.yaml。
# 系统路径（/health、/demo、/admin）未收入，是否给 App 导入待确认。
# 服务地址默认 http://127.0.0.1:8080。需要登录的接口在 Headers 加 Authorization: Bearer <accessToken>。
# 分组口径（2026-11-06）：tag 已按 Pixso 定稿「手机界面」总览（节点 619:7）的 UI 模块划分，
#   导入 Apifox 后文件夹=UI 模块。共用接口（如 /quota、/uploads）挂到多个模块下。
#   月度报告/年度运势已补只读接口；语言/关于塔塔 仍无专用 path。
# 说明同时见 docs/README.md。
openapi: 3.0.3
info:
  title: 塔塔 App HTTP API
  version: 1.0.0
  description: |
    由 `server/internal/tata/routes.go` 注册的 **App 端** HTTP 接口。未在该文件出现的路径不在此契约中。完整契约（含管理端）见 `docs/openapi.yaml`。

    **导入 Apifox：** 导入 → OpenAPI，选择 `docs/openapi-app.yaml`。服务器默认 `http://127.0.0.1:8080`（`server/manifest/config/config.yaml` 的 `server.address: ":8080"`）。

    ## 包络
    `writeOK` / `writeErr` 的 JSON 为 `{ "code": 0|1, "message": "", "data": ... }`。
    - `code=0`：成功，HTTP 200，`message` 一般为空字符串。
    - `code=1`：业务失败。经 `writeErr` 或 `h()` 时 HTTP 仍多为 200，`data` 多为 `null`，`message` 为中文原因。
    - 例外：`writeQuotaBlock`、绑定冲突、今日一牌复用也是 HTTP 200 + `code=1`，但 `data` 为结构化对象。
    - 鉴权失败（`h()` 捕获 `authFail`）为 HTTP 401，`message` 为「未登录或令牌无效」。

    经 `decode` 的 JSON 会拒绝未知字段，失败文案为「请求字段不正确」。

    ## 鉴权
    需要登录（或匿名令牌）的接口：在 **Headers** 加参数 `Authorization`，值写成 `Bearer <accessToken>`（Bearer 后面有一个空格）。
    token 来自登录 / 注册 / 匿名接口的 `data.accessToken`。不要放进请求体或 Query。
    Access token 为 HS256 JWT，`typ=access`，约 2 小时过期。`aud=app`。登录用户 `sub` 为 `app_users.id`；匿名令牌 `sub=0`，`anon` 为 anonymous_id。
    已合并账号（`merged_into` 非空）或不存在的用户会被拒绝。App 登录接口不签发 refresh token。漏带或无效返回 HTTP 401「未登录或令牌无效」。

    全局 CORS 允许头：`Authorization`、`Content-Type`、`Idempotency-Key`、`Accept-Language`、`X-Language`、`Accept`。`OPTIONS` 返回 204，没有单独业务路径。

    ## App 语言（Accept-Language）
    语言偏好**不上云**（无 `profile.locale`）。客户端本地保存；App 请求携带 **`Accept-Language`**（推荐 `zh-Hans`、`zh-Hant`、`en`、`ja`、`ko`），亦可传 **`X-Language`**。未带头或无法识别时按 **`zh-Hans`**。服务端用该头查 `server/internal/tata/i18n/*.json`（简体原文为 key），本地化错误 `message`、额度提示、状态/类型标签、牌名、牌组名、预设问题和固定空状态文案。运营 CMS（帮助正文、活动详情、占卜师文案）和 AI 解读原文仍按入库语言返回。`error_code` 不随语言变化。

    ## 未配置的价格、验单与占位
    - 种子 SKU（`sub_month`、`sub_year`、`sub_times`、`pack_consumable`）的 `price_amount_minor`、`price_currency`、`diamond_grant`、`reading_grant`、商店商品号、`period_count` 保持 null。接口不编造价格、钻石数或次卡次数。
    - `POST /api/app/v1/iap/verify` 与 restore **不调用** App Store / Google Play。只保存票据的 SHA-256，按 `product_id` 映射 `iap_skus`。发放量为 null 时 `credit_status=amount_unconfigured`，不写入账。
    - `quota_settings.diamond_cost` 默认为 null。未配置时扣费走到钻石步会停住：`quota_outcome=diamond_cost_unconfigured`，不猜测单次消耗。
    - IAP 入账只写钻石账本与次卡次数（rewards.admin_grant_remaining），不写次数占位表。
    - 恢复购买受 `iap_settings.restore_hook_enabled` 控制（种子默认 true）。`restore_required_first_pack` 只回传，当前 handler 不据此拦截。
    - App P1 占位：兑换记录行字段、活动详情、参与记录、奖励记录均未定稿。列表为空数组，不编造记录。帮助中心正文固定为「待确认」。**Q-B1 已拍砍（2026-11-02）**：不注册 `POST /api/app/v1/push/register`；通知仅 `notification-preferences` + 客户端本地/OS 提醒。
    - 活动列表与帮助中心的「加载失败，请重试」是客户端在请求失败后的状态，重试同一 GET。服务端沿用现有 `code=1` 包络，不另开错误体。
servers:
  - url: http://127.0.0.1:8080
    description: 本机默认（server.address = :8080）
tags:
  - name: 登录注册
    description: 匿名进入、邮箱注册/登录、微信/苹果第三方登录。除匿名外签发 aud=app 的 access JWT，不签发 refresh。登录/注册多步 UI 为 Q-N1 后置，接口钩子已就绪。
  - name: 首页
    description: 首页聚合壳：提示窗、塔罗师、牌阵目录、额度与今日一牌。开始抽牌入口走「抽牌」分组。
  - name: 探索
    description: 探索目录分组与主题条目。点进后开局复用「抽牌」的 POST /readings（映射 Q-C7）。
  - name: 我的中心
    description: 我的页聚合入口（头像资料、塔塔币余额）。改头像走 POST /uploads（folder=misc）再 PUT /profile 的 avatar_url。其余复用档案/额度/余额读接口。
  - name: 抽牌
    description: 占卜全流程状态机：创建、问题检测、选阵、洗牌、切牌、抽牌、解读、追问、工作流，以及抽牌链路内的额度确认/付费等待。
  - name: 牌阵界面
    description: 牌阵目录与阵位、选阵与抽牌。阵位布局对照 Spread.positions。
  - name: 历史记录
    description: 我的占卜列表、详情、删除与追问消息。
  - name: 日历记录
    description: 今日/明日一牌与日历月视图。日详情项含牌名、正逆位、短文、多张缩略图、占卜师与时分。
  - name: 塔塔币购买
    description: 塔塔币（钻石）内购：SKU、验单、恢复购买、余额、流水与开关。价格/发放量未配置时为 null。
  - name: 会员中心
    description: 会员订阅权益与 SKU、验单、付费墙。权益文案 Q-C3、正式价 Q-B13 待拍。
  - name: 兑换码
    description: 兑换码核销与兑换记录。记录行字段 fields_confirmed=false，不编造记录。
  - name: 参与活动
    description: 参与活动列表、详情、参与记录与奖励记录。详情/记录为占位，不编造奖励。
  - name: 月度报告
    description: 按月汇总探索次数、陪伴天数、关注主题与寄语（寄语截取自当月已完成解读，不编造）。支持保存月报。
  - name: 年度运势
    description: 年运按定稿四步：解锁卖点 → 填基本信息 → 选 12 张全年节奏 → 抽 6 张六大领域（感情/事业/财运/健康/人际/成长）→ 生成报告。年卡免费解锁；单独购买价取 yearly_unlock SKU。卖点四段取 app_config，空则 pending。生成正文走模型，不编造。
  - name: 功能心愿单
    description: 提交功能心愿（含图片上传）。
  - name: 帮助中心
    description: 帮助分类、文章列表与搜索、文章详情。正文种子为「待确认」。
  - name: 反馈意见
    description: 提交意见反馈（含图片上传）。
  - name: 通知设置
    description: 通知偏好读写、推送设备注册与消息中心（站内信）。今日/明日抽牌为 App 本地通知；优惠/活动等消息类走个推服务端下发（2026-11-06 重启 Q-B1）。系统推送授权仍只在客户端。
  - name: 账号
    description: 登录用户档案读写、头像上传（POST /uploads 再 PUT /profile.avatar_url）、微信/苹果/邮箱绑定、合并确认与注销。无手机号。删号 UI Q-B7 搁置，接口保留。
  - name: 语言
    description: 语言偏好不上云（Q-B2）。无 profile.locale，客户端本地保存，请求携带 Accept-Language / X-Language。
  - name: 关于塔塔
    description: 版本、协议、分享、检查更新等由客户端与静态资源承载，无专用 App 接口。
  - name: 我的小组件
    description: 桌面/锁屏小组件。首版纯客户端渲染（Q-B14），内容复用今日一牌 POST /daily，不单开同步 path。
paths:
  /api/app/v1/auth/anonymous:
    post:
      tags: [登录注册]
      operationId: appAnonymous
      summary: 匿名进入
      description: 不需要令牌，也不读取请求体。签发 aud=app、sub=0 的 access JWT。不签发 refresh。
      responses:
        '200':
          description: 成功为 AnonymousAuthOK。内部错误为 code=1、「内部错误」。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AnonymousAuthOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/email/code:
    post:
      tags: [登录注册]
      operationId: appSendEmailCode
      summary: 发送邮箱验证码
      description: |
        注册发码不用带 Header。scene=bind 时在 Headers 加 `Authorization: Bearer <accessToken>`。邮箱登录不发码、不验码。
        scene 为 register / bind。register 时已注册邮箱返回「邮箱已注册」。
        同一邮箱同一 scene 60 秒内只能发一次，同一邮箱每小时最多 10 次。验证码 6 位、5 分钟有效，校验成功后作废。
        邮件走 config.yaml 的 mail SMTP；未配置返回「邮件服务未配置」。不在响应里回验证码。
      parameters:
        - $ref: '#/components/parameters/AuthorizationOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeBody'
            examples:
              成功:
                summary: 注册发码
                value:
                  email: demo@tata.local
                  scene: register
              绑定发码:
                summary: 绑定发码
                value:
                  email: demo@tata.local
                  scene: bind
      responses:
        '200':
          description: code=0 时 data.expires_in 为秒；失败为 ErrorEnvelope。绑定未登录为 HTTP 401。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/EmailCodeResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                成功:
                  summary: 已发送
                  value:
                    code: 0
                    message: ""
                    data:
                      expires_in: 300
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/register:
    post:
      tags: [登录注册]
      operationId: appRegister
      summary: 邮箱注册
      description: |
        邮箱、密码和验证码必填。先调 POST /auth/email/code，scene=register。
        邮箱冲突返回「邮箱已注册」。
        该邮箱未在 identity_claims 出现过时发放注册奖励，到期为下一个北京时间 08:00。
        若带 anonymous_id，会把匿名占卜转给新用户。
        若该用户已有未结算的占卜，会按共享优先级立刻扣一次（一开始提问就消耗）。
        不签发 refresh。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
            examples:
              成功:
                summary: 邮箱注册
                value:
                  email: demo@tata.local
                  password: demo1234
                  code: "123456"
      responses:
        '200':
          description: code=0 时 data 含 accessToken、id、registration_reward_expires_at、reward_consumed、reward_note。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/login:
    post:
      tags: [登录注册]
      operationId: appLogin
      summary: 邮箱登录
      description: |
        邮箱和密码必填，不需要验证码。
        邮箱或密码错误、或账号已注销，均为 HTTP 200、code=1、「邮箱或密码错误」。
        成功时 needs_confirm 恒为 false。若未在登录时扣掉未结算占卜，且本周期已用过免费次数，quota_prompt 为「今日免费体验额度已用完，本次记录已保存到历史记录」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
            examples:
              成功:
                summary: 邮箱登录
                value:
                  email: demo@tata.local
                  password: demo1234
      responses:
        '200':
          description: code=0 时 data 含 accessToken、id、reward_consumed、needs_confirm、quota_prompt。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/wechat:
    post:
      tags: [登录注册]
      operationId: appWechat
      summary: 微信身份登录
      description: |
        客户端把微信 SDK 的 code 交给服务端。iOS / Android 共用微信开放平台同一个移动应用。
        服务端用 config.yaml 的 wechat.appId/appSecret 向微信换 openid/unionid（优先存 unionid），再查找或创建用户。
        wechat.enabled=false 或凭证空时返回「微信登录未配置」。code 无效返回「微信授权码无效」。
        已注销身份不能再次领取注册奖励。新用户会发注册奖励。成功后会尝试结算未扣费的占卜。
        data.reward_note 为「注册奖励优先于今日免费次数，提问时自动扣减」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatBody'
            examples:
              成功:
                summary: 微信登录
                value:
                  code: 081abcWeChatCode
      responses:
        '200':
          description: code=0 时 data 含 accessToken、id、reward_consumed、reward_note。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/apple:
    post:
      tags: [登录注册]
      operationId: appApple
      summary: 苹果身份登录
      description: |
        仅 iOS。安卓没有苹果三方登录。客户端把 Sign in with Apple 的 identity_token 交给服务端。
        服务端用 Apple JWKS 验 RS256，iss 必须是 https://appleid.apple.com，aud 为 apple.clientId（iOS Bundle ID）。
        apple.enabled=false 或 clientId 空时返回「苹果登录未配置」。令牌无效返回「苹果身份令牌无效」。
        验过的 sub 用来查找或创建用户。已注销身份不能再次领取注册奖励。
        与微信登录不同：成功响应不调用提问结算，data 只有 accessToken、id、login=apple。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleBody'
            examples:
              成功:
                summary: 苹果登录
                value:
                  identity_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.demo
      responses:
        '200':
          description: code=0 时 data.login 为 apple。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppAuthSession'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/auth/bind-wechat:
    post:
      tags: [账号]
      operationId: appBindWechat
      summary: 绑定微信
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        需要登录用户。身份空闲则直接绑定，data=true。
        已被其他未注销、未合并账号占用时不搬迁数据，返回 BindConflictEnvelope，并留下 pending_confirm 合并请求。
        换绑未开放。重复绑定同一个微信身份返回 true。请求体同微信登录，传 code 不是 openid。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatBody'
            examples:
              成功:
                summary: 绑定微信
                value:
                  code: 081abcWeChatCode
      responses:
        '200':
          description: 绑定成功 code=0；冲突 code=1 且 data 为 BindConflict；其他业务错误 data 为 null。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/BindConflictEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/bind-apple:
    post:
      tags: [账号]
      operationId: appBindApple
      summary: 绑定苹果
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: 规则同绑定微信，身份种类为 apple。请求体同苹果登录，传 identity_token 不是 sub。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleBody'
            examples:
              成功:
                summary: 绑定苹果
                value:
                  identity_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.demo
      responses:
        '200':
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/BindConflictEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/bind-email:
    post:
      tags: [账号]
      operationId: appBindEmail
      summary: 绑定邮箱
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        邮箱按小写比较。邮箱、密码和验证码必填。先调 POST /auth/email/code，scene=bind。
        空闲则写入邮箱和密码哈希。
        冲突时同样只创建待确认合并，不立刻并账。已绑定过邮箱不能换绑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBindBody'
            examples:
              成功:
                summary: 绑定邮箱
                value:
                  email: demo@tata.local
                  password: demo1234
                  code: "123456"
      responses:
        '200':
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BoolOK'
                  - $ref: '#/components/schemas/BindConflictEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/auth/merge-confirm:
    post:
      tags: [账号]
      operationId: appMergeConfirm
      summary: 确认账号合并
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        只有发起绑定的主账号可以确认。confirm=false 不会合并。
        成功后次账号标记 merged_into，占卜、消息、注册奖励、人工补发次数、今日免费和钻石余额并入主账号。
        钻石加总不在响应里返回数字。订阅到期相同且多于一条时 subscription_resolution=prompt_required。
        已经合并的请求会重放当时保存的结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeConfirmBody'
            examples:
              成功:
                summary: 确认合并
                value:
                  merge_request_id: 1
                  confirm: true
      responses:
        '200':
          description: code=0 时 data 为 MergeOutcome。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/MergeOutcome'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
