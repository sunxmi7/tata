          type: integer
          format: int64
        secondary_user_id:
          type: integer
          format: int64
        surviving_user_id:
          type: integer
          format: int64
          description: 仅 after 中出现，等于主账号。
    MergeOutcome:
      type: object
      description: |
        只在 confirm=true 且合并成功（或已经合并、重放保存结果）时作为 data。
        钻石余额会在库内加总到主账号并迁移 diamond_ledger，但本对象不返回钻石数量。iap_orders 不改写。
        次账号的 App refresh（若有）会被吊销，之后次账号 access 也会因 merged_into 失效。
      properties:
        merged:
          type: boolean
        before:
          $ref: '#/components/schemas/MergeParties'
        after:
          $ref: '#/components/schemas/MergeParties'
        confirm_at:
          type: string
          format: date-time
        reward_before_primary:
          type: integer
        reward_before_secondary:
          type: integer
        reward_remaining:
          type: integer
        daily_free_remaining:
          type: integer
        daily_used_flags:
          type: integer
        daily_slot_remaining:
          type: integer
        daily_slot_used:
          type: integer
        readings_moved:
          type: integer
          format: int64
        messages_kept:
          type: integer
          format: int64
        subscription_resolution:
          type: string
          enum: [none, selected, prompt_required]
        subscription_prompt_required:
          type: boolean
        subscription_winner_id:
          type: integer
          format: int64
        identity_prompt_required:
          type: boolean
        retained_identities:
          type: array
          items:
            type: string
          description: 主账号该槽已占用时留下的身份，形如 wechat:openid。
    IAPVerifyBody:
      type: object
      additionalProperties: false
      required: [platform, product_id, transaction_id, receipt]
      properties:
        platform:
          type: string
          enum: [app_store, play]
        product_id:
          type: string
          description: 必须能映射到 iap_skus 的商店商品号。种子 SKU 的商品号为 null，直接验单会得到「商品未映射」。
        transaction_id:
          type: string
          maxLength: 128
        original_transaction_id:
          type: string
          description: 可省略，省略时等于 transaction_id。
        receipt:
          type: string
          maxLength: 8192
          description: 非空即可进入本地映射。服务端不向商店验票，只存 SHA-256。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅桶必填，RFC3339。消耗型可省略。
        purchased_at:
          type: string
          format: date-time
          nullable: true
    IAPRestoreBody:
      type: object
      additionalProperties: false
      required: [purchases]
      properties:
        platform:
          type: string
          enum: [app_store, play]
          description: 单笔 purchase 未写 platform 时继承这里。
        purchases:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/IAPVerifyBody'
    IAPSubscription:
      type: object
      nullable: true
      properties:
        status:
          type: string
        sku_kind:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        auto_renew:
          type: boolean
          nullable: true
    IAPOrderSnapshot:
      type: object
      description: |
        本地验单结果。verify_status=verified 只表示商品映射通过，不是商店回执。
        credit_status=amount_unconfigured 表示发放量未配置（钻石或次卡次数），对应 credited_* 为 null，余额不变。
        同一 platform+transaction_id 再次提交且已 verified 时 idempotent=true，不重复入账。
      properties:
        order_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        idempotent:
          type: boolean
        unit:
          type: string
          example: diamond
        sku_code:
          type: string
        sku_kind:
          type: string
        ledger_bucket:
          type: string
          description: subscription 或 consumable。订阅入账会把该桶余额替换为发放量；消耗型在原余额上累加。
        platform:
          type: string
        product_id:
          type: string
        store_transaction_id:
          type: string
        original_transaction_id:
          type: string
        verify_status:
          type: string
          enum: [pending, verified, failed]
        credit_status:
          type: string
          enum: [none, credited, amount_unconfigured, skipped_expired]
        credited_diamonds:
          type: integer
          nullable: true
        credited_readings:
          type: integer
          nullable: true
          description: 次卡入账的解读次数。未配置或非次卡为 null。
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [verify, restore]
        verify_message:
          type: string
        subscription_diamonds:
          type: integer
        pack_diamonds:
          type: integer
        subscription:
          $ref: '#/components/schemas/IAPSubscription'
        resumed_tasks:
          type: array
          description: 仅当本次 credit_status=credited 且存在可继续的 paywall 时出现。
          items:
            $ref: '#/components/schemas/ResumedTask'
        transaction_id:
          type: string
          description: 单笔失败、尚未形成订单快照时，restore 结果里可能只有这个字段。
        message:
          type: string
    IAPSKU:
      type: object
      description: |
        三类价位对应三块屏：会员（月卡 / 年卡 / 次卡）、塔塔币、年运单独解锁。
        种子已填设计价（分）和 App Store 占位商品号；管理员改过的值保留。
        kind：month_subscription（会员月卡）、year_subscription（会员年卡）、reading_pack（会员次卡）、consumable_pack（塔塔币）、yearly_unlock（年运解锁）。
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        kind:
          type: string
          enum: [month_subscription, year_subscription, reading_pack, consumable_pack, yearly_unlock]
        ledger_bucket:
          type: string
          enum: [subscription, consumable]
        display_name:
          type: string
        app_store_product_id:
          type: string
          nullable: true
          description: App Store 商品 ID。验单按票据 product_id 映射本列。种子为占位编码（tata.membership.month 等），上架前换成 Connect 正式 ID。
        play_product_id:
          type: string
          nullable: true
        price_amount_minor:
          type: integer
          format: int64
          nullable: true
          description: 单位分。种子已填设计价；未配置为 null。
        price_currency:
          type: string
          nullable: true
        diamond_grant:
          type: integer
          nullable: true
          description: 未配置为 null。验单不会把 null 当成 0 颗钻石入账。次卡与年运解锁不使用此字段。
        reading_grant:
          type: integer
          nullable: true
          description: 仅次卡。解读次数，未配置为 null。验单不会把 null 当成 0 次入账。
        period_unit:
          type: string
        period_count:
          type: integer
          nullable: true
        copy:
          type: string
          description: 价位附带运营文案。年卡用于专属活动权益。空字符串表示未定稿。
        enabled:
          type: boolean
        unit:
          type: string
          example: diamond
        display_label:
          type: string
          example: 塔塔币
          description: UI 展示名。档位数量来自 diamond_grant。
        benefits:
          type: array
          description: 订阅 SKU 的权益结构。followup.count 取 quota_settings.followup_limit（种子 5）。年卡 campaign_perk.body 取本行 copy。消耗包为空数组。
          items:
            $ref: '#/components/schemas/SKUBenefit'
    IAPConfig:
      type: object
      properties:
        restore_hook_enabled:
          type: boolean
          description: 种子默认 true。false 时 restore 直接失败且不写订单；verify 不受影响。
        restore_required_first_pack:
          type: boolean
          description: 种子默认 false。只回传，当前恢复逻辑不检查这个开关。
