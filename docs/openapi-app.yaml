  /api/app/v1/readings/{id}/interpret:
    post:
      tags: [抽牌]
      operationId: appInterpret
      summary: 生成解读
      description: |
        请求体带 spread_id 和客户端已经抽好的牌。牌已经落库时可以不带 body。
        牌名必须是牌库里的名字，orientation 只能是 upright 或 reversed，张数必须等于牌阵张数，同一张牌不能出现两次。
        成功 data 为 reading_id、has_more、messages。messages 从类型二、类型一、类型三开始。
        explore 允许问题为空（主题占卜无提问环节）；空问题时按所选主题分类与牌阵解读，不回写 question。登录用户先过 play 门槛。未绑定供应商会把状态写成 FAILED_RETRYABLE。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpretBody'
            examples:
              成功:
                summary: 交上抽好的牌
                value:
                  spread_id: 1
                  cards:
                    - {position: 1, position_name: 过去, name: 愚者, orientation: upright}
                    - {position: 2, position_name: 现在, name: 魔术师, orientation: reversed}
                    - {position: 3, position_name: 未来, name: 女祭司, orientation: upright}
      responses:
        '200':
          description: 成功 data 为对话。额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/ConversationData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/interpret/stream:
    post:
      tags: [抽牌]
      operationId: appInterpretStream
      summary: 生成解读（SSE 流式）
      description: |
        与 interpret 相同的额度门槛与落库，但以 SSE 逐段下发，供打字机效果。无请求体。
        额度拦截发生在切换到流之前，仍返回普通 JSON 的 QuotaBlockEnvelope（Content-Type application/json）。
        先创建后台任务再推流：SSE 断开不会取消生成，结果写入 readings。重连先回放已产出文本（一条较大的 delta），再继续增量。
        通过后 Content-Type 为 text/event-stream，事件：
        - `delta`：`data: {"text":"增量片段"}`，多次；重连时第一条可能是已生成全文片段。
        - `done`：`data: {"reading": Reading}`，解读已 COMPLETED 并落库。
        - `error`：`data: {"message":"..."}`，生成失败（已置 FAILED_RETRYABLE，未重新扣费）。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 成功为 text/event-stream 事件流；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流：每个事件形如 event 行 + data 行（JSON），空行分隔。"
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/followups:
    post:
      tags: [抽牌]
      operationId: appFollowup
      summary: 追问
      description: |
        continuation 必填。false 时新建 normal 占卜。
        true 时记录类型须为 normal、explore、daily、tarotist，且解读已完成、牌面已固定。
        必须登录。未登录返回 HTTP 401。延续追问时额度不够则 QuotaBlockEnvelope，并把追问文本记在 resume_payload。
        每条解读追问次数受 quota_settings.followup_limit 限制（种子 5，null 不限制）；超限返回「本条解读追问已达上限」。
        延续原问题时，data 含 reading_id、has_more、messages，以及 quota_outcome、entitlement、charged、redraw。画面按 messages 画。追问回答最多四条类型三。
        continuation 为 false 时返回 new_reading、charged_here、reading，不写进当前对话。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupBody'
            examples:
              成功:
                summary: 追问
                value:
                  text: 能再详细说说吗？
                  continuation: true
      responses:
        '200':
          description: 延续追问、新建占卜，或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/FollowupOKData'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/followups/redraw:
    post:
      tags: [抽牌]
      operationId: appFollowupRedraw
      summary: 追问后补抽或跳过
      description: |
        action 为 draw 或 skip。skip 不增加牌。类型十七的 pending 变为 false，并带上 choice。
        draw 时列表末尾多一条类型十九，data 里还有 card 和更新后的 redraw。
        data 同时有整段 messages。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [draw, skip]
            examples:
              去抽牌:
                value: {action: draw}
      responses:
        '200':
          description: data 含整段 messages。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConversationData'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/numerology:
    post:
      tags: [抽牌]
      operationId: appNumerologyMessages
      summary: 灵数抽牌
      description: |
        选完牌阵之后提交 numbers。个数须等于牌阵张数，1–78，不可重复。
        还没填数字时 messages 含类型八。数字不齐时含类型十，数字重复时含类型九，不落牌。
        数字齐了按这一问的 78 张映射落牌，data 为 reading_id、has_more、messages。
        未登录不带令牌，query 带 device_id。不要把 device_id 放进请求体。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumerologyBody'
            examples:
              未填:
                value: {numbers: []}
      responses:
        '200':
          description: data 为对话。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConversationData'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/redraw:
    post:
      tags: [抽牌]
      operationId: appRedraw
      summary: 灵数补抽一个数字
      description: |
        只用于 draw_mode=numerology，而且牌已经落库。请求体只有 number。
        按这一问已保存的 78 张映射追加一张，不替换原来的牌。数字或牌面重复会拒绝。78 张用完返回「78 张牌已全部使用」。
        成功 data 为占卜记录。这不是追问后的类型十七，追问补抽走 POST /followups/redraw。
        已登录带令牌。未登录不带令牌，query 带 device_id。不要把 device_id 放进请求体。
      parameters:
        - $ref: '#/components/parameters/DivinationAuthorization'
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [number]
              properties:
                number:
                  type: integer
                  minimum: 1
                  maximum: 78
      responses:
        '200':
          description: 成功 data 为占卜记录。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /api/app/v1/readings/{id}/followups/stream:
    post:
      tags: [抽牌]
      operationId: appFollowupStream
      summary: 追问（SSE 流式）
      description: |
        仅支持延续追问（continuation 必须为 true；新建占卜请用非流式 followups）。
        额度/轮次/扣费与非流式一致；额度拦截在切换到流之前，返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream，事件：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"followup": FollowupOKData}`，气泡已落库。
        - `error`：`data: {"message":"..."}`。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowupBody'
            examples:
              成功:
                summary: 追问
                value:
                  text: 能再详细说说吗？
                  continuation: true
      responses:
        '200':
          description: 成功为 text/event-stream 事件流；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/readings/{id}/workflow:
    post:
      tags: [抽牌]
      operationId: appWorkflow
      summary: 按步骤跑工作流
      description: |
        请求体可空。detect 只做本地检测，不调用模型。recommend 返回「正式推荐未配置」，不指定牌阵，不调用模型。rewrite 仍走绑定。这三步不落库。
        interpret / tarotist 在牌面已固定时调用 generate，会写解读并扣已有额度规则。
        未知步骤记在 step.error，不让整个请求失败。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowBody'
            examples:
              成功:
                summary: 默认步骤
                value: {}
      responses:
        '200':
          description: code=0 时 data 含 reading 与 steps。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/AppWorkflowResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/daily:
    post:
      tags: [首页, 日历记录, 我的小组件]
      operationId: appDaily
      summary: 今日或明日一牌
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录。同一用户、同一 `target_date`（运势目标日）已有牌面则 code=1，reused=true，charged=false，不重复扣费。
        `business_date` 固定为抽牌日（日历/历史归天）；`target_date` 为运势日（今日=当天，明日=次日）。提前抽的明日运势在抽牌日可见，目标日再调 `/daily`（today）会复用同一条。
        否则按共享优先级扣 play（不允许塔罗师试用）。单价未配置、额度不足或请开通会员为 QuotaBlockEnvelope。
        扣费成功后：请求带了 `cards`（1 张）则用 App 交上的牌；否则服务端抽一张，再生成解读。
        生成失败仍 code=0，返回已固定牌面、可能为 FAILED_RETRYABLE 的记录。
        JSON 等完整解读；打字机请用 `/daily/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
        解读走后台任务。App 退出后再进：GET /readings/{id} 或再调 `/daily`（已有牌面则 reused，COMPLETED 直接返回）。
        成功/复用记录带首页卡字段：card_name、short_text、yi（可空）、card_thumbnail（有牌则必有 URL，未配正式图时为内置默认牌背）、target、business_date、target_date、has_result。不编造宜忌文案。
        明日运势在历史/日历展示为普通占卜（conversation_type=moment，conversation_label=普通占卜），仍保留 type=daily、target=tomorrow、target_date。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyBody'
            examples:
              成功:
                summary: 今日一牌
                value:
                  target: today
              客户端交牌:
                summary: App 抽好后上传牌面
                value:
                  target: today
                  cards:
                    - name: 愚者
                      orientation: upright
                      position: 1
                      position_name: 今日
                      card_id: 0
      responses:
        '200':
          description: 新结果、复用或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadingOK'
                  - $ref: '#/components/schemas/DailyReuseEnvelope'
                  - $ref: '#/components/schemas/QuotaBlockEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/daily/stream:
    post:
      tags: [首页, 日历记录, 我的小组件]
      operationId: appDailyStream
      summary: 今日或明日一牌（SSE 流式）
      description: |
        与 daily 相同的登录、扣费、抽牌与复用规则。额度拦截仍返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"reading": Reading}`；复用已完成记录时带 `"reused": true`，无 delta。
        - `error`：`data: {"message":"..."}`，生成失败（已置 FAILED_RETRYABLE，未重新扣费）。
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyBody'
            examples:
              成功:
                summary: 今日一牌
                value:
                  target: today
      responses:
        '200':
          description: 成功为 text/event-stream；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流：每个事件形如 event 行 + data 行（JSON），空行分隔。"
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaBlockEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/calendar:
    get:
      tags: [日历记录]
      operationId: appCalendar
      summary: 日历
      description: |
        必须登录。data 为 {days, cycle, tomorrow_date}。
        **全部占卜都进日历**：normal / tarotist / explore / daily，只要未删除且 business_date 非空；
        探索（此刻抉择、主题占卜）与普通/占卜师/今日一牌一视同仁，不单独排除。
        month 按前缀匹配，例如 2026-10。type 可按四类过滤；不传 type =「全部」。
        日详情字段与定稿 574:2 对齐：今日一牌含牌名/正逆位/短文/缩略图；普通/探索含多张缩略图；占卜师含姓名与头像；时分取 created_at。
        另带 conversation_type / conversation_label / stage / stage_label / theme_key（与历史列表同套）。
        不返回完整牌面 JSON 与解读正文，短文从 interpretation 截取，不编造。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: 2026-10
          description: 业务月 YYYY-MM。按 business_date 前缀筛选。省略则不按月裁剪。
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [normal, tarotist, explore, daily]
          description: |
            按底层 type 过滤。省略=全部（含探索）。
            非法值返回「type 不正确」。
      responses:
        '200':
          description: data 为日历条目，含日详情预览字段。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessMeta'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CalendarView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/redeem:
    post:
      tags: [兑换码]
      operationId: appRedeem
      summary: 兑换码核销
      parameters:
        - $ref: '#/components/parameters/Authorization'
      description: |
        必须登录。成功时 quota 类兑换写入统一额度，free_count 写入免费次数。
        无效码 message=兑换码无效；已核销=兑换码已使用；过期=兑换码已过期。到账数量以账本为准。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemBody'
            examples:
              成功:
                summary: 核销兑换码
                value:
                  code: TATA-DEMO
      responses:
        '200':
          description: 成功或业务错误（无效码等）。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/RedeemResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/app/v1/uploads:
    post:
      tags: [账号, 我的中心, 功能心愿单, 反馈意见]
      operationId: appUploads
      summary: 上传图片（头像 / 心愿 / 反馈）
      description: |
        必须登录。没有单独的上传头像接口；改头像也走这里。
        JSON（filename/content_type/content_base64）或 multipart 字段 file。
        query folder：头像用 misc（缺省）；心愿/反馈用 feedback；spreads/decks/cards 给管理端图。
        成功把 data.url 写入 PUT /profile 的 avatar_url，或心愿/反馈的 image_url。
        仅 jpg/png/webp/gif，最大 5MB。落地由 config.yaml 的 upload.driver 决定（local 或阿里云 OSS）。
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - name: folder
          in: query
          required: false
          schema:
            type: string
            enum: [spreads, decks, cards, feedback, misc, custom]
          description: 子目录。头像用 misc（缺省）；心愿/反馈用 feedback。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadBody'
            examples:
              头像:
                summary: 上传头像（folder 缺省 misc）
                value:
                  filename: avatar.png
                  content_type: image/png
                  content_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
              成功:
                summary: JSON 上传
                value:
                  filename: demo.png
                  content_type: image/png
                  content_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功返回 url。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: '#/components/schemas/SuccessMeta'
                      - type: object
                        properties:
                          data:
                            $ref: '#/components/schemas/UploadResult'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads/{name}:
    get:
      tags: [账号, 我的中心, 功能心愿单, 反馈意见]
      operationId: serveUpload
      summary: 读取已上传图片或内置默认牌背（name 为 card-default.png 或 {folder}/{file}）
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 图片字节。
        '404':
          description: 文件不存在或文件名不合法。
  /api/app/v1/wishlist:
