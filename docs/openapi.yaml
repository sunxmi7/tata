        daily_free_editable:
          type: boolean
          example: false
          description: 每日免费已下线，固定为 false。
        daily_slot_editable:
          type: boolean
          example: false
          description: 今日一牌次数已下线，固定为 false。
        followup_limit:
          type: integer
          nullable: true
          description: 每条解读可追问次数。种子默认 5；null 不限制。
        followup_limit_editable:
          type: boolean
          example: true
        quota_cost:
          type: integer
          nullable: true
        quota_cost_configured:
          type: boolean
        quota_cost_editable:
          type: boolean
          example: true
        registration_grant_delay_minutes:
          type: integer
          nullable: true
