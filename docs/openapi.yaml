  /api/admin/v1/grants:
    get:
      tags: [Admin Grants]
      operationId: adminListGrants
      summary: 人工补发记录
      security:
        - AdminBearer: []
      description: |
        只读角色可查。最多 200 条。
        带 user_id 时附带该用户的钻石桶、订阅周期结束时间、人工补发剩余次数和注册奖励剩余次数。
        响应声明 writes_iap_orders=false、resumes_paywall=false。
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: data 为 GrantMeta。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GrantMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin Grants]
      operationId: adminCreateGrant
      summary: 人工补发钻石或免费次数
      security:
        - AdminBearer: []
      description: |
        需要 role=admin。note 必填。reason 只能是 admin_grant。
        钻石默认进 pack。不改 iap_orders，不唤醒 paywall，resumed_tasks 恒为 []。
        不接受价格字段。注销或已合并账号拒绝；已合并请补发到主账号。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreate"
      responses:
        "200":
          description: code=0 时 data 含新建 grants 与补发后的余额。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/GrantMeta"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/operators:
    get:
      tags: [Admin Audit]
      operationId: adminListOperators
      summary: 操作员列表
      security:
        - AdminBearer: []
      description: 不返回密码哈希。
      responses:
        "200":
          description: data 为 Operator 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin Audit]
      operationId: adminCreateOperator
      summary: 新建操作员
      security:
        - AdminBearer: []
      description: role 只允许 admin 或 readonly。用户名冲突为「用户名已存在」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorCreate"
      responses:
        "200":
          description: 成功返回 id。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IdOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/operators/{id}:
    put:
      tags: [Admin Audit]
      operationId: adminUpdateOperator
      summary: 停用或启用操作员
      security:
        - AdminBearer: []
      description: 只能改 disabled。停用时吊销该操作员的 admin refresh。不能停用自己。省略 disabled 会启用账号。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorPatch"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/users:
    get:
      tags: [Admin Audit]
      operationId: adminListUsers
      summary: App 用户
      security:
        - AdminBearer: []
      description: 最多 200 条，按 id 降序。不含密码。
      responses:
        "200":
          description: data 为用户数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AppUserAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/audit:
    get:
      tags: [Admin Audit]
      operationId: adminListAudit
      summary: 审计日志
      security:
        - AdminBearer: []
      description: 最多 200 条，按 id 降序。detail 是文本，可能是 JSON 字符串。
      responses:
        "200":
          description: data 为审计数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/account-merges:
    get:
      tags: [Admin Audit]
      operationId: adminListAccountMerges
      summary: 账号合并请求
      security:
        - AdminBearer: []
      description: 最多 200 条。result 在合并完成后是保存的 JSON 文本，不是展开对象。不含价格。
      responses:
        "200":
          description: data 为合并请求数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccountMergeRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/orders:
    get:
      tags: [Admin IAP]
      operationId: adminListIAPOrders
      summary: IAP 订单
      security:
        - AdminBearer: []
      description: |
        只读，最多 200 条。verify_status 只允许空、pending、verified、failed。
        credited_diamonds 在发放量未配置时为 null。
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
        - name: verify_status
          in: query
          schema:
            type: string
            enum: ["", pending, verified, failed]
      responses:
        "200":
          description: data 为订单数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminIAPOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/skus:
    get:
      tags: [Admin IAP]
      operationId: adminListIAPSKUs
      summary: 全部 SKU
      security:
        - AdminBearer: []
      description: 含未启用。种子三条的价格、货币、diamond_grant 和商店商品号为 null。没有写接口。
      responses:
        "200":
          description: data 为 IAPSKU 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/IAPSKU"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/diamonds:
    get:
      tags: [Admin IAP]
      operationId: adminIAPDiamonds
      summary: 用户钻石余额与流水
      security:
        - AdminBearer: []
      description: user_id 必填。流水最多 50 条。不返回价格。
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: data 为 DiamondView，并含 user_id 与 ledger。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/DiamondView"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/config:
    get:
      tags: [Admin IAP]
      operationId: adminIAPConfig
      summary: IAP 开关
      security:
        - AdminBearer: []
      description: 与 App 的 config 相同。没有更新接口。
      responses:
        "200":
          description: data 为 IAPConfig。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IAPConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/messages:
    get:
      tags: [Admin Content]
      operationId: adminListMessages
      summary: 追问消息
      security:
        - AdminBearer: []
      description: 全库最近 200 条，按 id 降序。含 reading_id。
      responses:
        "200":
          description: data 为消息数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/calendar:
    get:
      tags: [Admin Content]
      operationId: adminListCalendar
      summary: 日历记录
      security:
        - AdminBearer: []
      description: 未删除且 business_date 非空，最多 200 条。含 user_id 与 progress。
      responses:
        "200":
          description: data 为日历条目，无 continue 字段。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CalendarItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
