# 导入 Apifox：项目 → 导入 → OpenAPI，选择本文件 docs/openapi.yaml。
# 服务地址默认 http://127.0.0.1:8080。需要登录的接口在 Headers 加 Authorization: Bearer <accessToken>。
# 说明同时见 docs/README.md。
openapi: "3.0.3"
info:
  title: 塔塔 HTTP API
  version: "1.0.0"
  description: |
    由 `server/internal/tata/routes.go` 注册的 HTTP 接口。未在该文件出现的路径不在此契约中。

    **导入 Apifox：** 导入 → OpenAPI，选择 `docs/openapi.yaml`。服务器默认 `http://127.0.0.1:8080`（`server/manifest/config/config.yaml` 的 `server.address: ":8080"`）。

    ## 包络
    `writeOK` / `writeErr` 的 JSON 为 `{ "code": 0|1, "message": "", "data": ... }`。
    - `code=0`：成功，HTTP 200，`message` 一般为空字符串。
    - `code=1`：业务失败。经 `writeErr` 或 `h()` 时 HTTP 仍多为 200，`data` 多为 `null`，`message` 为中文原因。
    - 例外：`writeQuotaBlock`、绑定冲突、今日一牌复用也是 HTTP 200 + `code=1`，但 `data` 为结构化对象。
    - 鉴权失败（`h()` 捕获 `authFail`）为 HTTP 401，`message` 为「未登录或令牌无效」。
    - `POST /api/admin/v1/auth/refresh` 在刷新令牌无效时为 HTTP 401。
    - `POST /demo/openai/v1/chat/completions` 不使用该包络。

    经 `decode` 的 JSON 会拒绝未知字段，失败文案为「请求字段不正确」。

    ## 鉴权
    公开目录不需要 token：`GET /preset-questions`、`/spreads`、`/banners`、`/tarotists`、`/explore/topics`、`/campaigns`、`/campaigns/{id}`、`/help/*`、`/iap/skus`、`/iap/config`。创建占卜、额度、档案、今日一牌等仍要登录。其余需要登录（）的接口：在 **Headers** 加参数 `Authorization`，值写成 `Bearer <accessToken>`（Bearer 后面有一个空格）。不要放进请求体。
    Access token 为 HS256 JWT，`typ=access`，约 2 小时过期。
    - App：`aud=app`。登录用户 `sub` 为 `app_users.id`。`role` 为空。
    - 管理端：`aud=admin`。`sub` 为 `operators.id`，`role` 为 `admin` 或 `readonly`。
    两种令牌不能互换。已合并账号（`merged_into` 非空）、不存在的用户、已停用的操作员会被拒绝。
    App 登录接口不签发 refresh token。管理端 refresh token 是库存的不透明字符串（约 7 天），不是 JWT。

    写操作调用 `adminActor(write=true)`。`role=admin` 拥有全部模块。`readonly` 按 `operator_module_perms` 的 content/ai/records/accounts/pay 授权：无该模块为「没有该模块权限」，有读无写为「只读账号不能修改」。只有 admin 能管理操作员。种子 `readonly` 五个模块均为只读。

    全局 CORS 允许头：`Authorization`、`Content-Type`、`Idempotency-Key`、`Accept-Language`、`X-Language`、`Accept`。`OPTIONS` 返回 204，没有单独业务路径。

    ## App 语言（Accept-Language）
    语言偏好**不上云**（无 `profile.locale`）。客户端本地保存；App 请求携带 **`Accept-Language`**（推荐 `zh-Hans`、`zh-Hant`、`en`、`ja`、`ko`），亦可传 **`X-Language`**。未带头或无法识别时按 **`zh-Hans`**。服务端用该头查 `server/internal/tata/i18n/*.json`（简体原文为 key），本地化错误 `message`、额度提示、状态/类型标签、牌名、牌组名、预设问题和固定空状态文案。运营 CMS（帮助正文、活动详情、占卜师文案）和 AI 解读原文仍按入库语言返回。`error_code` 不随语言变化。

    ## 未配置的价格、验单与占位
    - 种子 SKU：`sub_month` / `sub_year` 已填会员价；`pack_quota_20/60/100` 为额度补充包（20/60/100 元），`quota_grant` 未配置为 null；`unlock_yearly` 年运解锁；牌组是 `deck_year` / `deck_bundle` / `deck_single` / `deck_addon`。接口不编造会员开通赠送额度或补充包额度。
    - `POST /api/app/v1/iap/verify` 与 restore **不调用** App Store / Google Play。只保存票据的 SHA-256，按 `product_id` 映射 `iap_skus`。发放量为 null 时 `credit_status=amount_unconfigured`，不写入账。
    - `quota_settings.quota_cost` 现为会员每次扣额度的单价，默认为 null。未配置时会员扣费停住：`quota_outcome=quota_cost_unconfigured`，不猜测单次消耗。
    - IAP：订阅发放写入统一 `quota_balance`（累加，不替换）；`quota_pack` 仅会员可买，入账 `quota_balance`；`consumable_pack` 验单失败「塔塔币已下线」。
    - 人工补发 `quota` 写入统一额度，不改 `iap_orders`，也不唤醒 paywall（`resumed_tasks` 恒为空）。
    - 注册奖励已下线。免费用户扣费顺序：今日免费（全局 1 次）→ 邀请奖励 → 人工补发 → 开通会员。会员只扣统一额度。
    - 恢复购买受 `iap_settings.restore_hook_enabled` 控制（种子默认 true）。`restore_required_first_pack` 只回传，当前 handler 不据此拦截。
    - App P1 占位：兑换记录行字段、活动详情、参与记录、奖励记录均未定稿。列表为空数组，不编造记录。帮助中心按文字稿只保留「使用与占卜」「账号与设置」两类，正文已写入。**Q-B1 已拍砍（2026-11-02）**：不注册 `POST /api/app/v1/push/register`；通知仅 `notification-preferences` + 客户端本地/OS 提醒。
    - 活动列表与帮助中心的「加载失败，请重试」是客户端在请求失败后的状态，重试同一 GET。服务端沿用现有 `code=1` 包络，不另开错误体。
servers:
  - url: http://127.0.0.1:8080
    description: 本机默认（server.address = :8080）
tags:
  - name: 登录绑定
    description: App 登录、绑定、合并确认、注销。除绑定 / 合并 / 注销外不需要 Bearer。
  - name: 用户档案
    description: 登录用户档案。改头像先 POST /uploads（folder=misc）再 PUT /profile 的 avatar_url。昵称与姓名同一列，PUT 可传 name 或 nickname。必须登录。
  - name: 占卜解读
    description: 占卜记录与仪式流程（检测、牌阵、洗牌、切牌、抽牌、解读、追问、工作流）。
  - name: 额度钻石
    description: 免费次数、邀请次数与会员统一额度。免费用户不展示额度余额；会员看 quota_remaining。
  - name: 内购
    description: 会员订阅、额度补充包与年运解锁。塔塔币包已下线。价格与发放数量未配置时保持 null。
  - name: 每日一牌
    description: 今日 / 明日一牌与日历。
  - name: 探索
    description: 探索目录分组与主题条目。spread 映射可为空 stub。
  - name: 钱包兑换
    description: 兑换码核销、兑换记录与额度流水。quota 类兑换写入统一额度。兑换记录行字段仍待确认。
  - name: 活动
    description: 参与活动列表。详情、参与记录、奖励记录在设计包里仍是占位，不编造奖励承诺。
  - name: 帮助
    description: 帮助中心分类、搜索与问题详情。当前是使用与占卜、账号与设置两类，正文已写入。
  - name: 反馈心愿
    description: 图片上传（头像/心愿/反馈共用 POST /uploads）、功能心愿单与意见反馈。
  - name: 通知设置
    description: 通知偏好、推送设备注册与消息中心（站内信）。今日/明日抽牌为 App 本地通知；优惠/活动走个推服务端下发（2026-11-06 重启 Q-B1）。系统推送授权仍只在客户端。
  - name: 管理端登录
    description: 管理端登录、刷新、菜单与权限码。
  - name: 管理端内容
    description: 牌阵、塔罗师、提示窗、图片上传、占卜记录、消息、功能心愿单、反馈意见、日历、工作流模拟。
  - name: 供应商
    description: 模型供应商与任务绑定。
  - name: 额度补发
    description: 额度参数（只读）、次数流水（只读）、人工补发与兑换码生成。
  - name: 管理端内购
    description: 订单、SKU、钻石余额与 IAP 开关。管理端只读。
  - name: 审计账号
    description: 操作员、用户列表、用户画像统计与审计。账号合并已下线。
  - name: 系统
    description: 健康检查、演示补全、管理端跳转页。不是 /api 业务契约的主体。
components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      description: |
        填 `Bearer ` + accessToken。Bearer 后面有一个空格。放在 Headers，不要放进请求体。
        App 用登录返回的 token；管理端用管理端登录返回的 token。两种不能混用。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    AuthorizationOptional:
      name: Authorization
      in: header
      required: false
      description: |
        登录发码不用填。scene=bind 时必填 `Bearer <accessToken>`。
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiJ9
    PathId:
      name: id
      in: path
      required: true
      description: 正整数路径 id。无法解析或小于等于 0 时 HTTP 200、code=1、message 为「id 不正确」。
      schema:
        type: integer
        format: int64
        minimum: 1
    PathCardId:
      name: id
      in: path
      required: true
      description: 单牌 id。种子 Rider-Waite 为 0–77（愚者=0）。无法解析或小于 0 时 message 为「牌不存在」。
      schema:
        type: integer
        minimum: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        可选。空则不去重。同一 scope 下：首次插入 pending；完成后原样重放当时的 JSON 包络；仍为 pending 时 HTTP 200、code=1、「重复请求处理中」。
        `POST /api/app/v1/readings` 的 scope 为 `user:{id}` 或 `device:{device_id 小写}`。
        `POST /api/app/v1/readings/{id}/followups` 的 scope 为 `followup:{readingId}`。
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        可选。App 端语言偏好（客户端本地存储，不上云 profile）。
        帮助、活动等需本地化文案的接口可读此头；未识别或未传时服务端按 `zh-Hans`。
        推荐 BCP47：`zh-Hans`（缺省）、`zh-Hant`、`en`、`ja`、`ko`。
        若项目已约定，亦可传 `X-Language`（同名语义，优先于本头）。
      schema:
        type: string
        example: zh-Hans
  responses:
    Unauthorized:
      description: HTTP 401。令牌缺失、无效、aud 不匹配，或账号已停用 / 已合并 / 不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 1
            message: 未登录或令牌无效
            data: null
  schemas:
    SuccessMeta:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
          description: 成功固定为 0。
        message:
          type: string
          example: ""
          description: 成功时一般为空字符串。
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 业务失败固定为 1。HTTP 多为 200；鉴权失败为 401。
        message:
          type: string
          description: 失败原因，按 Accept-Language / X-Language 本地化；缺省简体中文。例如「验证码不正确或已过期」或 Not logged in or token invalid。
        error_code:
          type: string
          description: |
            稳定错误码，供客户端按码分支（不随语言变化）。有界推进中：
            已归类 unauthorized、invalid_request_body、invalid_path_id、reading_not_found、reading_deleted、reading_forbidden、internal；
            其余尚未归类的业务错误为空字符串，仅凭 message。
        data:
          nullable: true
          description: 普通 writeErr 为 null。配额拦截、绑定冲突、今日一牌复用不用这个 schema。
    BoolOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: boolean
              example: true
              description: 成功为 true。
    IdOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  format: int64
    Position:
      type: object
      additionalProperties: false
      required: [index, name, meaning]
      properties:
        index:
          type: integer
          description: 阵位序号，从 0 或 1 起，与抽牌 position 对应。
        name:
          type: string
          description: 阵位名，例如「过去」。
        meaning:
          type: string
          description: 阵位含义说明。
    DrawnCard:
      type: object
      properties:
        position:
          type: integer
          description: 该牌所在阵位序号。
        position_name:
          type: string
          description: 阵位名。
        card_id:
          type: integer
          description: 韦特牌序，力量为 VIII、正义为 XI。
        name:
          type: string
          description: 牌名，例如「愚者」。
        orientation:
          type: string
          enum: [upright, reversed]
          description: 正位 upright，逆位 reversed。
    Reading:
      type: object
      description: scanReading / loadReading 的字段。时间是 RFC3339。
      properties:
        id:
          type: integer
          format: int64
          description: 占卜记录 id。
        user_id:
          type: integer
          format: int64
          nullable: true
          description: 归属用户。未登录为 null。
        type:
          type: string
          description: |
            底层业务类型：normal、tarotist、explore、daily。
            注意：explore 同时表示「此刻抉择」和「主题占卜」两个入口，不能单靠本字段区分；
            App 必须用 conversation_type（或 theme_key）再判断，见 conversation_type 说明。
        theme_key:
          type: string
          description: |
            探索主题键。创建 explore 时可写；选阵后若为空从牌阵回填。
            空字符串表示尚未绑定主题（仅 explore 未选阵且未传 theme_key）。
            App 判断探索子类：yes_or_no / either_or → 此刻抉择；relationship、communication、career、
            study、interpersonal、shopping、outfit、wellbeing、inner → 主题占卜。
        conversation_type:
          type: string
          enum: ['', daily, moment, theme]
          description: |
            历史对话三类（App 分 UI 用这个，不要只用 type）：
            - daily：今日/明日（type=daily；再看 target）
            - moment：普通占卜（type=normal）/ 占卜师（type=tarotist）/ 此刻抉择（type=explore 且 theme_key 为 yes_or_no 或 either_or）
            - theme：主题占卜（type=explore 且 theme_key 为其余探索主题）
            explore 尚未有 theme_key 时为空字符串，此时还分不出此刻抉择与主题占卜。
            判定示例：type=explore && conversation_type=moment → 此刻抉择；
            type=explore && conversation_type=theme → 主题占卜。
        conversation_label:
          type: string
          description: |
            展示名，可直接用于列表角标/标题：
            - 今日运势 / 明日运势（daily）
            - 普通占卜 / 占卜师 / 此刻抉择（moment，按 type+theme_key）
            - 主题占卜（theme）
            conversation_type 为空时为空。区分此刻抉择与主题占卜时，也可用本字段是否等于「此刻抉择」「主题占卜」。
        stage:
          type: string
          description: |
            按 conversation_type 区分的阶段键（如 pending_draw、question_submitted、pending_spread）。
            与 status 并存；客户端续做应按 conversation_type + stage 选 UI。
        stage_label:
          type: string
          description: 阶段中文文案，随 conversation_type 变化（如待抽牌 / 问题已提交 / 待选牌阵）。
        question:
          type: string
          description: 用户问题原文。未填写时为空字符串。
        spread_id:
          type: integer
          format: int64
          nullable: true
          description: 所选牌阵 id。未选阵为 null。
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: 占卜师 id。非占卜师占卜为 null。
        status:
          type: string
          enum: [QUESTION_CREATED, SPREAD_SELECTED, SHUFFLING, CUTTING, CARDS_FIXED, INTERPRETING, COMPLETED,
            FAILED_RETRYABLE]
          description: 底层状态机（三类对话共用）。COMPLETED 已解读，FAILED_RETRYABLE 可重试。
        cards:
          type: array
          nullable: true
          description: 已抽牌列表。尚未抽牌为 null 或空。
          items:
            $ref: "#/components/schemas/DrawnCard"
        interpretation:
          type: string
          nullable: true
          description: 解读正文。未生成时为 null。
        vendor_name:
          type: string
          nullable: true
          description: 生成解读的供应商名。未生成为 null。
        model_name:
          type: string
          nullable: true
          description: 生成解读的模型名。未生成为 null。
        fail_reason:
          type: string
          nullable: true
          description: 生成失败原因。成功或未失败为 null。
        quota_consumed:
          type: boolean
          description: 数据库标记，表示已扣今日免费次数。注册奖励走 reward_consumed，不在此列表字段中。
        first_experience:
          type: boolean
          description: 是否该用户首次体验占卜。
        created_at:
          type: string
          format: date-time
          description: 创建时间，RFC3339。
        updated_at:
          type: string
          format: date-time
          description: 最近更新时间，RFC3339。
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 软删时间。未删除为 null。
        progress:
          type: string
          description: 旧进度文案（按 status，三类共用）。新客户端优先用 stage_label。
        continue:
          type: string
          description: 建议的下一步动作名；完成时为空字符串。
        card_name:
          type: string
          description: 第一张牌名。无牌时为空。列表与详情、今日一牌共用。
        short_text:
          type: string
          description: 从 interpretation 截取的一句预览，无解读时为空，不编造。
        status_label:
          type: string
          description: COMPLETED 为「已解读」，其余为「待继续」。粗粒度；细阶段看 stage_label。
        yi:
          type: string
          nullable: true
          description: 今日一牌「宜」。正位优先用 cards.yi，空则用 upright_yi；逆位用 reversed_yi。都空为 null。
        card_message:
          type: string
          nullable: true
          description: 今日一牌寄语。按牌的正逆位取 upright_message 或 reversed_message。无牌或未配置为 null。
        card_thumbnail:
          type: string
          nullable: true
          description: 牌面缩略图完整 URL。优先 cards.thumbnail，否则 card.thumbnail_template（{id}/{name}），再否则 card.thumbnail_default；都未配置则返回当前服务地址下的内置默认牌背。相对 /uploads/... 会拼 scheme://host。无牌名时为 null。
        target:
          type: string
          description: today 或 tomorrow。仅 daily；由 business_date 与用户当日业务日比较得出。
        business_date:
          type: string
          description: 业务日 YYYY-MM-DD。列表与详情对 daily 返回；其他类型也可能有值但不作 target 依据展示。
        has_result:
          type: boolean
          description: 已有牌名时为 true。
    ReadingCreated:
      description: |
        创建占卜在 Reading 之上附加的额度结果。成功包络仍是 code=0。
        登录用户的普通 / 塔罗师占卜在这一步就按共享优先级扣费；explore 推迟到仪式门槛；未登录不预扣。
        额度用尽时记录仍保留（kept=true，generated=false），不会编造钻石单价。
      allOf:
        - $ref: "#/components/schemas/Reading"
        - type: object
          properties:
            quota_exhausted:
              type: boolean
              description: 额度不足以继续生成时为 true。记录仍可能保留。
            quota_consumed:
              type: boolean
              description: 本次是否扣了今日免费次数。
            reward_consumed:
              type: boolean
              description: 本次是否扣了注册奖励。
            needs_confirm:
              type: boolean
              description: 当前实现恒为 false。
            quota_outcome:
              type: string
              enum: [charged, already, paywall, quota_cost_unconfigured, anonymous, deferred]
              description: 额度结算结果。charged 已扣、already 此前已扣、paywall 待付费、anonymous 未登录不预扣、deferred 推迟到仪式门槛。
            entitlement:
              type: string
              description: |
                可能为空。取值：registration_reward、daily_free、admin_grant_free、quota_pack、quota_subscription、ai_trial。
            paywall:
              type: boolean
              description: 需要付费墙时为 true。
            quota_cost_unconfigured:
              type: boolean
              description: 走到钻石步但单价未配置时为 true，本次不扣钻石。
            kept:
              type: boolean
              description: 额度不足时记录是否保留。拦截场景一般为 true。
            generated:
              type: boolean
              description: 是否已生成解读。拦截时为 false。
            quota_prompt:
              type: string
              description: 仅在额度用尽且决策带有文案时出现。
    ReadingOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
