# 导入 Apifox：项目 → 导入 → OpenAPI，选择本文件 docs/openapi.yaml。
# 服务地址默认 http://127.0.0.1:8080。App 接口选 AppBearer，管理端选 AdminBearer。
# 说明同时见 docs/README.md。
openapi: "3.0.3"
info:
  title: 塔塔 HTTP API
  version: "1.0.0"
  description: |
    由 `server/internal/tata/routes.go` 注册的 HTTP 接口。未在该文件出现的路径不在此契约中。

    **导入 Apifox：** 导入 → OpenAPI，选择 `docs/openapi.yaml`。服务器默认 `http://127.0.0.1:8080`（`server/manifest/config/config.yaml` 的 `server.address: ":8080"`）。

    ## 包络
    `writeOK` / `writeErr` 的 JSON 为 `{ "code": 0|1, "message": "", "data": ... }`。
    - `code=0`：成功，HTTP 200，`message` 一般为空字符串。
    - `code=1`：业务失败。经 `writeErr` 或 `h()` 时 HTTP 仍多为 200，`data` 多为 `null`，`message` 为中文原因。
    - 例外：`writeQuotaBlock`、绑定冲突、今日一牌复用也是 HTTP 200 + `code=1`，但 `data` 为结构化对象。
    - 鉴权失败（`h()` 捕获 `authFail`）为 HTTP 401，`message` 为「未登录或令牌无效」。
    - `POST /api/admin/v1/auth/refresh` 在刷新令牌无效时为 HTTP 401。
    - `POST /demo/openai/v1/chat/completions` 不使用该包络。

    经 `decode` 的 JSON 会拒绝未知字段，失败文案为「请求字段不正确」。

    ## 鉴权
    Access token 为 HS256 JWT，`Authorization: Bearer <token>`，`typ=access`，约 2 小时过期。
    - **AppBearer**：`aud=app`。登录用户 `sub` 为 `app_users.id`，`anon` 为空。匿名令牌 `sub=0`，`anon` 为 anonymous_id。`role` 为空。
    - **AdminBearer**：`aud=admin`。`sub` 为 `operators.id`，`role` 为 `admin` 或 `readonly`。
    两种令牌不能互换。已合并账号（`merged_into` 非空）、不存在的用户、已停用的操作员会被拒绝。
    App 登录接口不签发 refresh token。管理端 refresh token 是库存的不透明字符串（约 7 天），不是 JWT。

    写操作调用 `adminActor(write=true)`，`readonly` 得到「只读账号不能修改」。

    全局 CORS 允许头：`Authorization`、`Content-Type`、`Idempotency-Key`。`OPTIONS` 返回 204，没有单独业务路径。

    ## 未配置的价格、验单与占位
    - 种子 SKU（`sub_month`、`sub_year`、`pack_consumable`）的 `price_amount_minor`、`price_currency`、`diamond_grant`、商店商品号、`period_count` 保持 null。接口不编造价格或钻石数。
    - `POST /api/app/v1/iap/verify` 与 restore **不调用** App Store / Google Play。只保存票据的 SHA-256，按 `product_id` 映射 `iap_skus`。`diamond_grant` 为 null 时 `credit_status=amount_unconfigured`，不写钻石流水。
    - `quota_settings.diamond_cost` 默认为 null。未配置时扣费走到钻石步会停住：`quota_outcome=diamond_cost_unconfigured`，不猜测单次消耗。
    - `paid_pools` 只是合并用的次数占位，不是 IAP 入账目标，响应里不出现价格。
    - 人工补发只加余额和审计，不改 `iap_orders`，也不唤醒 paywall（`resumed_tasks` 恒为空）。
    - 恢复购买受 `iap_settings.restore_hook_enabled` 控制（种子默认 true）。`restore_required_first_pack` 只回传，当前 handler 不据此拦截。
servers:
  - url: http://127.0.0.1:8080
    description: 本机默认（server.address = :8080）
tags:
  - name: Auth
    description: App 登录、绑定、合并确认、注销。除绑定 / 合并 / 注销外不需要 Bearer。
  - name: Profile
    description: 登录用户档案。匿名令牌会得到「匿名用户没有档案」。
  - name: Readings
    description: 占卜记录与仪式流程（检测、牌阵、洗牌、切牌、抽牌、解读、追问、工作流）。
  - name: Quota
    description: 次数与钻石的查询、确认和付费等待。优先级见各接口说明。
  - name: IAP
    description: App 内购验单、恢复、余额与 SKU。价格与发放数量未配置时保持 null。
  - name: Daily
    description: 今日 / 明日一牌与日历。
  - name: Admin Auth
    description: 管理端登录、刷新、菜单与权限码。
  - name: Admin Content
    description: 牌阵、塔罗师、提示窗、占卜记录、消息、日历、工作流模拟。
  - name: Admin Vendors
    description: 模型供应商与任务绑定。
  - name: Admin Grants
    description: 额度参数（只读）、次数流水（只读）与人工补发。
  - name: Admin IAP
    description: 订单、SKU、钻石余额与 IAP 开关。管理端只读。
  - name: Admin Audit
    description: 操作员、用户、审计与账号合并记录。
  - name: System
    description: 健康检查、演示补全、管理端跳转页。不是 /api 业务契约的主体。
components:
  securitySchemes:
    AppBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        App access JWT。Claims：`aud=app`，`typ=access`，`sub` 为用户 id（匿名为 0），`anon` 为匿名 id，`role` 为空，`exp` 约 2 小时，HS256。
        不能把管理端令牌用于 App 接口。
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Admin access JWT。Claims：`aud=admin`，`typ=access`，`sub` 为操作员 id，`role` 为 `admin` 或 `readonly`，`exp` 约 2 小时，HS256。
        不能把 App 令牌用于管理端接口。写接口还要求 `role=admin`。
  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: 正整数路径 id。无法解析或小于等于 0 时 HTTP 200、code=1、message 为「id 不正确」。
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        可选。空则不去重。同一 scope 下：首次插入 pending；完成后原样重放当时的 JSON 包络；仍为 pending 时 HTTP 200、code=1、「重复请求处理中」。
        `POST /api/app/v1/readings` 的 scope 为 `user:{id}` 或 `anon:{anonymous_id}`。
        `POST /api/app/v1/readings/{id}/followups` 的 scope 为 `followup:{readingId}`。
      schema:
        type: string
  responses:
    Unauthorized:
      description: HTTP 401。令牌缺失、无效、aud 不匹配，或账号已停用 / 已合并 / 不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: 1
            message: 未登录或令牌无效
            data: null
  schemas:
    SuccessMeta:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
          example: ""
    ErrorEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
        data:
          nullable: true
          description: 普通 writeErr 为 null。配额拦截、绑定冲突、今日一牌复用不用这个 schema。
    BoolOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: boolean
              example: true
    IdOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  format: int64
    Position:
      type: object
      additionalProperties: false
      required: [index, name, meaning]
      properties:
        index:
          type: integer
        name:
          type: string
        meaning:
          type: string
    DrawnCard:
      type: object
      properties:
        position:
          type: integer
        position_name:
          type: string
        card_id:
          type: integer
          description: 韦特牌序，力量为 VIII、正义为 XI。
        name:
          type: string
        orientation:
          type: string
          enum: [upright, reversed]
    Reading:
      type: object
      description: "scanReading / loadReading 的字段。时间是 RFC3339。"
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          nullable: true
        anonymous_id:
          type: string
          description: 无匿名 id 时为空字符串，不是 null。
        type:
          type: string
          description: normal、tarotist、explore、daily。
        question:
          type: string
        spread_id:
          type: integer
          format: int64
          nullable: true
        tarotist_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
            - QUESTION_CREATED
            - SPREAD_SELECTED
            - SHUFFLING
            - CUTTING
            - CARDS_FIXED
            - INTERPRETING
            - COMPLETED
            - FAILED_RETRYABLE
        cards:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/DrawnCard"
        interpretation:
          type: string
          nullable: true
        vendor_name:
          type: string
          nullable: true
        model_name:
          type: string
          nullable: true
        fail_reason:
          type: string
          nullable: true
        quota_consumed:
          type: boolean
          description: 数据库标记，表示已扣今日免费次数。注册奖励走 reward_consumed，不在此列表字段中。
        first_experience:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: string
        continue:
          type: string
          description: 建议的下一步动作名；完成时为空字符串。
    ReadingCreated:
      description: |
        创建占卜在 Reading 之上附加的额度结果。成功包络仍是 code=0。
        登录用户的普通 / 塔罗师占卜在这一步就按共享优先级扣费；explore 推迟到仪式门槛；匿名不预扣。
        额度用尽时记录仍保留（kept=true，generated=false），不会编造钻石单价。
      allOf:
        - $ref: "#/components/schemas/Reading"
        - type: object
          properties:
            quota_exhausted:
              type: boolean
            quota_consumed:
              type: boolean
            reward_consumed:
              type: boolean
            needs_confirm:
              type: boolean
              description: 当前实现恒为 false。
            quota_outcome:
              type: string
              enum: [charged, already, paywall, diamond_cost_unconfigured, anonymous, deferred]
            entitlement:
              type: string
              description: |
                可能为空。取值：registration_reward、daily_free、admin_grant_free、diamond_pack、diamond_subscription、ai_trial。
            paywall:
              type: boolean
            diamond_cost_unconfigured:
              type: boolean
            kept:
              type: boolean
            generated:
              type: boolean
            quota_prompt:
              type: string
              description: 仅在额度用尽且决策带有文案时出现。
    ReadingOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Reading"
    ReadingListOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Reading"
    ReadingCreatedOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ReadingCreated"
    QuotaBlock:
      type: object
      properties:
        reading_id:
          type: integer
          format: int64
        quota_outcome:
          type: string
          enum: [paywall, diamond_cost_unconfigured]
        entitlement:
          type: string
        paywall:
          type: boolean
        diamond_cost_unconfigured:
          type: boolean
          description: diamond_cost 未配置时为 true，本次不扣钻石。
        kept:
          type: boolean
          example: true
        generated:
          type: boolean
          example: false
    QuotaBlockEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
          description: |
            paywall：「今日免费次数已用完，钻石不足，请付费后自动继续；取消则保留记录且不继续生成」。
            未配置：「今日免费次数已用完，钻石消耗未配置，本次未扣钻石，记录已保留」。
        data:
          $ref: "#/components/schemas/QuotaBlock"
    Spread:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        card_count:
          type: integer
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        enabled:
          type: boolean
        charged:
          type: boolean
    SpreadBody:
      type: object
      additionalProperties: false
      required: [name, card_count, positions]
      properties:
        name:
          type: string
        description:
          type: string
        card_count:
          type: integer
          minimum: 1
        positions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Position"
          description: 长度必须等于 card_count。
        enabled:
          type: boolean
          nullable: true
          description: 省略视为 true。
        charged:
          type: boolean
          nullable: true
          description: 省略视为 false。
    Banner:
      type: object
      properties:
        id:
          type: integer
          format: int64
        copy:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        priority:
          type: integer
        target:
          type: string
    BannerBody:
      type: object
      additionalProperties: false
      required: [copy, start_at, end_at, priority, target]
      properties:
        copy:
          type: string
        start_at:
          type: string
          format: date-time
          description: RFC3339，且 end_at 必须晚于 start_at。
        end_at:
          type: string
          format: date-time
        priority:
          type: integer
        target:
          type: string
    TarotistAdmin:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        persona:
          type: string
        display_copy:
          type: string
        voice:
          type: string
        banned:
          type: string
        ask_style:
          type: string
        enabled:
          type: boolean
    TarotistBody:
      type: object
      additionalProperties: false
      required: [name, persona, display_copy, voice, banned, ask_style]
      properties:
        name:
          type: string
        persona:
          type: string
        display_copy:
          type: string
        voice:
          type: string
          description: 更新时传空字符串会保留原值。
        banned:
          type: string
          description: 更新时传空字符串会保留原值。
        ask_style:
          type: string
          description: 更新时传空字符串会保留原值。
        enabled:
          type: boolean
          nullable: true
          description: 省略视为 true。
    TarotistPublic:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        display_copy:
          type: string
    Vendor:
      type: object
      description: 列表不返回密钥明文，只返回 api_key_set。
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        base_url:
          type: string
        api_key_set:
          type: boolean
        models:
          type: array
          items:
            type: string
        timeout_sec:
          type: integer
          nullable: true
        enabled:
          type: boolean
    VendorBody:
      type: object
      additionalProperties: false
      required: [name, base_url, api_key, models]
      properties:
        name:
          type: string
        base_url:
          type: string
          description: 只允许 https，或本机演示的 http://127.0.0.1、http://localhost。
        api_key:
          type: string
          description: 写入用。更新时传空字符串表示不改已存密钥。响应不会回显。
        models:
          type: array
          minItems: 1
          items:
            type: string
        timeout_sec:
          type: integer
          nullable: true
        enabled:
          type: boolean
          nullable: true
          description: 创建时省略视为 false。启用前必须已有密钥。
    Binding:
      type: object
      properties:
        task:
          type: string
          enum: [detect, rewrite, recommend, interpret, tarotist]
        vendor_id:
          type: integer
          format: int64
          nullable: true
        model:
          type: string
    BindingBody:
      type: object
      additionalProperties: false
      required: [vendor_id, model]
      properties:
        vendor_id:
          type: integer
          format: int64
        model:
          type: string
          description: 必须属于该供应商的 models。
    QuotaView:
      type: object
      description: |
        用户可见「次数」与「钻石」分开。扣减顺序固定：注册奖励 → 今日免费次数 → 人工补发免费次数 → 钻石 → 付费等待。
        钻石先扣 pack（consumable），再扣 subscription，单次不拆桶。
        diamond_cost 未配置时为 null，不会出现猜测出来的单价。
      properties:
        cycle:
          type: string
          description: 业务日，默认按用户时区、重置点为北京时间 08:00。
          example: "2026-10-26"
        reset_at:
          type: string
          example: 北京时间 08:00
        daily_free_used:
          type: boolean
        daily_free_count:
          type: integer
          example: 1
        daily_free_remaining:
          type: integer
        daily_used_flags:
          type: integer
        reward_remaining:
          type: integer
        admin_grant_free_remaining:
          type: integer
        paid_subscription_remaining:
          type: integer
          description: paid_pools 占位次数，不是钻石，也没有价格。
        paid_pack_remaining:
          type: integer
          description: paid_pools 占位次数，不是钻石。
        subscription_prompt_required:
          type: boolean
        free_label:
          type: string
          example: 次数
        paid_label:
          type: string
          example: 钻石
        priority:
          type: string
          example: 注册奖励 → 今日免费次数 → 人工补发免费次数 → 钻石 → 付费
        diamond_spend_order:
          type: string
          example: pack_then_subscription
        diamond_cost:
          type: integer
          nullable: true
          description: quota_settings.diamond_cost。未配置为 null。
        diamond_cost_configured:
          type: boolean
        subscription_diamonds:
          type: integer
        pack_diamonds:
          type: integer
    AdminQuotaParams:
      type: object
      properties:
        reset_at:
          type: string
          example: 北京时间 08:00
        daily_free_count:
          type: integer
          example: 1
        shared_scope:
          type: string
        failure_policy:
          type: string
          example: 已扣不退
        editable:
          type: boolean
          example: false
        diamond_cost:
          type: integer
          nullable: true
        diamond_cost_configured:
          type: boolean
        diamond_spend_order:
          type: string
          example: pack_then_subscription
        free_label:
          type: string
          example: 次数
        paid_label:
          type: string
          example: 钻石
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        birth_date:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        wechat_openid:
          type: string
          nullable: true
        apple_sub:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
    ProfileBody:
      type: object
      additionalProperties: false
      properties:
        birth_date:
          type: string
          description: 空字符串表示不修改。服务端不校验日期格式。
        gender:
          type: string
          description: 空字符串表示不修改。非空只允许「女性」「男性」「不愿透露」。
          enum: ["", "女性", "男性", "不愿透露"]
        timezone:
          type: string
          description: 空字符串表示不修改。非空必须是 time.LoadLocation 可识别的 IANA 时区。
    AppAuthSession:
      type: object
      properties:
        accessToken:
          type: string
        id:
          type: integer
          format: int64
        reward_consumed:
          type: boolean
        needs_confirm:
          type: boolean
        quota_prompt:
          type: string
        reward_note:
          type: string
        registration_reward_expires_at:
          type: string
          format: date-time
          description: 注册奖励到期时间。该身份已领过时为零值时间。
        login:
          type: string
        anonymous_id:
          type: string
    AnonymousAuthOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [accessToken, anonymous_id]
              properties:
                accessToken:
                  type: string
                anonymous_id:
                  type: string
    AdminLoginOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
