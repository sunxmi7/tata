            type: integer
            format: int64
        tokens_per_quota:
          type: integer
          nullable: true
          description: 多少 token 折成 1 额度。null 未启用。启用后解读、改写、年运生成、会员追问按输入加输出 token 向上取整。结算尚未读取。
        tokens_per_quota_editable:
          type: boolean
          example: true
        quota_spend_order:
          type: string
          example: quota
        free_label:
          type: string
          example: 次数
        paid_label:
          type: string
          example: 额度
    AdminQuotaUpdateBody:
      type: object
      additionalProperties: false
      properties:
        daily_free_count:
          type: integer
          description: 已下线。传入即拒绝。
        daily_slot_count:
          type: integer
          description: 已下线。传入即拒绝。
        followup_limit:
          type: integer
          nullable: true
          description: 正整数；null 表示不限制。
        quota_cost:
          type: integer
          nullable: true
          description: 会员每次扣额度的单价。正整数；null 表示未配置，不编造。
        quota_cost:
          type: integer
          nullable: true
          description: 与 quota_cost 相同。
        registration_grant_delay_minutes:
          type: integer
          nullable: true
          minimum: 0
          description: null 不自动发放。0 表示注册完成立即发放。
        registration_valid_days:
          type: integer
          minimum: 1
        registration_grant_count:
          type: integer
          minimum: 1
        registration_spread_ids:
          type: array
          items:
            type: integer
            format: int64
        tokens_per_quota:
          type: integer
          nullable: true
          minimum: 1
          description: 多少 token 折成 1 额度。正整数；null 表示未启用，结算仍按会员单次额度。
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户数字 id，服务端主键。不是公开短 ID。
        email:
          type: string
          description: 已绑邮箱。未绑为空字符串或 null。
        birth_date:
          type: string
          nullable: true
          description: 生日 YYYY-MM-DD。未填为 null。
        gender:
          type: string
          nullable: true
          description: 女性 / 男性 / 其他 / 不愿透露。未填为 null。PUT 也接受 UI 用的「女」「男」。
        explore_preferences:
          type: array
          description: 探索偏好，可多选。取值仅限个人档案八项。未填为空数组。
          items:
            type: string
            enum: [感情与关系, 工作与学业, 自我成长, 人生选择, 日常生活, 财务与规划, 情绪与疗愈, 人际相处]
        explore_preference_options:
          type: array
          description: 个人档案可选的探索偏好全集，便于客户端渲染选项。
          items:
            type: string
        wechat_openid:
          type: string
          nullable: true
          description: 已绑微信身份。未绑为 null。值为服务端换票后的 unionid 或 openid，不是客户端 code。
        apple_sub:
          type: string
          nullable: true
          description: 已绑苹果 sub。未绑为 null。
        timezone:
          type: string
          description: IANA 时区，默认 Asia/Shanghai。影响业务日与今日免费重置。
        name:
          type: string
          description: 昵称。微信登录优先微信昵称；邮箱/苹果登录生成 4–6 个汉字随机昵称。可自行修改。
        nickname:
          type: string
          description: 与 name 相同。账号页展示昵称。
        bio:
          type: string
          description: 简介。未设置时为空字符串。
        avatar_url:
          type: string
          nullable: true
          description: 头像 URL。已上传或微信转存的地址；未设置时返回内置默认头像 /uploads/avatar-default.png。可 POST /uploads 后再 PUT 更换。
        public_id:
          type: string
          description: 6 位短公开 ID，首次读档案时生成并固化。
        account_display:
          type: string
          description: |
            账号页主展示。优先脱敏邮箱（本地第一部分字符 + *** + @域名）。
            无邮箱则「微信已绑定」或「Apple 已绑定」。无手机号。
    ProfileBody:
      type: object
      additionalProperties: false
      properties:
        birth_date:
          type: string
          description: 空字符串表示不修改。服务端不校验日期格式。
        gender:
          type: string
          description: |
            空字符串表示不修改。非空允许「女性」「男性」「其他」「不愿透露」，以及个人档案 UI 的「女」「男」。
            「女」存为女性，「男」存为男性，「其他」原样入库，不再映射为不愿透露。
          enum: ['', 女性, 男性, 其他, 不愿透露, 女, 男]
        explore_preferences:
          type: array
          description: 省略不修改。传数组则整表替换。只允许个人档案八项，可空数组清空。
          items:
            type: string
            enum: [感情与关系, 工作与学业, 自我成长, 人生选择, 日常生活, 财务与规划, 情绪与疗愈, 人际相处]
        timezone:
          type: string
          description: 空字符串表示不修改。非空必须是 time.LoadLocation 可识别的 IANA 时区。
        name:
          type: string
          description: 空字符串表示不修改。非空最多 32 个字。账号中心「昵称」。
        nickname:
          type: string
          description: 与 name 同一列。仅填 nickname 时写入 name；两个都传则以 name 为准。
        bio:
          type: string
          description: 空字符串表示不修改。非空最多 200 个字。
        avatar_url:
          type: string
          description: |
            空字符串表示不修改。非空须为 http(s) URL 或 /uploads/{name}。
            改头像先 POST /api/app/v1/uploads（folder=misc），再把返回的 data.url 写到这里。没有单独的上传头像 path。
    AppAuthSession:
      type: object
      properties:
