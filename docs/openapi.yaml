        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/vendors/{id}/probe:
    post:
      tags: [供应商]
      operationId: adminProbeVendor
      summary: 探测供应商连通性
      description: 供应商必须启用且能解密密钥。向其第一个模型发送「ping」。无请求体。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data.ok=true。失败为「连通性探测失败」等业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            type: object
                            properties:
                              ok:
                                type: boolean
                                example: true
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/bindings:
