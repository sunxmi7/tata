      responses:
        "200":
          description: data 为 5 条 Binding。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Binding"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/bindings/{task}:
    put:
      tags: [供应商]
      operationId: adminPutBinding
      summary: 设置任务绑定
      description: task 只允许 detect、rewrite、recommend、interpret、tarotist。供应商必须启用，模型必须属于该供应商。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: task
          in: path
          required: true
          schema:
            type: string
            enum: [detect, rewrite, recommend, interpret, tarotist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingBody"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/quota-params:
    get:
      tags: [额度补发]
      operationId: adminGetQuotaParams
      summary: 读取额度参数
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        重置时刻不可改（editable=false）。
        每日免费和今日一牌次数已下线，提交 daily_free_count 或 daily_slot_count 会拒绝。
        followup_limit、quota_cost 可改，改完即用于结算。
        tokens_per_quota 是多少 token 折成 1 额度。null 未启用，结算尚未读取。
        registration_grant_delay_minutes 为空则不自动发放注册赠送；0 为注册完成立即发。
        registration_valid_days 默认 3，registration_grant_count 默认 1。
        registration_spread_ids 只接受 3 张及以内的普通占卜牌阵。结算用这份名单判断注册赠送和邀请能否用于普通占卜。
        followup_limit 种子默认 5，null 不限制。
        quota_cost 未配置时为 null。响应不含价格。
      responses:
        "200":
          description: data 为 AdminQuotaParams。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminQuotaParams"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [额度补发]
      operationId: adminPutQuotaParams
      summary: 修改每日免费次数、今日一牌次数或追问上限
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        需要 role=admin。可改每日免费次数、今日一牌次数、追问上限、会员单次额度，以及注册赠送的发放间隔、有效天数、次数和牌阵白名单。
        请求里带 reset_at 仍拒绝「重置时刻不可修改」。至少带一个可改字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuotaUpdateBody"
      responses:
        "200":
          description: 成功 data 为最新 AdminQuotaParams；非法字段为 ErrorEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AdminQuotaParams"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [额度补发]
      operationId: adminPostQuotaParams
      summary: 拒绝新增额度参数
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 与 PUT 相同，写接口恒拒绝。请求体被忽略。
      responses:
        "200":
          description: code=1。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/uploads:
    post:
      tags: [管理端内容]
      operationId: adminUploads
      summary: 上传图片
      description: 需要 role=admin。JSON（filename/content_type/content_base64）或 multipart 字段 file。query folder 指定子目录（spreads/decks/cards/feedback/misc，缺省 misc）。返回可引用 url。仅 jpg/png/webp/gif，最大 5MB。只读账号不能上传。落地由 config.yaml 的 upload.driver 决定（local 或阿里云 OSS）。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: folder
          in: query
          required: false
          schema:
            type: string
            enum: [spreads, decks, cards, feedback, misc, custom]
          description: 子目录。缺省 misc。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadBody"
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 成功返回 url。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/UploadResult"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/copy/{kind}:
    get:
      tags: [管理端内容]
      operationId: adminGetCopy
      summary: 读取运营文案
      description: |
        kind 为 yearly、cards、help、campaigns、decks、legal。
        年运存在 app_config（yearly.{year}.{section}）。单牌目录在 cards 表；GET/PUT copy/cards 仍可用，写 yi/thumbnail 进 cards，模板/默认图仍在 app_config。
        牌组风格在 decks 表（含 description / tags）；帮助、活动改已有表。会员专属活动文案在 iap_skus.copy，不走本接口。
        legal 读写 app_config legal.user_agreement / legal.privacy_policy，给登录页协议链接。未填 App 返回 pending。
        cards 的 data 含 thumbnail_template、thumbnail_default 与固定 78 张 items（deck() 顺序）。完整目录含新建项见 GET /api/admin/v1/cards。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [yearly, cards, help, campaigns, decks, legal]
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: 仅 yearly。缺省为当前年（北京时间）。
      responses:
        "200":
          description: data 随 kind 变化。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [管理端内容]
      operationId: adminPutCopy
      summary: 保存运营文案
      description: 需要 role=admin。yearly 写 app_config；cards 写 cards 表（yi/thumbnail）与模板/默认图；decks 写牌组风格（name/cover_url|thumbnail/back_url/description/tags）与可选 faces[{card_id,image_url}]（写入 deck_faces，至少保留一套启用）；help 可改分类名和排序，或改已有问题的标题、正文、排序；campaigns 更新已有表；legal 写 app_config 协议正文。新建帮助问题用 POST /copy/help，删除用 DELETE /copy/help/{article_id}。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [yearly, cards, help, campaigns, decks, legal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: 成功返回最新文案；非法为 ErrorEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            type: object
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/banners:
    get:
      tags: [管理端内容]
      operationId: adminListBanners
      summary: 提示窗列表
      parameters:
        - $ref: "#/components/parameters/Authorization"
