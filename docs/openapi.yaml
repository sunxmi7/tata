  /api/admin/v1/workflow/simulate:
    post:
      tags: [Admin Content]
      operationId: adminSimulateWorkflow
      summary: 模拟工作流
      security:
        - AdminBearer: []
      description: |
        需要 role=admin。不写占卜记录，不扣费。
        step 为空时跑 detect、rewrite、recommend、interpret；有 tarotist_id 时再加 tarotist。
        step 为单步时只跑那一步。draw 只排牌面文字。未知步骤拒绝。
        问题省略时使用内置示例问题，不是价格或商品。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                spread_id:
                  type: integer
                  format: int64
                cards:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/DrawnCard"
                tarotist_id:
                  type: integer
                  format: int64
                step:
                  type: string
                  enum: ["", detect, rewrite, recommend, draw, interpret, tarotist]
      responses:
        "200":
          description: 全流程为 SimulateFull；单步为 SimulateOne。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            oneOf:
                              - $ref: "#/components/schemas/SimulateFull"
                              - $ref: "#/components/schemas/SimulateOne"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
