      responses:
        "200":
          description: data 为 IAPConfig。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IAPConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/messages:
    get:
      tags: [管理端内容]
      operationId: adminListMessages
      summary: 追问消息
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 全库最近 200 条，按 id 降序。含 reading_id。
      responses:
        "200":
          description: data 为消息数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/wishlists:
    get:
      tags: [管理端内容]
      operationId: adminListWishlists
      summary: 功能心愿单
