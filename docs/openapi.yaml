    QuotaView:
      type: object
      description: |
        按当前是否会员分流。免费用户返回今日免费 / 邀请 / 人工补发，不返回额度余额。
        会员返回统一额度 quota_remaining，不返回每日免费。
        免费扣费顺序：今日免费（全局 1 次，含普通≤3 张牌与今日/明日）→ 邀请奖励 → 人工补发 → 开通会员。
        会员每次扣 quota_settings.quota_cost；未配置为 null，quota_outcome=quota_cost_unconfigured。
        followup_limit 为每条解读可追问次数，种子默认 5，null 不限制。
      properties:
        cycle:
          type: string
          description: 业务日，默认按用户时区、重置点为北京时间 08:00。
          example: '2026-10-26'
        reset_at:
          type: string
          example: 北京时间 08:00
          description: 今日免费次数重置点的展示文案。
        daily_free_used:
          type: boolean
          description: 今日免费次数是否已用完。
        daily_free_count:
          type: integer
          example: 1
          description: 每个业务日的免费次数配额。管理端 quota-params 可改，默认 1。
        daily_slot_count:
          type: integer
          example: 1
          description: 每个业务日可抽今日一牌（含明日运势）的次数。管理端可改，默认 1。
        daily_free_remaining:
          type: integer
          description: 今日免费次数剩余。
        daily_used_flags:
          type: integer
          description: 今日已占用的免费次数标记位数，内部计数。
        reward_remaining:
          type: integer
          description: 历史字段。旧注册奖励余额已下线。新的注册赠送见 registration_gift。
        registration_gift:
          type: object
          nullable: true
          description: 登录用户的注册赠送记录。间隔未配置时 granted_at 为 null、remaining 为 0。未登录不返回。
          properties:
            registered_at:
              type: string
              format: date-time
              nullable: true
            granted_at:
              type: string
              format: date-time
              nullable: true
              description: 实际发放时间。未发放为 null。
            usable_at:
              type: string
              format: date-time
              nullable: true
            expires_at:
              type: string
              format: date-time
              nullable: true
              description: 从实际发放时刻起，按配置的有效天数计算。
            total:
              type: integer
            remaining:
              type: integer
            used:
              type: boolean
            used_at:
              type: string
              format: date-time
              nullable: true
        invite_remaining:
          type: integer
          description: 邀请奖励剩余次数。不过日清。仅免费用户返回。
        invite_count:
          type: integer
          description: 已成功邀请人数。上限 5。
        max_invites:
          type: integer
          example: 5
          description: 邀请人数上限。
        is_member:
          type: boolean
          description: 当前是否有效会员。
        can_buy_pack:
          type: boolean
          description: 是否可买额度补充包。仅会员为 true。
        quota_remaining:
          type: integer
          description: 会员统一额度。免费用户不返回。
        membership:
          type: object
          description: 当前会员摘要。非会员为 null 或不出现。
        admin_grant_free_remaining:
          type: integer
          description: 人工补发的免费次数剩余。仅免费用户返回。
        subscription_prompt_required:
          type: boolean
          description: 合并账号后订阅需要用户选择时为 true。
        free_label:
          type: string
          example: 次数
          description: 免费次数在 UI 上的名称。
        paid_label:
          type: string
          example: 额度
          description: 付费额度在 UI 上的名称。
        priority:
          type: string
          example: 今日免费次数 → 邀请奖励次数
          description: 扣减顺序说明文案。会员为「会员统一额度」。
        quota_spend_order:
          type: string
          description: 历史字段。两桶钻石已并入统一额度，当前不再返回。
        quota_cost:
          type: integer
          nullable: true
          description: 会员每次扣额度的单价。未配置为 null。与 quota_cost 同值。
        quota_cost_configured:
          type: boolean
          description: quota_cost 是否已配置。false 时会员扣费停住。
        quota_cost:
          type: integer
          nullable: true
          description: 与 quota_cost 相同，会员单价。
        quota_cost_configured:
          type: boolean
          description: 与 quota_cost_configured 相同。
        display_label:
          type: string
          example: 额度
          description: UI 展示名。
        balance:
          type: integer
          description: 会员统一额度，与 quota_remaining 相同。免费用户不返回。
        followup_limit:
          type: integer
          nullable: true
