                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HelpCategoryList"
  /api/app/v1/help/articles:
    get:
      tags: [帮助]
      operationId: appHelpArticles
      summary: 帮助文章列表与搜索
      description: |
        公开，不需要登录。category 省略时返回全部分类下已有标题。q 按标题子串过滤。
        搜索无结果时 empty_title=暂时没有找到相关问题，empty_hint=换个关键词，或向我们反馈。
        未搜索且分类 articles_status=pending 时，category_note 使用该分类 empty_note。
        列表不含正文。未知分类 message=问题分类不正确。
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: reading 或 account。
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: 标题关键词。最长 64 字。
      responses:
        "200":
          description: data 为 HelpArticleList。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/HelpArticleList"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/help/articles/{id}:
    get:
      tags: [帮助]
      operationId: appHelpArticle
      summary: 帮助文章详情
      description: |
        公开，不需要登录。返回标题与正文。当前两类正文 body_status=ready。
        不编写额度、退款或会员规则。反馈入口走已有 POST /api/app/v1/feedback，不在本文返回规则。
        未知 id 的 message=问题不存在。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: how_to_start
      responses:
        "200":
          description: 成功为 HelpArticle；不存在为 ErrorEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/HelpArticle"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/monthly-reports:
    get:
      tags: [占卜解读]
      operationId: appMonthlyReports
      summary: 月度报告
      description: |
        必须登录。month 缺省为用户时区当前月。未来月份拒绝。
        统计来自该月 readings。寄语截取当月已完成解读，无则 quote_status=pending，不编造。
        演示：`?demo=1`/`ready` 或 `?demo=empty`；也可配置 `reports.demo=true`。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "2026-11"
        - name: demo
          in: query
          required: false
          schema:
            type: string
            enum: ["1", ready, empty]
      responses:
        "200":
          description: data 为 MonthlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/MonthlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/monthly-reports/save:
    post:
      tags: [占卜解读]
      operationId: appSaveMonthlyReport
      summary: 保存月度报告
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 必须登录。按 user+month 幂等保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlySaveBody"
            examples:
              成功:
                summary: 保存当月报告
                value:
                  month: "2026-11"
      responses:
        "200":
          description: data 为 MonthlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/MonthlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}:
    get:
      tags: [占卜解读]
      operationId: appYearlyReport
      summary: 年度运势
      description: |
        必须登录。路径 id 为年份。年卡有效则 unlocked=true。单独购买价格取已启用的 yearly_unlock SKU（种子 2880 分）。卖点四段取 app_config yearly.{year}.*，未填 content_status=pending。解锁后四步：profile（出生日期/时间/地点）→ rhythm（十二宫 12）→ domains（四季 4）→ generate。
        演示：`?demo=1`/`ready` 或 `?demo=locked`；也可配置 `reports.demo=true`。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
        - name: demo
          in: query
          required: false
          schema:
            type: string
            enum: ["1", ready, locked]
      responses:
        "200":
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/share:
    get:
      tags: [占卜解读]
      operationId: appYearlyShare
      summary: 年运分享报告
      description: |
        必须登录。路径 id 为年份。返回分享图所需的品牌、标题、昵称和已生成报告正文。
        不编造年度关键词或春夏秋冬金句；客户端用 report 自行排版或截图。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: data 为 YearlyShare。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyShare"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/unlock:
    post:
      tags: [占卜解读]
      operationId: appUnlockYearlyReport
      summary: 解锁年度运势
      description: 必须登录。年卡有效则免费解锁；已定价则提示通过内购单独解锁；未定价则「年卡未开通，单独购买价格未配置」。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/profile:
    put:
      tags: [占卜解读]
      operationId: appYearlyProfile
      summary: 年运填写基本信息
      description: 必须已解锁。birth_date（YYYY-MM-DD，不能是未来）、birth_time（HH:MM）、birth_place 必填。gender 可选：女性 / 男性 / 其他 / 不愿透露。同时写入档案。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YearlyProfileBody"
            examples:
              成功:
                summary: 填写年运资料
                value:
                  birth_date: "1990-01-01"
                  birth_time: "08:30"
                  birth_place: 北京
                  gender: 不愿透露
      responses:
        "200":
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/rhythm:
    post:
      tags: [占卜解读]
      operationId: appYearlyRhythm
      summary: 年运抽十二宫牌阵
      description: 必须已填基本信息。normal 随机 12 张（自我到潜意识）；pick 传 12 个不重复 1–78。抽完不可重抽。响应 rhythm_cards 与 house_cards 同内容。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YearlyDrawBody"
            examples:
              成功:
                summary: 抽取十二宫牌
                value:
                  mode: normal
      responses:
        "200":
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/domains:
    post:
      tags: [占卜解读]
      operationId: appYearlyDomains
      summary: 年运抽四季牌阵
      description: 春、夏、秋、冬。从剩余牌抽取 4 张，不与十二宫牌重复。响应 domain_cards 与 season_cards 同内容。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YearlyDrawBody"
            examples:
              成功:
                summary: 抽取四季牌
                value:
                  mode: normal
      responses:
        "200":
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/generate:
    post:
      tags: [占卜解读]
      operationId: appYearlyGenerate
      summary: 生成年度报告
      description: |
        必须已抽完十二宫 12 + 四季 4。走 interpret 供应商生成，不编造。已生成则原样返回。
        JSON 等完整报告；打字机请用 `/generate/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: data 为 YearlyReport。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/YearlyReport"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/yearly-reports/{id}/generate/stream:
    post:
      tags: [占卜解读]
      operationId: appYearlyGenerateStream
      summary: 生成年度报告（SSE 流式）
      description: |
        与 generate 相同的解锁与牌面门槛。已生成则直接 `done`（data 含 report、reused=true）。
        否则以 SSE 逐段下发 interpret 供应商输出。请求体为 `{}`。
        事件：delta（data:{"text":"片段"}）、done（data:{"report": YearlyReport}）、error。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: 成功为 text/event-stream。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流。"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/deck-preference:
    get:
      tags: [占卜解读]
      operationId: appGetDeckPreference
      summary: 牌面风格
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        必须登录。available 来自 decks 表已启用项；种子仅 rider-waite（莱德韦特）。
        每项含 name / thumbnail / description / tags。介绍与标签未填时为空串和空数组，不编造。
        预览图未配则用内置默认牌背。78 张牌预览走 GET /cards?deck=。
      responses:
        "200":
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/DeckPreference"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [占卜解读]
      operationId: appPutDeckPreference
      summary: 更换牌面风格
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 必须登录。code 须为 decks 中已启用的牌组，否则「该牌面风格尚未开放」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckPreferenceBody"
            examples:
              成功:
                summary: 选择莱德韦特
                value:
                  code: rider-waite
      responses:
        "200":
          description: data 为 DeckPreference。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/DeckPreference"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/auth/login:
    post:
      tags: [管理端登录]
      operationId: adminLogin
      summary: 管理端登录
      description: |
        不使用 decode 的未知字段限制。用户名空或密码错误、账号停用，均为 HTTP 200、code=1、「用户名或密码错误」。
        本地种子：admin/admin123（admin）、readonly/readonly123（readonly）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 成功含 accessToken 与 refreshToken。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminLoginOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/admin/v1/auth/logout:
    post:
      tags: [管理端登录]
      operationId: adminLogout
      summary: 管理端登出
      description: 不要求 Bearer。body 可省略。提供 refreshToken 时吊销该行。响应恒为 data=true。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: data=true。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolOK"
  /api/admin/v1/auth/refresh:
    post:
      tags: [管理端登录]
      operationId: adminRefresh
      summary: 刷新管理端 access token
      description: |
        刷新令牌必须属于 admin、未吊销、未过期，且操作员未停用。
        无效时 HTTP 401、「刷新令牌无效」。停用为 HTTP 401、「账号已停用」。
        成功时 data 是 JWT 字符串，不是对象。不轮换 refresh token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: code=0，data 为 access JWT。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminRefreshOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 刷新令牌无效或账号已停用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/admin/v1/user/info:
    get:
      tags: [管理端登录]
      operationId: adminInfo
      summary: 当前操作员
      parameters:
        - $ref: "#/components/parameters/Authorization"
      responses:
        "200":
          description: |
        roles 含 role 与已授权模块 id，供前端过滤菜单。
        homePath：admin 或有内容权限为 /tata/spread，否则为第一个有权限模块的首页。
        token 字段为空字符串。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/auth/codes:
    get:
      tags: [管理端登录]
      operationId: adminCodes
      summary: 权限码
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        role=admin 时含 write 以及五个模块与对应 :write（如 content、content:write）。
        readonly 只含已授权模块 id，可写时再加 module:write。无模块则为空数组。
      responses:
        "200":
          description: data 为字符串数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/menu/all:
    get:
      tags: [管理端登录]
      operationId: adminMenu
      summary: 后台菜单
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 按当前账号模块权限过滤。admin 返回全部；操作员项仅 admin 可见。前端默认 accessMode=frontend，菜单以后端 roles 过滤本地路由为准。
      responses:
        "200":
          description: data 为菜单项数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminMenuItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/spreads:
    get:
      tags: [管理端内容]
      operationId: adminListSpreads
      summary: 牌阵列表
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 含停用牌阵。只读角色可访问。
      responses:
        "200":
          description: data 为 Spread 数组，含 enabled、charged 与 recommended。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Spread"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [管理端内容]
      operationId: adminCreateSpread
      summary: 新建牌阵
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 需要 role=admin。名称非空，card_count>=1，positions 长度必须等于牌数。recommended=true 时取消其他牌阵的推荐。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadBody"
      responses:
        "200":
          description: 成功 data.id 为新 id。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IdOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/spreads/{id}:
    put:
      tags: [管理端内容]
      operationId: adminUpdateSpread
      summary: 更新牌阵
      description: 已被占卜使用时不能改牌数或牌位，只能改名称、说明、启用、是否计费、推荐标记和示意图。recommended=true 时取消其他牌阵的推荐。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadBody"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [管理端内容]
      operationId: adminDeleteSpread
      summary: 删除牌阵
