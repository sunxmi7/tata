              $ref: "#/components/schemas/BannerBody"
      responses:
        "200":
          description: 成功返回 id。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IdOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/push/broadcast:
    post:
      tags: [管理端内容]
      operationId: adminBroadcastPush
      summary: 群发消息推送
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        只读账号不能发。落一条站内信（audience=all 或定向 user），并按配置下发个推。
        默认按 messages_enabled 聚合已开启消息通知的设备定向下发；to_app=true 时走个推 /push/all 真·全量（忽略偏好）。
        个推未配置或 enabled=false 时只落站内信，push_enabled=false。
      requestBody:
