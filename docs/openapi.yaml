          format: int64
        operator_id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [diamonds, free_count]
        amount:
          type: integer
        bucket:
          type: string
          description: diamonds 为 pack 或 subscription；free_count 为空字符串。
        ledger_bucket:
          type: string
          description: pack 对应 consumable；subscription 对应 subscription；免费次数为空。
        reason:
          type: string
          example: admin_grant
        note:
          type: string
        diamond_ledger_id:
          type: integer
          format: int64
          nullable: true
        count_ledger_id:
          type: integer
          format: int64
          nullable: true
        balance_after:
          type: integer
        free_count_after:
          type: integer
        created_at:
          type: string
          format: date-time
    GrantCreate:
      type: object
      additionalProperties: false
      required: [user_id, note]
      properties:
        user_id:
          type: integer
          format: int64
        diamonds:
          type: integer
          minimum: 0
          maximum: 100000
          description: 与 free_count 至少一个大于 0。默认进入 pack 桶（pack_diamonds / diamond_ledger.bucket=consumable）。
        diamond_bucket:
          type: string
          enum: ["", pack, subscription]
          description: 省略或空字符串等于 pack。subscription 只累加 subscription_diamonds，不改订阅周期。
        free_count:
          type: integer
          minimum: 0
          maximum: 100000
          description: 加到 rewards.admin_grant_remaining，不改注册奖励 remaining。
        reason:
          type: string
          description: 省略或 admin_grant。其他值拒绝。
          example: admin_grant
        note:
          type: string
          maxLength: 500
          description: 必填，按码点最多 500。
    FollowupOKData:
      type: object
      properties:
        turn_id:
          type: integer
          format: int64
        bubbles:
          type: array
          maxItems: 4
          items:
            type: string
        cards_unchanged:
          type: boolean
          example: true
        error:
          type: string
          description: 模型失败时出现。文案说明未重新扣次数或钻石。
        quota_outcome:
          type: string
        entitlement:
          type: string
        charged:
          type: boolean
          description: 试用（ai_trial）为 false。
        new_reading:
          type: boolean
        reading:
          $ref: "#/components/schemas/ReadingCreated"
        charged_here:
          type: boolean
    DailyReuseEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
        message:
          type: string
          description: 当日名额已占用，或「该日已有结果，不重复扣次数或钻石」。
        data:
          type: object
          properties:
            reused:
              type: boolean
              example: true
            charged:
              type: boolean
              example: false
            reading:
              $ref: "#/components/schemas/Reading"
    ConfirmQuotaData:
      type: object
      properties:
        quota_consumed:
          type: boolean
        entitlement:
          type: string
        quota_outcome:
          type: string
        message:
          type: string
    UseRewardData:
      type: object
      description: 尽管路径叫 use-reward，实际走共享优先级，不保证扣的是注册奖励。
      properties:
        reward_consumed:
          type: boolean
          description: 仅当本次 entitlement=registration_reward 时为 true。
        already:
          type: boolean
        entitlement:
          type: string
        quota_outcome:
          type: string
        note:
          type: string
          example: 已按优先级处理：注册奖励，今日免费次数，人工补发免费次数，然后钻石
    PaywallResult:
      type: object
      properties:
        cancelled:
          type: boolean
        kept:
          type: boolean
        generated:
          type: boolean
        reading_id:
          type: integer
          format: int64
        resumed_tasks:
          type: array
          items:
            $ref: "#/components/schemas/ResumedTask"
    SimulateFull:
      type: object
      properties:
        engine:
          type: string
          example: eino
        persisted:
          type: boolean
          example: false
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DrawnCard"
        app_call:
          type: object
          properties:
            method:
              type: string
            path:
              type: string
            body:
              type: object
            note:
              type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlowStep"
    SimulateOne:
      type: object
      properties:
        step:
          type: string
        title:
          type: string
        text:
          type: string
        vendor:
          type: string
        model:
          type: string
        error:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/DrawnCard"
    AppWorkflowResult:
      type: object
      properties:
        engine:
          type: string
          example: eino
        reading:
          $ref: "#/components/schemas/Reading"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlowStep"
        app_call:
          type: string
    HealthOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  example: ok
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 健康检查
      responses:
        "200":
          description: code=0，data.status=ok。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
  /demo/openai/v1/chat/completions:
    post:
      tags: [System]
      operationId: demoOpenAI
      summary: 本地演示用的对话补全
      description: |
        不走 `{code,message,data}`。供供应商探测和单飞测试使用。
        若设置了进程内 DemoHold，会先等待再返回。回复前缀为「【演示解读】」。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      content:
                        type: string
      responses:
        "200":
          description: 类 OpenAI 的 choices 结构。
          content:
            application/json:
              schema:
                type: object
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              example: assistant
                            content:
                              type: string
  /admin:
    get:
      tags: [System]
      operationId: getAdminPage
      summary: 管理端页面跳转
      description: "307 到 http://127.0.0.1:5666/（vben）。不是 JSON API。"
      responses:
        "307":
          description: Temporary Redirect。
          headers:
            Location:
              schema:
                type: string
                example: http://127.0.0.1:5666/
  /admin/:
    get:
      tags: [System]
      operationId: getAdminPageSlash
      summary: 管理端页面跳转（带斜杠）
      description: 与 GET /admin 相同，跳到 vben。
      responses:
        "307":
          description: Temporary Redirect。
          headers:
            Location:
              schema:
                type: string
                example: http://127.0.0.1:5666/
  /demo:
    get:
      tags: [System]
      operationId: getDemoPage
      summary: 演示 HTML
      responses:
        "200":
          description: text/html 演示页。
          content:
            text/html:
              schema:
                type: string
  /api/app/v1/auth/anonymous:
    post:
      tags: [Auth]
      operationId: appAnonymous
      summary: 匿名进入
      description: 不需要令牌，也不读取请求体。签发 aud=app、sub=0 的 access JWT。不签发 refresh。
      responses:
        "200":
          description: 成功为 AnonymousAuthOK。内部错误为 code=1、「内部错误」。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AnonymousAuthOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/register:
    post:
      tags: [Auth]
      operationId: appRegister
      summary: 邮箱注册
      description: |
        邮箱和密码必填。邮箱冲突返回「邮箱已注册」。
        该邮箱未在 identity_claims 出现过时发放注册奖励，到期为下一个北京时间 08:00。
        若带 anonymous_id，会把匿名占卜转给新用户。
        若该用户已有未结算的占卜，会按共享优先级立刻扣一次（一开始提问就消耗）。
        不签发 refresh。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "200":
          description: code=0 时 data 含 accessToken、id、registration_reward_expires_at、reward_consumed、reward_note。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/login:
    post:
      tags: [Auth]
      operationId: appLogin
      summary: 邮箱登录
      description: |
        邮箱或密码错误、或账号已注销，均为 HTTP 200、code=1、「邮箱或密码错误」。
        成功时 needs_confirm 恒为 false。若未在登录时扣掉未结算占卜，且本周期已用过免费次数，quota_prompt 为「今日免费体验额度已用完，本次记录已保存到历史记录」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: code=0 时 data 含 accessToken、id、reward_consumed、needs_confirm、quota_prompt。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/wechat:
    post:
      tags: [Auth]
      operationId: appWechat
      summary: 微信身份登录
      description: |
        以 openid 查找或创建用户。已注销身份不能再次领取注册奖励。
        新用户会发注册奖励。成功后会尝试结算未扣费的占卜。
        data.reward_note 为「注册奖励优先于今日免费次数，提问时自动扣减」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatBody"
      responses:
        "200":
          description: code=0 时 data 含 accessToken、id、reward_consumed、reward_note。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/apple:
    post:
      tags: [Auth]
      operationId: appApple
      summary: 苹果身份登录
      description: |
        以 sub 查找或创建用户。已注销身份不能再次领取注册奖励。
        与微信登录不同：成功响应不调用提问结算，data 只有 accessToken、id、login=apple。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleBody"
      responses:
        "200":
          description: code=0 时 data.login 为 apple。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/bind-wechat:
    post:
      tags: [Auth]
      operationId: appBindWechat
      summary: 绑定微信
      security:
        - AppBearer: []
      description: |
        需要登录用户。身份空闲则直接绑定，data=true。
        已被其他未注销、未合并账号占用时不搬迁数据，返回 BindConflictEnvelope，并留下 pending_confirm 合并请求。
        换绑未开放。重复绑定同一个 openid 返回 true。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatBody"
      responses:
        "200":
          description: 绑定成功 code=0；冲突 code=1 且 data 为 BindConflict；其他业务错误 data 为 null。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/BindConflictEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/bind-apple:
    post:
      tags: [Auth]
      operationId: appBindApple
      summary: 绑定苹果
      security:
        - AppBearer: []
      description: 规则同绑定微信，身份种类为 apple。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleBody"
      responses:
        "200":
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/BindConflictEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/bind-email:
    post:
      tags: [Auth]
      operationId: appBindEmail
      summary: 绑定邮箱
      security:
        - AppBearer: []
      description: |
        邮箱按小写比较。空闲则写入邮箱和密码哈希。
        冲突时同样只创建待确认合并，不立刻并账。已绑定过邮箱不能换绑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBindBody"
      responses:
        "200":
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/BindConflictEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/bind-phone:
    post:
      tags: [Auth]
      operationId: appBindPhone
      summary: 绑定手机号
      security:
        - AppBearer: []
      description: 规则同绑定微信，身份种类为 phone。服务端不校验号码格式。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneBody"
      responses:
        "200":
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/BindConflictEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/merge-confirm:
    post:
      tags: [Auth]
      operationId: appMergeConfirm
      summary: 确认账号合并
      security:
        - AppBearer: []
      description: |
        只有发起绑定的主账号可以确认。confirm=false 不会合并。
        成功后次账号标记 merged_into，占卜、消息、注册奖励、人工补发次数、今日免费、paid_pools 占位次数和钻石余额并入主账号。
        钻石加总不在响应里返回数字；paid_* 仍是占位次数，没有价格。订阅到期相同且多于一条时 subscription_resolution=prompt_required。
        已经合并的请求会重放当时保存的结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeConfirmBody"
      responses:
        "200":
          description: code=0 时 data 为 MergeOutcome。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/MergeOutcome"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/cancel:
    post:
      tags: [Auth]
      operationId: appCancel
      summary: 注销账号
      security:
        - AppBearer: []
      description: |
        登录用户把邮箱、微信、苹果、手机号写入 identity_claims（小写），再清空这些身份与密码并设置 cancelled_at。
        会吊销 audience=app 的 refresh。当前 App 登录并不签发 refresh。已注销再调用返回「账号已注销」。
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/profile:
    get:
      tags: [Profile]
      operationId: appGetProfile
      summary: 读取档案
      security:
        - AppBearer: []
      responses:
        "200":
          description: 匿名用户为业务错误「匿名用户没有档案」。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/Profile"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      operationId: appPutProfile
      summary: 更新档案
      security:
        - AppBearer: []
      description: 只更新 birth_date、gender、timezone 中的非空字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileBody"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/spreads:
    get:
      tags: [Readings]
      operationId: appListSpreads
      summary: 可用牌阵
      security:
        - AppBearer: []
      description: 只返回 enabled=true，按 id 升序。匿名令牌也可以读。
      responses:
        "200":
          description: data 为牌阵数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Spread"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/banners:
    get:
      tags: [Readings]
      operationId: appListBanners
      summary: 当前首页提示窗
      security:
        - AppBearer: []
      description: 只返回 start_at <= now < end_at，按 priority、id 降序。
      responses:
        "200":
          description: data 为提示窗数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Banner"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/tarotists:
    get:
      tags: [Readings]
      operationId: appListTarotists
      summary: 可用塔罗师
      security:
        - AppBearer: []
      description: 只返回启用中的 id、name、display_copy。不返回人设正文。
      responses:
        "200":
          description: data 为塔罗师数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TarotistPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/quota:
    get:
      tags: [Quota]
      operationId: appQuota
      summary: 当前额度
      security:
        - AppBearer: []
      description: |
        匿名用户仍返回结构，次数与钻石为 0，daily_free_used=false。
        diamond_cost 未配置时为 null，diamond_cost_configured=false。
      responses:
        "200":
          description: data 为 QuotaView。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/QuotaView"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings:
    get:
      tags: [Readings]
      operationId: appListReadings
      summary: 我的占卜列表
      security:
        - AppBearer: []
      description: 登录用户按 user_id，匿名按 anonymous_id。不含已删除。按 updated_at 降序，无分页参数。
      responses:
        "200":
          description: data 为 Reading 数组。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Readings]
      operationId: appCreateReading
      summary: 创建占卜
      security:
        - AppBearer: []
      description: |
        状态从 QUESTION_CREATED 开始。问题最长 200 个码点。
        登录用户的 normal / tarotist 在此按共享优先级扣 play；塔罗师首次可走 ai_trial。
        explore 不在此扣费（quota_outcome=deferred）。匿名不预扣（quota_outcome=anonymous）。
        额度不足时仍 code=0，记录保留，paywall 或 diamond_cost_unconfigured 在 data 里，不编造单价。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadingBody"
      responses:
        "200":
          description: code=0 时 data 为 ReadingCreated。幂等重放会原样返回首次包络。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingCreatedOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}:
    get:
      tags: [Readings]
      operationId: appGetReading
      summary: 占卜详情
      security:
        - AppBearer: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 不属于当前用户、已删除或不存在时为业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Readings]
      operationId: appDeleteReading
      summary: 删除占卜
      security:
        - AppBearer: []
      description: 软删除。匿名用户返回「登录后才能删除」。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/question:
    put:
      tags: [Readings]
      operationId: appEditQuestion
      summary: 修改问题
      security:
        - AppBearer: []
      description: |
        普通占卜只能在 QUESTION_CREATED 或 SPREAD_SELECTED，且没有跳过检测。
        explore 在 COMPLETED / INTERPRETING 之前可改。抽牌后不能改。最长 200 个码点。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBody"
      responses:
        "200":
          description: 成功 data 为更新后的 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/detect:
    post:
      tags: [Readings]
      operationId: appDetect
      summary: 问题检测
      security:
        - AppBearer: []
      description: |
        用绑定的 detect 任务跑模型。无请求体。
        成功后把 skip_detect 置为 false。suggestions 固定为 3。
        模型错误以业务错误返回 step.Error，不写解读正文。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: code=0 时 data 为检测文本。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/DetectResult"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/spread:
    post:
      tags: [Readings]
      operationId: appSelectSpread
      summary: 选择牌阵
      security:
        - AppBearer: []
      description: 仅 QUESTION_CREATED 可进入 SPREAD_SELECTED。牌阵必须启用。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadSelectBody"
      responses:
        "200":
          description: 成功 data 为 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/shuffle:
    post:
      tags: [Readings]
      operationId: appShuffle
      summary: 洗牌
      security:
        - AppBearer: []
      description: |
        登录用户先过 play 额度门槛，不够则返回 QuotaBlockEnvelope（code=1），状态不变。
        匿名不预扣。成功把 SPREAD_SELECTED 改为 SHUFFLING。无请求体。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功为 Reading；额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/cut:
    post:
      tags: [Readings]
      operationId: appCut
      summary: 切牌
      security:
        - AppBearer: []
      description: 仅 SHUFFLING 可进入 CUTTING。不再次扣费。无请求体。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data 为 Reading。状态不对时「请先洗牌」。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/draw:
    post:
      tags: [Readings]
      operationId: appDraw
      summary: 抽牌
      security:
        - AppBearer: []
      description: |
        登录用户先过 play 额度门槛。状态须为 SPREAD_SELECTED 或 CUTTING。
        SHUFFLING 会提示先切牌。mode 只接受 normal。牌面由服务端固定，客户端不能指定牌。
        成功后状态 CARDS_FIXED。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawBody"
      responses:
        "200":
          description: 成功为 Reading；额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/interpret:
    post:
      tags: [Readings]
      operationId: appInterpret
      summary: 生成解读
      security:
        - AppBearer: []
      description: |
        explore 且问题为空会拒绝。登录用户先过 play 门槛。
        生成前必须已登录、牌面已固定、额度已结算。未绑定供应商会把状态写成 FAILED_RETRYABLE。
        失败文案「解读失败，可重试，未重新扣费」。无请求体。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data 为完成后的 Reading。额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/confirm-quota:
    post:
      tags: [Quota]
      operationId: appConfirmQuota
      summary: 确认是否扣额度
      security:
        - AppBearer: []
      description: |
        匿名用户拒绝。已经扣过则 code=0，message「已经扣过，不再扣」，不再扣。
        consume 不为 true 时不扣，记录保留。
        consume=true 时按共享优先级扣 play；不够则 QuotaBlockEnvelope。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmQuotaBody"
      responses:
        "200":
          description: 确认结果或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/ConfirmQuotaData"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/use-reward:
    post:
      tags: [Quota]
      operationId: appUseReward
      summary: 按共享优先级扣一次
      security:
        - AppBearer: []
      description: |
        无请求体。名字是 use-reward，实现是 chargeOwned(play)，顺序仍是注册奖励、今日免费、人工补发、钻石。
        不保证扣到注册奖励。reward_consumed 仅在 entitlement=registration_reward 时为 true。
        钻石单价未配置或余额不足时返回 QuotaBlockEnvelope，不编造消耗数量。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 扣费结果或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/UseRewardData"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/paywall:
    post:
      tags: [Quota]
      operationId: appPaywall
      summary: 取消或继续付费等待
      security:
        - AppBearer: []
      description: |
        cancel：保留记录，不生成。没有 pending/unconfigured 行时「没有可取消的付费等待」。
        resume：对当前用户所有挂起的 paywall 再试一次扣费。单价未配置或钻石仍不足的任务被跳过，不会伪造支付成功。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaywallBody"
      responses:
        "200":
          description: code=0 时 data 为取消结果或 resumed_tasks。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/PaywallResult"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/followups:
    post:
      tags: [Readings]
      operationId: appFollowup
      summary: 追问
      security:
        - AppBearer: []
      description: |
        continuation 必填。false 时新建 normal 占卜。
        true 时记录类型须为 normal、explore、daily、tarotist，且解读已完成、牌面已固定。
        匿名用户在延续追问时被拒绝。登录后按 followup:{turn} 扣费，不够则 QuotaBlockEnvelope，并把追问文本记在 resume_payload。
        含「别这样说」或「不舒服」会关掉照野调侃。模型失败不重复扣费。气泡最多 4 条。
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowupBody"
      responses:
        "200":
          description: 延续追问、新建占卜，或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/FollowupOKData"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/messages:
    get:
      tags: [Readings]
      operationId: appMessages
      summary: 追问消息
      security:
        - AppBearer: []
      description: 按 turn_id、seq 升序。须拥有该占卜。
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: data 为消息数组。App 列表不含 reading_id。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/workflow:
    post:
      tags: [Readings]
      operationId: appWorkflow
      summary: 按步骤跑工作流
      security:
        - AppBearer: []
      description: |
        请求体可空。detect / rewrite / recommend 不落库。
        interpret / tarotist 在牌面已固定时调用 generate，会写解读并扣已有额度规则。
        未知步骤记在 step.error，不让整个请求失败。
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowBody"
      responses:
        "200":
          description: code=0 时 data 含 reading 与 steps。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppWorkflowResult"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/daily:
    post:
      tags: [Daily]
      operationId: appDaily
      summary: 今日或明日一牌
      security:
        - AppBearer: []
      description: |
        必须登录。同一用户、同一 business_date 已有牌面则 code=1，reused=true，charged=false，不重复扣费。
        否则按共享优先级扣 play（不允许塔罗师试用）。单价未配置或钻石不足为 QuotaBlockEnvelope。
        扣费成功后抽一张牌并生成解读。生成失败仍 code=0，返回已固定牌面、可能为 FAILED_RETRYABLE 的记录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyBody"
      responses:
        "200":
          description: 新结果、复用或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/DailyReuseEnvelope"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/calendar:
    get:
      tags: [Daily]
      operationId: appCalendar
      summary: 日历
      security:
        - AppBearer: []
      description: 必须登录。只含未删除且 business_date 非空的记录。month 按前缀匹配，例如 2026-10。
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "2026-10"
      responses:
        "200":
          description: data 为日历条目，含 progress 与 continue。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CalendarItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/iap/verify:
    post:
      tags: [IAP]
      operationId: appIAPVerify
      summary: 验单并入账钻石
      security:
        - AppBearer: []
      description: |
        必须登录，且账号未注销、未合并。
        不调用 App Store 或 Google Play。票据非空且商品映射到启用的 SKU 时 verify_status=verified。
        diamond_grant 为 null：credit_status=amount_unconfigured，不写钻石，不把 null 当成 0。
        订阅缺少 expires_at、商品未映射、商品未启用、交易号已被别人使用，都会失败。
        订阅钻石按周期刷新（替换该桶余额）；消耗型累加 pack。免费次数不会被这次入账改动。
        本次若真正入账（credited），会尝试继续该用户挂起的 paywall。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAPVerifyBody"
      responses:
        "200":
          description: code=0 时 data 为订单快照。业务拒绝仍是 code=1、data=null，例如「票据为空」「平台不正确」。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/IAPOrderSnapshot"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/iap/restore:
    post:
      tags: [IAP]
      operationId: appIAPRestore
      summary: 恢复购买
      security:
        - AppBearer: []
      description: |
        restore_hook_enabled=false 时直接「恢复购买钩子已关闭」，不写订单。verify 不受此开关影响。
        最多 20 笔。单笔失败记在 results 里，不让整批变成 code=1。
        验单规则与 /iap/verify 相同：不访问商店，价格与发放量未配置则不入账。
        restore_required_first_pack 只出现在响应里，不作为拦截条件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAPRestoreBody"
      responses:
        "200":
          description: code=0 时 data 含开关和 results。钩子关闭时为普通业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            allOf:
                              - $ref: "#/components/schemas/IAPConfig"
                              - type: object
                                properties:
                                  results:
                                    type: array
                                    items:
                                      $ref: "#/components/schemas/IAPOrderSnapshot"
                                  resumed_tasks:
                                    type: array
                                    items:
                                      $ref: "#/components/schemas/ResumedTask"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/iap/entitlements:
    get:
      tags: [IAP]
      operationId: appIAPEntitlements
      summary: 钻石余额
      security:
        - AppBearer: []
      description: 必须登录。没有余额行时两个桶为 0。不返回价格。
      responses:
        "200":
          description: data 为 DiamondView，不含 ledger。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/DiamondView"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/iap/skus:
    get:
      tags: [IAP]
      operationId: appIAPSKUs
      summary: 已启用的 SKU
      security:
        - AppBearer: []
      description: 只返回 enabled=true。种子商品的价格、货币、发放量和商店商品号为 null。
      responses:
        "200":
          description: data 为 IAPSKU 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/IAPSKU"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/iap/config:
    get:
      tags: [IAP]
      operationId: appIAPConfig
      summary: 恢复购买开关
      security:
        - AppBearer: []
      responses:
        "200":
          description: data 为 IAPConfig。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/IAPConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: 管理端登录
      description: |
        不使用 decode 的未知字段限制。用户名空或密码错误、账号停用，均为 HTTP 200、code=1、「用户名或密码错误」。
        本地种子：admin/admin123（admin）、readonly/readonly123（readonly）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 成功含 accessToken 与 refreshToken。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminLoginOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/admin/v1/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: adminLogout
      summary: 管理端登出
      description: 不要求 Bearer。body 可省略。提供 refreshToken 时吊销该行。响应恒为 data=true。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: data=true。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoolOK"
  /api/admin/v1/auth/refresh:
    post:
      tags: [Admin Auth]
      operationId: adminRefresh
      summary: 刷新管理端 access token
      description: |
        刷新令牌必须属于 admin、未吊销、未过期，且操作员未停用。
        无效时 HTTP 401、「刷新令牌无效」。停用为 HTTP 401、「账号已停用」。
        成功时 data 是 JWT 字符串，不是对象。不轮换 refresh token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: code=0，data 为 access JWT。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminRefreshOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 刷新令牌无效或账号已停用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
