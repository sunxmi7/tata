          type: boolean
          nullable: true
    IAPOrderSnapshot:
      type: object
      description: |
        本地验单结果。verify_status=verified 只表示商品映射通过，不是商店回执。
        credit_status=amount_unconfigured 表示 diamond_grant 未配置，credited_diamonds 为 null，余额不变。
        同一 platform+transaction_id 再次提交且已 verified 时 idempotent=true，不重复入账。
      properties:
        order_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        idempotent:
          type: boolean
        unit:
          type: string
          example: diamond
        sku_code:
          type: string
        sku_kind:
          type: string
        ledger_bucket:
          type: string
          description: subscription 或 consumable。订阅入账会把该桶余额替换为发放量；消耗型在原余额上累加。
        platform:
          type: string
        product_id:
          type: string
        store_transaction_id:
          type: string
        original_transaction_id:
          type: string
        verify_status:
          type: string
          enum: [pending, verified, failed]
        credit_status:
          type: string
          enum: [none, credited, amount_unconfigured, skipped_expired]
        credited_diamonds:
          type: integer
          nullable: true
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [verify, restore]
        verify_message:
          type: string
        subscription_diamonds:
          type: integer
        pack_diamonds:
          type: integer
        subscription:
          $ref: "#/components/schemas/IAPSubscription"
        resumed_tasks:
          type: array
          description: 仅当本次 credit_status=credited 且存在可继续的 paywall 时出现。
          items:
            $ref: "#/components/schemas/ResumedTask"
        transaction_id:
          type: string
          description: 单笔失败、尚未形成订单快照时，restore 结果里可能只有这个字段。
        message:
          type: string
    IAPSKU:
