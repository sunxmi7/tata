          $ref: "#/components/schemas/LegalDoc"
        privacy_policy:
          $ref: "#/components/schemas/LegalDoc"
    LegalDoc:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
          description: 未配置时为「待确认」。
        body_status:
          type: string
          enum: [pending, ready]
    CustomDeck:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 最多 20 个字，可重复。缺省「我的自定义牌组」。
        status:
          type: string
          enum: [draft, saved]
        face_source:
          type: string
          description: upload 或已启用官方 decks.code。空表示未设置。
        back_source:
          type: string
          description: upload 或已启用官方 decks.code。空表示未设置。
        back_url:
          type: string
          nullable: true
        uploaded_count:
          type: integer
          description: 已上传或已套用的牌面张数。官方牌面来源记 78。
        card_count:
          type: integer
          description: 恒为 78。
        in_use:
          type: boolean
        code:
          type: string
          description: custom:{id}。
        faces:
          type: array
          description: 仅详情返回。78 张牌位。
          items:
            type: object
    CustomDeckBody:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        status:
          type: string
          enum: [draft, saved]
        face_source:
          type: string
        back_source:
          type: string
        back_url:
          type: string
        faces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [card_id]
            properties:
              card_id:
                type: integer
                minimum: 0
                maximum: 77
              image_url:
                type: string
    CustomDeckList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomDeck"
        limit:
          type: integer
          description: 每用户上限，固定 10。
    CardCatalog:
      type: object
      description: 我的塔罗牌 / 自定义牌组用的 78 张目录。
      properties:
        deck:
          type: object
        groups:
          type: array
          description: 大阿尔卡纳 / 权杖 / 圣杯 / 宝剑 / 星币。
          items:
            type: object
        items:
          type: array
          description: 78 张平铺，顺序与 groups 一致。
          items:
            $ref: "#/components/schemas/Card"
    YearlyShare:
      type: object
      description: 年运分享报告构图数据。关键词/四季文案由客户端用 report 自行排版，服务端不编造结构化金句。
      properties:
        year:
          type: integer
        unlocked:
          type: boolean
        report_status:
          type: string
        report:
          nullable: true
        user_name:
          nullable: true
        brand:
          type: string
        slogan:
          type: string
        title:
          type: string
        subtitle:
          type: string
        generated_for:
          nullable: true
          description: 有昵称时为「为{name}生成」，否则 null。
        share_hint:
          type: string
        rhythm_cards:
          type: array
        domain_cards:
          type: array
    HelpCategoryList:
      type: object
      properties:
        categories:
          type: array
          description: 帮助分类。
          items:
            $ref: "#/components/schemas/HelpCategory"
    HelpCategory:
      type: object
      properties:
        id:
          type: string
          description: 分类 id。
        title:
          type: string
          description: 分类标题。
        articles_status:
          type: string
          enum: [ready, pending]
          description: 该分类是否已有条目。
        empty_note:
          type: string
          description: 分类下还没有条目、且 articles_status=pending 时展示这段说明。当前两类都是 ready，此项为空。
    HelpArticleList:
      type: object
      properties:
        items:
          type: array
          description: 文章摘要列表。无结果时为空数组。
          items:
            $ref: "#/components/schemas/HelpArticleSummary"
        query:
          type: string
          description: 本次搜索关键词。未搜索为空。
        empty_title:
          type: string
          description: 仅搜索无结果时为「暂时没有找到相关问题」，否则为空字符串。
        empty_hint:
          type: string
          description: 仅搜索无结果时为「换个关键词，或向我们反馈」。
        category_note:
          type: string
          description: 未搜索且该分类没有条目时，返回分类的 empty_note。
    HelpArticleSummary:
      type: object
      properties:
        id:
          type: string
          description: 文章 id。
        title:
          type: string
          description: 文章标题。
        category_id:
          type: string
          description: 所属分类 id。
        category_title:
          type: string
          description: 所属分类标题。
    HelpArticle:
      allOf:
        - $ref: "#/components/schemas/HelpArticleSummary"
        - type: object
          properties:
            body:
              type: string
              description: 问题正文。使用与占卜、账号与设置已写入正式问答。未定稿时为「待确认」。
            body_status:
              type: string
              enum: [pending, ready]
              description: pending 正文为「待确认」；ready 已有正式正文。
    HealthOK:
      allOf:
        - $ref: "#/components/schemas/SuccessMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  example: ok
paths:
  /health:
    get:
      tags: [系统]
      operationId: getHealth
      summary: 健康检查
      responses:
        "200":
          description: code=0，data.status=ok。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
  /demo/openai/v1/chat/completions:
    post:
      tags: [系统]
      operationId: demoOpenAI
      summary: 本地演示用的对话补全
      description: |
        不走 `{code,message,data}`。供供应商探测和单飞测试使用。
        若设置了进程内 DemoHold，会先等待再返回。回复前缀为「【演示解读】」。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      content:
                        type: string
      responses:
        "200":
          description: 类 OpenAI 的 choices 结构。
          content:
            application/json:
              schema:
                type: object
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              example: assistant
                            content:
                              type: string
  /admin:
    get:
      tags: [系统]
      operationId: getAdminPage
      summary: 管理端页面跳转
      description: "307 到 http://127.0.0.1:5666/（vben）。不是 JSON API。"
      responses:
        "307":
          description: Temporary Redirect。
          headers:
            Location:
              schema:
                type: string
                example: http://127.0.0.1:5666/
  /admin/:
    get:
      tags: [系统]
      operationId: getAdminPageSlash
      summary: 管理端页面跳转（带斜杠）
      description: 与 GET /admin 相同，跳到 vben。
      responses:
        "307":
          description: Temporary Redirect。
          headers:
            Location:
              schema:
                type: string
                example: http://127.0.0.1:5666/
  /demo:
    get:
      tags: [系统]
      operationId: getDemoPage
      summary: 演示 HTML
      responses:
        "200":
          description: text/html 演示页。
          content:
            text/html:
              schema:
                type: string
  /api/app/v1/auth/email/code:
    post:
      tags: [登录绑定]
      operationId: appSendEmailCode
      summary: 发送邮箱验证码
      description: |
        登录发码不用带 Header。scene=bind 时在 Headers 加 `Authorization: Bearer <accessToken>`。
        scene 为 login / bind。login 时无论邮箱是否已有账号都发码。bind 必须先登录，未登录为 HTTP 401。
        同一邮箱同一 scene 60 秒内只能发一次，同一邮箱每小时最多 10 次。验证码 6 位、5 分钟有效，校验成功后作废。
        邮件走 config.yaml 的 mail SMTP；未配置返回「邮件服务未配置」。不在响应里回验证码。
      parameters:
        - $ref: "#/components/parameters/AuthorizationOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeBody"
            examples:
              成功:
                summary: 登录发码
                value:
                  email: demo@tata.local
                  scene: login
              绑定发码:
                summary: 绑定发码
                value:
                  email: demo@tata.local
                  scene: bind
      responses:
        "200":
          description: code=0 时 data.expires_in 为秒；失败为 ErrorEnvelope。绑定未登录为 HTTP 401。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/EmailCodeResult"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                成功:
                  summary: 已发送
                  value:
                    code: 0
                    message: ""
                    data:
                      expires_in: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/login:
    post:
      tags: [登录绑定]
      operationId: appLogin
      summary: 邮箱验证码登录
      description: |
        邮箱和验证码必填。没有单独注册接口：未注册邮箱首次用验证码登录会创建账号；已有账号则登录。不再发放注册奖励。
        先调 POST /auth/email/code，scene=login。已注册邮箱也可以发码。验证码不对或过期返回「验证码不正确或已过期」。
        该邮箱曾注销过则「该邮箱已注销，不能重复注册」。账号已注销返回「账号已注销」。
        带 device_id 时，把该设备上尚未归属的占卜挂到此用户。若该用户已有未结算占卜，会按共享优先级立刻扣一次。
        已有账号成功时 needs_confirm 恒为 false。若未在登录时扣掉未结算占卜，且本周期已用过免费次数，quota_prompt 为「今日免费体验额度已用完，本次记录已保存到历史记录」。
        不签发 refresh。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
            examples:
              成功:
                summary: 邮箱验证码登录
                value:
                  email: demo@tata.local
                  code: "123456"
      responses:
        "200":
          description: code=0 时 data 含 accessToken、id、login=email。首次创建账号时还有 registration_reward_expires_at、reward_note；已有账号还有 needs_confirm、quota_prompt。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/wechat:
    post:
      tags: [登录绑定]
      operationId: appWechat
      summary: 微信身份登录
      description: |
        客户端把微信 SDK 的 code 交给服务端。iOS / Android 共用微信开放平台同一个移动应用。
        服务端用 config.yaml 的 wechat.appId/appSecret 向微信换 openid/unionid（优先存 unionid），再查找或创建用户。
        换票后请求 sns/userinfo 取昵称和 headimgurl。档案 name / avatar_url 为空时写入昵称，并把微信头像下载后经 Upload 落到本机或 OSS（不再把 qlogo 外链写进档案）。已有资料不覆盖。userinfo 失败不挡登录。
        客户端可顺带 nickname / avatar_url / headimgurl；仅在微信接口没返回时作为补全，头像仍只接受微信 CDN 并转存。App 授权 scope 须为 snsapi_userinfo。
        wechat.enabled=false 或凭证空时返回「微信登录未配置」。code 无效返回「微信授权码无效」。
        已注销身份不能再次注册。不再发放注册奖励。成功后会尝试结算未扣费的占卜。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatBody"
            examples:
              成功:
                summary: 微信登录
                value:
                  code: 081abcWeChatCode
      responses:
        "200":
          description: code=0 时 data 含 accessToken、id、reward_consumed、reward_note。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/apple:
    post:
      tags: [登录绑定]
      operationId: appApple
      summary: 苹果身份登录
      description: |
        仅 iOS。安卓没有苹果三方登录。客户端把 Sign in with Apple 的 identity_token 交给服务端。
        服务端用 Apple JWKS 验 RS256，iss 必须是 https://appleid.apple.com，aud 为 apple.clientId（iOS Bundle ID）。
        apple.enabled=false 或 clientId 空时返回「苹果登录未配置」。令牌无效返回「苹果身份令牌无效」。
        验过的 sub 用来查找或创建用户。已注销身份不能再次注册。不再发放注册奖励。
        与微信登录不同：成功响应不调用提问结算，data 只有 accessToken、id、login=apple。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleBody"
            examples:
              成功:
                summary: 苹果登录
                value:
                  identity_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.demo
      responses:
        "200":
          description: code=0 时 data.login 为 apple。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppAuthSession"
                  - $ref: "#/components/schemas/ErrorEnvelope"
  /api/app/v1/auth/bind-wechat:
    post:
      tags: [登录绑定]
      operationId: appBindWechat
      summary: 绑定微信
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        需要登录用户。身份空闲则直接绑定，data=true。
        绑定成功或重复绑定同一微信时，若档案 name / avatar_url 为空则写入微信昵称和转存后的头像。
        已被其他账号占用时不搬迁数据，返回「该身份已绑定其他账号」，不创建合并请求。
        换绑未开放。重复绑定同一个微信身份返回 true。请求体同微信登录，传 code 不是 openid。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatBody"
            examples:
              成功:
                summary: 绑定微信
                value:
                  code: 081abcWeChatCode
      responses:
        "200":
          description: 绑定成功 code=0 且 data 为 true。身份已被占用时 code=1，message 为「该身份已绑定其他账号」，data 为 null。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/bind-apple:
    post:
      tags: [登录绑定]
      operationId: appBindApple
      summary: 绑定苹果
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 规则同绑定微信，身份种类为 apple。请求体同苹果登录，传 identity_token 不是 sub。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleBody"
            examples:
              成功:
                summary: 绑定苹果
                value:
                  identity_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.demo
      responses:
        "200":
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/bind-email:
    post:
      tags: [登录绑定]
      operationId: appBindEmail
      summary: 绑定邮箱
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        邮箱按小写比较。邮箱和验证码必填，不设密码。先调 POST /auth/email/code，scene=bind。
        空闲则写入邮箱。
        冲突时返回「该身份已绑定其他账号」，不创建合并请求。已绑定过邮箱不能换绑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBindBody"
            examples:
              成功:
                summary: 绑定邮箱
                value:
                  email: demo@tata.local
                  code: "123456"
      responses:
        "200":
          description: 绑定成功、冲突或业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/merge-confirm:
    post:
      tags: [登录绑定]
      operationId: appMergeConfirm
      summary: 不提供账号合并
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        各账号独立，不再合并。调用一律返回「不提供账号合并」，不会搬动占卜、额度或身份。
        身份已被其他账号占用时，绑定接口直接返回「该身份已绑定其他账号」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeConfirmBody"
            examples:
              成功:
                summary: 确认合并
                value:
                  merge_request_id: 1
                  confirm: true
      responses:
        "200":
          description: code=0 时 data 为 MergeOutcome。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/MergeOutcome"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/auth/cancel:
    post:
      tags: [登录绑定]
      operationId: appCancel
      summary: 注销账号
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        软删除：设置 cancelled_at，不物理删除账号、占卜、日历或会员记录。把邮箱、微信、苹果、手机号和已记录的设备 ID 写入 identity_claims（小写），并清空这些登录身份与密码。当前 JWT 立刻失效，后续请求返回「账号已注销」。
        同一邮箱、微信、苹果、手机号不能重新注册。设备可以再注册新账号，但邮箱、微信、苹果、手机号、设备里只要有一个曾经注册过，就不发注册赠送，也不能领邀请奖励。会吊销 audience=app 的 refresh（当前 App 登录并不签发 refresh）。已注销再调用返回「账号已注销」。
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/profile:
    get:
      tags: [用户档案]
      operationId: appGetProfile
      summary: 读取档案
      parameters:
        - $ref: "#/components/parameters/Authorization"
      responses:
        "200":
          description: 必须登录。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/Profile"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [用户档案]
      operationId: appPutProfile
      summary: 更新档案
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        更新非空的 birth_date、gender、timezone、name、nickname、bio、avatar_url。
        个人档案屏还可传 explore_preferences（整表替换）。性别接受「女 / 男 / 其他」。
        账号中心头像走 POST /uploads（folder 缺省 misc）再 PUT avatar_url；昵称与姓名同一字段，PUT 可传 name 或 nickname。
        账号主展示见 GET 的 account_display（脱敏邮箱）与 public_id。无手机号。
      requestBody:
        required: true
        content:
          application/json:
            schema:
