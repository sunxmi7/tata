                        properties:
                          data:
                            type: object
                            properties:
                              id:
                                type: integer
                                format: int64
                              push_enabled:
                                type: boolean
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/banners/{id}:
    put:
      tags: [管理端内容]
      operationId: adminUpdateBanner
      summary: 更新提示窗
      description: 没有删除接口。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerBody"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/readings:
    get:
      tags: [管理端内容]
      operationId: adminListReadings
      summary: 占卜记录
      description: 含已删除。最多 100 条，按 updated_at 降序。无分页参数。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: user_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: created_at 下限，传给数据库比较。
          schema:
            type: string
        - name: to
          in: query
          description: created_at 上限。
          schema:
            type: string
      responses:
        "200":
          description: data 为 Reading 数组。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListOK"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/readings/{id}:
    get:
      tags: [管理端内容]
      operationId: adminGetReading
      summary: 占卜详情
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 不存在时「记录不存在」。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/readings/{id}/retry:
    post:
      tags: [管理端内容]
      operationId: adminRetryReading
      summary: 重试失败解读
      description: 需要 role=admin。只有 FAILED_RETRYABLE 能重试。不重新扣费。无请求体。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data 为 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/workflow/simulate:
    post:
      tags: [管理端内容]
      operationId: adminSimulateWorkflow
      summary: 模拟工作流
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        需要 role=admin。不写占卜记录，不扣费。
        step 为空时跑 detect、rewrite、recommend、interpret；有 tarotist_id 时再加 tarotist。
        step 为单步时只跑那一步。draw 只排牌面文字。未知步骤拒绝。
        问题省略时使用内置示例问题，不是价格或商品。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                spread_id:
                  type: integer
                  format: int64
                cards:
                  type: array
                  nullable: true
                  items:
                    $ref: "#/components/schemas/DrawnCard"
                tarotist_id:
                  type: integer
                  format: int64
                step:
                  type: string
                  enum: ["", detect, rewrite, recommend, draw, interpret, tarotist]
      responses:
        "200":
          description: 全流程为 SimulateFull；单步为 SimulateOne。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            oneOf:
                              - $ref: "#/components/schemas/SimulateFull"
                              - $ref: "#/components/schemas/SimulateOne"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/ledger:
    get:
      tags: [额度补发]
      operationId: adminListLedger
      summary: 次数流水
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        只读，最多 200 条，按 id 降序。
        draws 记录这笔扣次用到的批次、来源、到期时间和扣完后的剩余。一条扣次可以跨套餐赠送和补充包。
        reading_status 是关联解读的状态。
      responses:
        "200":
          description: data 为 LedgerRow 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LedgerRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [额度补发]
      operationId: adminPostLedger
      summary: 拒绝新增流水
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 需要 role=admin。请求体被忽略。恒为「流水不能新增或修改」。
      responses:
        "200":
          description: code=1。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                code: 1
                message: 流水不能新增或修改
                data: null
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/ledger/{id}:
    put:
      tags: [额度补发]
      operationId: adminPutLedger
      summary: 拒绝修改流水
      description: 需要 role=admin。路径 id 不参与校验，请求体被忽略。恒拒绝。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: code=1，「流水不能新增或修改」。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/grants:
    get:
      tags: [额度补发]
      operationId: adminListGrants
      summary: 人工补发记录
      description: |
        需要付费模块读权限。最多 200 条。
        带 user_id 时附带该用户的统一额度、邀请剩余。人工补发不再增加免费次数。
        can_write 表示当前账号是否有付费模块写权限。
        响应声明 writes_iap_orders=false、resumes_paywall=false。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: data 为 GrantMeta。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GrantMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [额度补发]
      operationId: adminCreateGrant
      summary: 人工补发会员额度
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        需要付费模块写权限。note 必填。reason 只能是 admin_grant。
        quota_bucket 只能是 subscription 或 pack。不接受免费次数。
        不改 iap_orders，不唤醒 paywall，resumed_tasks 恒为 []。
        不接受价格字段。注销或已合并账号拒绝；已合并请补发到主账号。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreate"
      responses:
        "200":
          description: code=0 时 data 含新建 grants 与补发后的余额。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/GrantMeta"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/redeem-codes:
    get:
      tags: [额度补发]
      operationId: adminListRedeemCodes
      summary: 兑换码列表
      description: |
        需要付费模块读权限。最多 200 条，按 id 降序。
        含 redeemed_count。can_write 表示当前账号是否有付费模块写权限。
      parameters:
        - $ref: "#/components/parameters/Authorization"
      responses:
        "200":
          description: data 为 RedeemCodeList。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RedeemCodeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [额度补发]
      operationId: adminCreateRedeemCodes
      summary: 生成兑换码
      description: |
        需要付费模块写权限。code 为空则自动生成 XXXX-XXXX（不含 0/O/1/I）。
        count 默认 1、上限 100。自定义码不能批量。
        生成后用户用 POST /api/app/v1/redeem 核销。
      parameters:
        - $ref: "#/components/parameters/Authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCodeCreate"
            examples:
              auto:
                summary: 自动生成 10 个额度码
                value:
                  kind: quota
                  amount: 60
                  benefit_name: 新春礼
                  count: 10
                  max_redemptions: 1
              custom:
                summary: 指定一条共用码
                value:
                  kind: free_count
                  amount: 1
                  benefit_name: 内测次数
                  code: TATA-BETA
                  max_redemptions: 100
      responses:
        "200":
          description: code=0 时 data.items 为新建的码。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/RedeemCodeList"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/redeem-codes/{id}:
    put:
      tags: [额度补发]
      operationId: adminUpdateRedeemCode
      summary: 更新兑换码
      description: |
        需要付费模块写权限。不能改 code、kind、amount。
        可改启用、权益名、核销上限、过期时间。停用后 App 核销返回「兑换码无效」。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCodeUpdate"
      responses:
        "200":
          description: code=0 时 data.items 含更新后的这一条。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/RedeemCodeList"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/operators:
    get:
      tags: [审计账号]
      operationId: adminListOperators
      summary: 操作员列表
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 不返回密码哈希。每条含 modules。需要账号模块读权限。
      responses:
        "200":
          description: data 为 Operator 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [审计账号]
      operationId: adminCreateOperator
      summary: 新建操作员
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        只有 role=admin 能调用。role 只允许 admin 或 readonly。
        readonly 的 modules 为按模块授权，省略则无模块。admin 忽略 modules。
        用户名冲突为「用户名已存在」。非管理员为「只有管理员能管理操作员」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorCreate"
      responses:
        "200":
          description: 成功返回 id。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IdOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/operators/{id}:
    put:
      tags: [审计账号]
      operationId: adminUpdateOperator
      summary: 停用、启用或改模块权限
      description: |
        只有 role=admin 能调用。可改 disabled 与 modules。停用时吊销该操作员的 admin refresh。不能停用自己。
        省略 disabled 会启用账号。省略 modules 不改权限；传空数组清空。目标若是 admin 角色则忽略 modules。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorPatch"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/users:
    get:
      tags: [审计账号]
      operationId: adminListUsers
      summary: App 用户
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 最多 200 条，按 id 降序。不含密码。含昵称、头像、性别、生日、探索偏好。已注销用户仍出现，cancelled_at 非空。
      responses:
        "200":
          description: data 为用户数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AppUserAdmin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/users/stats:
    get:
      tags: [审计账号]
      operationId: adminUserStats
      summary: 用户画像占比
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        统计未注销的 App 用户，历史上已合并的账号也计入。三张圆形图用同一批人。
        性别与年龄按人数互斥分桶，未填为「未填写」。年龄按生日相对 Asia/Shanghai 当天计算。
        探索偏好为多选：每选一项计 1，未选任何项计「未选择」1。
        年龄区间：15以下、15-18、19-22、23-24、25-30、31-35、36-40、41-50、51以上。
      responses:
        "200":
          description: data 含 total_users 与 gender/age/explore（各有 total 与 items[{label,count,percent}]）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/audit:
    get:
      tags: [审计账号]
      operationId: adminListAudit
      summary: 审计日志
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 最多 200 条，按 id 降序。detail 是文本，可能是 JSON 字符串。
      responses:
        "200":
          description: data 为审计数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/account-merges:
    get:
      tags: [审计账号]
      operationId: adminListAccountMerges
      summary: 不提供账号合并
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: 已下线。调用返回「不提供账号合并」，不再列出合并请求。
      responses:
        "200":
          description: data 为合并请求数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccountMergeRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/orders:
    get:
      tags: [管理端内购]
      operationId: adminListIAPOrders
      summary: IAP 订单
      description: |
        只读，最多 200 条。verify_status 只允许空、pending、verified、failed。
        credited_quota 在发放量未配置时为 null。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: user_id
          in: query
          schema:
            type: integer
            format: int64
        - name: verify_status
          in: query
          schema:
            type: string
            enum: ["", pending, verified, failed]
      responses:
        "200":
          description: data 为订单数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminIAPOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/skus:
    get:
      tags: [管理端内购]
      operationId: adminListIAPSKUs
      summary: 全部 SKU
      description: |
        含未启用。kind 可过滤。价格由本接口 POST/PUT 配置，种子默认仍为 null。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [month_subscription, year_subscription, quota_pack, yearly_unlock, deck_year, deck_bundle, deck_single, deck_addon]
      responses:
        "200":
          description: data 为 IAPSKU 数组。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/IAPSKU"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [管理端内购]
      operationId: adminCreateIAPSKU
      summary: 新增价位
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        需要 role=admin。四种付款：会员（月卡 / 年卡）、额度补充包、年运单买、牌组。period_unit 由类型推导。
        价格单位为分；不填则为 null。会员和补充包的额度都写 quota_grant；年运和牌组不能填。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAPSKUBody"
      responses:
        "200":
          description: data 为新建的 IAPSKU。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/IAPSKU"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/skus/{id}:
    put:
      tags: [管理端内购]
      operationId: adminUpdateIAPSKU
      summary: 更新价位
      description: 需要 role=admin。不能改 kind 与 code。空价格字段会把价格清成 null。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAPSKUBody"
      responses:
        "200":
          description: data 为更新后的 IAPSKU。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/IAPSKU"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/iap/quota:
    get:
      tags: [管理端内购]
      operationId: adminIAPQuota
