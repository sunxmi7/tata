        saved:
          type: boolean
          description: 用户是否已保存该月报。
        saved_at:
          type: string
          format: date-time
          nullable: true
          description: 保存时间。未保存为 null。
        months:
          type: array
          description: 可切换的月份列表。
          items:
            type: object
            properties:
              month:
                type: string
                description: YYYY-MM。
              exploration_count:
                type: integer
                description: 该月探索次数。
              saved:
                type: boolean
                description: 该月是否已保存。
        fields_confirmed:
          type: boolean
          description: 月报字段是否已由产品定稿。当前实现为 true。
        content_invented:
          type: boolean
          description: 是否编造了正文。恒为 false。
    MonthlySaveBody:
      type: object
      additionalProperties: false
      properties:
        month:
          type: string
          description: YYYY-MM。空则当前月。
    YearlyReport:
      type: object
      properties:
        year:
          type: integer
          description: 年份，例如 2026。
        unlocked:
          type: boolean
          description: 是否已解锁年运。年卡用户为 true。
        unlock_source:
          type: string
          description: 解锁来源，例如 year_membership 或 yearly_unlock 购买。未解锁为空。
        year_member_unlocks:
          type: boolean
          description: 年卡是否自动解锁年运。
        unlock_price_minor:
          type: integer
          format: int64
          nullable: true
          description: 单独购买年运的价格，单位分。未配置为 null。
        unlock_price_currency:
          type: string
          nullable: true
          description: 单独购买年运的币种。未配置为 null。
        content_status:
          type: string
          enum: [pending, ready]
          description: 卖点四段是否已有运营文案。空则 pending。
        theme:
          type: string
          description: 解锁页卖点「主题」文案。未配置为空。
        domain:
          type: string
          description: 解锁页卖点「领域」文案。
        rhythm:
          type: string
          description: 解锁页卖点「节奏」文案。
        action:
          type: string
          description: 解锁页卖点「行动」文案。
        sections:
          type: array
          description: 卖点段落列表。
          items:
            type: object
            properties:
              key:
                type: string
                description: 段落键，如 theme/domain/rhythm/action。
              title:
                type: string
                description: 段落标题。
              body:
                type: string
                description: 段落正文。未填为空。
              content_status:
                type: string
                description: pending 或 ready。
        fields_confirmed:
          type: boolean
          description: 年运字段是否定稿。
        content_invented:
          type: boolean
          description: 是否编造正文。恒为 false。生成走模型。
        step:
          type: string
          description: locked / profile / rhythm / domains / generate / generating / ready
        profile:
          type: object
          description: 年运基本信息。
          properties:
            birth_date:
              type: string
              nullable: true
              description: 生日 YYYY-MM-DD。未填为 null。
            birth_time:
              type: string
              nullable: true
              description: 出生时间 HH:MM。未填为 null。
            birth_place:
              type: string
              nullable: true
              description: 出生地点。未填为 null。
            gender:
              type: string
              nullable: true
              description: 女性 / 男性 / 其他 / 不愿透露。未填为 null。
            completed:
              type: boolean
              description: 基本信息是否已填完。
        rhythm_cards:
          type: array
          description: 十二宫 12 张（自我到潜意识）。未抽为空数组。与 house_cards 同内容。
          items:
            $ref: "#/components/schemas/YearlyCard"
        house_cards:
          type: array
          description: rhythm_cards 的别名。
          items:
            $ref: "#/components/schemas/YearlyCard"
        domain_cards:
          type: array
          description: 四季 4 张（春夏秋冬）。未抽为空数组。与 season_cards 同内容。
          items:
            $ref: "#/components/schemas/YearlyCard"
        season_cards:
          type: array
          description: domain_cards 的别名。
          items:
            $ref: "#/components/schemas/YearlyCard"
        report:
          type: string
          nullable: true
          description: 生成后的年运报告正文。未生成为 null。
        report_status:
          type: string
          enum: [pending, generating, ready, failed]
          description: 报告生成状态。
        fail_reason:
          type: string
          nullable: true
          description: 生成失败原因。成功为 null。
        generated_at:
          type: string
          format: date-time
          nullable: true
          description: 报告生成时间。未生成为 null。
        steps:
          type: array
          description: 四步进度。
          items:
            type: object
            properties:
              key:
                type: string
                description: profile / rhythm / domains / generate。
              title:
                type: string
                description: 步骤标题。
              done:
                type: boolean
                description: 该步是否完成。
              required:
                type: integer
                description: 该步需要抽取的牌数。profile/generate 为 0。
              drawn:
                type: integer
                description: 该步已抽牌数。
    YearlyCard:
      type: object
      properties:
        position:
          type: integer
          description: 位置序号。十二宫 1–12，四季 1–4。
        position_name:
          type: string
          description: 位置名，十二宫为自我到潜意识，四季为春夏秋冬。
        card_id:
          type: integer
          description: 韦特牌序。
        name:
          type: string
          description: 牌名。
        orientation:
          type: string
          description: upright 或 reversed。
        card_thumbnail:
          type: string
          description: 牌面缩略图 URL。未配置时为内置默认牌背。
    YearlyProfileBody:
      type: object
      additionalProperties: false
      required: [birth_date, birth_time, birth_place]
      properties:
        birth_date:
          type: string
          description: YYYY-MM-DD
        birth_time:
          type: string
          description: HH:MM，如 08:30。也接受 HH:MM:SS，服务端存 HH:MM。
        birth_place:
          type: string
          description: 出生地点，最多 80 字。
        gender:
          type: string
          enum: ['', 女性, 男性, 其他, 不愿透露, 女, 男]
    YearlyDrawBody:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: ['', normal, pick]
        numbers:
          type: array
          items:
            type: integer
    DeckPreference:
      type: object
      properties:
        code:
          type: string
          description: 当前选用的牌面风格 code，种子为 rider-waite。
        available:
          type: array
          description: 可切换的牌组列表。
          items:
            type: object
            properties:
              code:
                type: string
                description: 牌组 code。PUT 时只能用已上架的。
              name:
                type: string
                description: 牌组显示名，例如「莱德韦特」。
              thumbnail:
                type: string
                description: 套装封面完整 URL（与 cover_url 同值）。未配置时为当前服务地址下的内置默认牌背。
              cover_url:
                type: string
                description: 套装封面完整 URL。与 thumbnail 同值。
              back_url:
                type: string
                nullable: true
                description: 该套卡背图。未配置为 null。
              available:
                type: boolean
                description: 是否已上架可选。false 的不能 PUT。
              description:
                type: string
                description: 套装一句介绍。未填为空字符串，不编造。
              tags:
                type: array
                items:
                  type: string
                description: 套装标签。未填为空数组，不编造。
        custom_deck:
          type: object
          nullable: true
          description: 当前正在使用的自定义牌组。未使用为 null。
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            code:
              type: string
              description: custom:{id}，可交给 PUT /deck-preference。
            status:
              type: string
    DeckPreferenceBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: 已启用官方牌组 code，或 custom:{id}（须已保存且属于当前用户）。
    SKUBenefit:
      type: object
      properties:
        key:
          type: string
          description: 权益键，例如 followup、campaign_perk。
        title:
          type: string
          description: 权益标题。
        count:
          type: integer
          nullable: true
          description: 次数类权益的数量。followup 取追问上限。非次数为 null。
        included:
          type: boolean
          description: 该档是否包含此项权益。
        copy_status:
          type: string
          description: pending 文案未定稿；ready 已有 copy。
        body:
          type: string
          nullable: true
          description: 年卡专属活动权益取 iap_skus.copy。未填为 null，copy_status=pending。
    FlowStep:
      type: object
      properties:
        task:
          type: string
          description: 步骤名：detect、rewrite、recommend、interpret、tarotist。
        vendor:
          type: string
          description: 该步使用的供应商。未调用为空。
        model:
          type: string
          description: 该步使用的模型。未调用为空。
        input:
          type: string
          description: 送入模型的输入摘要。
        output:
          type: string
          description: 模型输出。失败或未跑为空。
        error:
          type: string
          description: 该步错误。未知步骤为「未知步骤」。成功为空。
        persisted:
          type: boolean
          description: interpret/tarotist 成功写库时为 true。
    PresetQuestions:
      type: object
      properties:
        featured:
          type: array
          description: |
            首屏默认 15 条，与 backup 分开返回。混合排列。每条带 scene/category；首屏 UI 可不展示分类标签。
            传 ?scene= 时只留下该场景的首屏题（条数会少于 15）。
          items:
            $ref: "#/components/schemas/PresetQuestion"
        backup:
          type: array
          description: 备用题库。点击「更多问题」每次取 more_per_page 条。
          items:
            $ref: "#/components/schemas/PresetQuestion"
        scenes:
          type: array
          description: 文档六类场景，供按场景筛选。title 随语言头翻译。
          items:
            $ref: "#/components/schemas/PresetScene"
        more_per_page:
          type: integer
          description: 「更多问题」每次加载条数，V1 为 5。
          example: 5
    PresetScene:
      type: object
      properties:
        scene:
          type: string
          description: relationship / career / study / growth / social / life。
        title:
          type: string
          description: 场景展示名，如「感情关系」。
    PresetQuestion:
      type: object
      properties:
        question_id:
          type: string
        body:
          type: string
          description: 问题正文。点击后填入输入框，不直接提交。
        scene:
          type: string
          description: 场景类型。relationship=感情关系，career=事业与工作，study=学业与考试，growth=自我成长，social=人际关系，life=生活与选择。
        category:
          type: string
          description: 场景中文名（随语言头翻译）。首屏与备用题都返回。
        sort_order:
          type: integer
    DetectResult:
      type: object
      properties:
        text:
          type: string
          description: 问题检测/改写后的文本。
        vendor:
          type: string
          description: 检测所用供应商。
        model:
          type: string
          description: 检测所用模型。
        suggestions:
          type: integer
          description: 当前实现固定为 3，不是从模型输出解析的条数。
          example: 3
    CreateReadingBody:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          description: 最长 200 个码点。超长文案为「问题超过 200 个码点，正式计数口径尚未确认」。
        type:
          type: string
          description: 省略或空字符串时为 normal。只允许 normal、tarotist、explore。
          enum: ['', normal, tarotist, explore]
        source:
          type: string
          description: |
            explore：把 normal/explore 记为 explore，并跳过检测。
            preset：跳过检测。
            其他字符串没有额外效果。
        theme_key:
          type: string
          description: |
            仅 explore 可传。写入 readings.theme_key，用于历史区分「此刻抉择」与「主题占卜」。
            yes_or_no / either_or → conversation_type=moment（此刻抉择）；其余已知主题 → theme（主题占卜）。
            创建时可空，选阵后若为空则从 spreads.theme_key 回填。非法键返回「探索主题不存在」；非 explore 传了返回「主题键不正确」。
          enum: ['', yes_or_no, either_or, relationship, communication, career, study, interpersonal, shopping, outfit, wellbeing, inner]
        skip_detect:
          type: boolean
        tarotist_id:
          type: integer
          format: int64
          nullable: true
          description: type=tarotist 时必填，且塔罗师必须启用。
    QuestionBody:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
    SpreadSelectBody:
      type: object
      additionalProperties: false
      required: [spread_id]
      properties:
        spread_id:
          type: integer
          format: int64
    DrawBody:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          description: normal 随机抽牌；numerology 按 numbers 映射牌面。
          enum: [normal, numerology]
        numbers:
          type: array
          items:
            type: integer
          description: mode=numerology 时必填。1–78 的整数、同一轮不重复。个数必须等于当前牌阵张数。数字对应这一问已保存的映射，不是固定牌序。
    ConfirmQuotaBody:
      type: object
      additionalProperties: false
      properties:
        consume:
          type: boolean
          description: 省略、非法 JSON 或 false：不扣额度，记录保留。true：按共享优先级扣一次 play。
    PaywallBody:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [cancel, resume]
          description: |
            cancel：把 pending / unconfigured 的 paywall 标为 cancelled，不生成。
            resume：再次尝试扣费并继续当时挂起的动作（洗牌、抽牌、解读、今日一牌、追问）。余额或单价仍不足时该任务不会出现在结果里。
    FollowupBody:
      type: object
      additionalProperties: false
      required: [text, continuation]
      properties:
        text:
          type: string
        continuation:
          type: boolean
          description: |
            false：另开一条 normal 占卜，本接口不扣费（charged_here=false），新记录自己的创建逻辑会扣。
            true：必须已经完成解读且牌面已固定，登录后按共享优先级扣 followup:{turn}。
    WorkflowBody:
      type: object
      description: 正文可省略。解析失败时按「有没有牌面」选择默认步骤。未知字段不会被拒绝。
      properties:
        steps:
          type: array
          items:
            type: string
          description: |
            已知步骤为 detect、rewrite、recommend、interpret、tarotist。
            空数组时：还没有牌面则 detect、rewrite、recommend；已有牌面则 interpret。
            interpret / tarotist 会调用 generate 并写库。其余已知步骤不落库。
            未知字符串不会让整个请求失败，对应 step.error 为「未知步骤」。
    DailyBody:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: 省略或 today 为今日一牌；tomorrow 为明日运势。其他值拒绝。
          enum: ['', today, tomorrow]
        cards:
          type: array
          description: |
            可选。App 本地抽好的牌面；传了就按这张牌生成解读，不再服务端重抽。
            今日/明日只收 1 张。每项至少 name、orientation（upright|reversed）；position_name 可省略。
            不传或空数组时由服务端抽一张。
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, orientation]
            properties:
              position:
                type: integer
              position_name:
                type: string
              card_id:
                type: integer
              name:
                type: string
              orientation:
                type: string
                enum: [upright, reversed]
    EmailCodeBody:
      type: object
      additionalProperties: false
      required: [email, scene]
      properties:
        email:
          type: string
          description: 必填。收验证码的邮箱。服务端转小写后比较；含空格或格式不对返回「邮箱不正确」。
        scene:
          type: string
          description: |
            必填。发码场景：
            login 邮箱验证码登录（未注册邮箱首次登录即创建账号），已有账号也可以发码；
            bind 绑定邮箱，必须先登录，未登录为 HTTP 401。
            同一邮箱同一 scene 60 秒内只能发一次，每小时最多 10 次。
          enum: [login, bind]
      example:
        email: demo@tata.local
        scene: login
    EmailCodeResult:
      type: object
      properties:
        expires_in:
          type: integer
          description: 验证码有效秒数，固定 300。响应里不回验证码，验证码只在邮件正文。
    LoginBody:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          description: 必填。登录邮箱，按小写比较。未注册时用验证码登录会创建账号。
        code:
          type: string
          description: 必填。邮箱验证码，6 位数字，5 分钟有效。先调 POST /auth/email/code 且 scene=login。不对或过期返回「验证码不正确或已过期」。
        invite_code:
          type: string
          description: 选填。邀请人 6 位 public_id。校验失败不挡登录；成功则给邀请人 +3 次并写入奖励记录。同一账号只能绑定一次。
    WechatBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: 必填。微信开放平台移动应用 SDK 返回的临时授权码。iOS / Android 共用同一套 appId。服务端拿它向微信换 openid 或 unionid，客户端不要传 openid。
        invite_code:
          type: string
          description: 选填。邀请人 6 位 public_id。校验失败不挡登录。
        nickname:
          type: string
          description: 选填。微信接口没返回昵称时写入档案。已有 name 不覆盖。
        avatar_url:
          type: string
          description: 选填。微信头像 URL。服务端下载后转存，不直接保存外链。仅允许 qlogo.cn / qpic.cn。
        headimgurl:
          type: string
          description: 选填。与 avatar_url 相同，兼容微信字段名。avatar_url 优先。
    AppleBody:
      type: object
      additionalProperties: false
      required: [identity_token]
      properties:
        identity_token:
          type: string
          description: 必填。仅 iOS。Sign in with Apple 返回的 identity_token（JWT）。服务端用 Apple JWKS 校验后取 sub，客户端不要传 sub。安卓没有苹果登录。
        invite_code:
          type: string
          description: 选填。邀请人 6 位 public_id。校验失败不挡登录。
    EmailBindBody:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          description: 必填。要绑定的邮箱，按小写比较。已绑过邮箱不能换绑。
        code:
          type: string
          description: 必填。邮箱验证码。先调 POST /auth/email/code 且 scene=bind。不对或过期返回「验证码不正确或已过期」。
    MergeConfirmBody:
      type: object
      additionalProperties: false
      required: [merge_request_id, confirm]
      properties:
        merge_request_id:
          type: integer
          format: int64
        confirm:
          type: boolean
          description: false 时直接拒绝，不合并。
    BindConflict:
      type: object
      properties:
        bound:
          type: boolean
          example: false
          description: 当前请求是否已绑定成功。冲突时为 false。
        conflict:
          type: boolean
          example: true
          description: 该身份已被其他未注销账号占用。
        merged:
          type: boolean
          example: false
          description: 是否已经合并。冲突响应里为 false。
        confirm_required:
          type: boolean
          example: true
          description: 历史字段。绑定接口已不再返回本对象。
        merge_request_id:
          type: integer
          format: int64
          description: 历史字段。绑定接口已不再创建合并请求。
        primary_user_id:
          type: integer
          format: int64
          description: 当前登录用户，合并后的主账号。
        secondary_user_id:
          type: integer
          format: int64
          description: 占用该身份的另一个账号。
        identity_kind:
          type: string
          enum: [wechat, apple, email]
          description: 发生冲突的身份种类。
    BindConflictEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [1]
          description: 绑定冲突固定为 1。
        message:
          type: string
          example: 身份已被其他账号占用，需要确认后才会合并
          description: 冲突说明。
        data:
          $ref: "#/components/schemas/BindConflict"
          description: 冲突详情，含 merge_request_id。
    MergeParties:
      type: object
      properties:
        primary_user_id:
          type: integer
          format: int64
          description: 主账号 id。
        secondary_user_id:
          type: integer
          format: int64
          description: 被合并的次账号 id。
        surviving_user_id:
          type: integer
          format: int64
          description: 仅 after 中出现，等于主账号。
    MergeOutcome:
      type: object
      description: |
        只在 confirm=true 且合并成功（或已经合并、重放保存结果）时作为 data。
        钻石余额会在库内加总到主账号并迁移 quota_ledger，但本对象不返回钻石数量。iap_orders 不改写。
        次账号的 App refresh（若有）会被吊销，之后次账号 access 也会因 merged_into 失效。
      properties:
        merged:
          type: boolean
          description: 是否已合并。成功或重放为 true。
        before:
          $ref: "#/components/schemas/MergeParties"
          description: 合并前双方 id。
        after:
          $ref: "#/components/schemas/MergeParties"
          description: 合并后双方 id，surviving 等于主账号。
        confirm_at:
          type: string
          format: date-time
          description: 确认合并的时间。
        reward_before_primary:
          type: integer
          description: 合并前主账号注册奖励剩余。
        reward_before_secondary:
          type: integer
          description: 合并前次账号注册奖励剩余。
        reward_remaining:
          type: integer
          description: 合并后主账号注册奖励剩余（两者相加）。
        daily_free_remaining:
          type: integer
          description: 合并后今日免费次数剩余。
        daily_used_flags:
          type: integer
          description: 合并后今日已用标记。
        daily_slot_remaining:
          type: integer
          description: 合并后今日免费槽剩余。
        daily_slot_used:
          type: integer
          description: 合并后今日免费槽已用。
        readings_moved:
          type: integer
          format: int64
          description: 从次账号迁到主账号的占卜条数。
        messages_kept:
          type: integer
          format: int64
          description: 保留的对话消息条数。
        subscription_resolution:
          type: string
          enum: [none, selected, prompt_required]
          description: none 双方无订阅；selected 已选定一方；prompt_required 需要用户选。
        subscription_prompt_required:
          type: boolean
          description: 两边都有订阅、需要客户端提示选择时为 true。
        subscription_winner_id:
          type: integer
          format: int64
          description: 保留订阅的用户 id。无需选择时为胜出方。
        identity_prompt_required:
          type: boolean
          description: 两边同一槽都有身份、需要客户端提示时为 true。
        retained_identities:
          type: array
          items:
            type: string
          description: 主账号该槽已占用时留下的身份，形如 wechat:openid。
    AccountMergeRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
        primary_user_id:
          type: integer
          format: int64
        secondary_user_id:
          type: integer
          format: int64
        identity_kind:
          type: string
        status:
          type: string
          description: pending_confirm 或 merged。
        subscription_resolution:
          type: string
        confirm_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: string
          description: 合并成功后保存的 MergeOutcome JSON 文本；未合并时为空字符串。
        created_at:
          type: string
          format: date-time
    IAPVerifyBody:
      type: object
      additionalProperties: false
      required: [platform, product_id, transaction_id, receipt]
      properties:
        platform:
          type: string
          enum: [app_store, play]
        product_id:
          type: string
          description: 必须能映射到 iap_skus 的商店商品号。种子 SKU 的商品号为 null，直接验单会得到「商品未映射」。
        transaction_id:
          type: string
          maxLength: 128
        original_transaction_id:
          type: string
          description: 可省略，省略时等于 transaction_id。
        receipt:
          type: string
          maxLength: 8192
          description: 非空即可进入本地映射。服务端不向商店验票，只存 SHA-256。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅桶必填，RFC3339。消耗型可省略。
        purchased_at:
          type: string
          format: date-time
          nullable: true
    IAPRestoreBody:
      type: object
      additionalProperties: false
      required: [purchases]
      properties:
        platform:
          type: string
          enum: [app_store, play]
          description: 单笔 purchase 未写 platform 时继承这里。
        purchases:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/IAPVerifyBody"
    IAPSubscription:
      type: object
      nullable: true
      properties:
        status:
          type: string
          description: 订阅状态，例如 active。无订阅时整个对象为 null。
        sku_kind:
          type: string
          nullable: true
          description: 当前订阅 SKU 种类，如 year_subscription。
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 订阅到期时间。
        auto_renew:
          type: boolean
          nullable: true
          description: 是否自动续订。本地验单时可能为 null。
    IAPOrderSnapshot:
      type: object
      description: |
        本地验单结果。verify_status=verified 只表示商品映射通过，不是商店回执。
        credit_status=amount_unconfigured 表示发放额度未配置，对应 credited_quota 为 null，余额不变。
        consumable_pack 验单失败「塔塔币已下线」。quota_pack 非会员失败「仅会员可购买额度补充包」。
        同一 platform+transaction_id 再次提交且已 verified 时 idempotent=true，不重复入账。
      properties:
        order_id:
          type: integer
          format: int64
          description: 本地订单 id。尚未落单的失败项可能没有。
        user_id:
          type: integer
          format: int64
          description: 入账用户 id。
        idempotent:
          type: boolean
          description: 同一 platform+transaction_id 已 verified 时为 true，不重复入账。
        unit:
          type: string
          example: quota
          description: 账本单位，额度为 quota。
        sku_code:
          type: string
          description: 映射到的 iap_skus.code。
        sku_kind:
          type: string
          description: SKU 种类，见 IAPSKU.kind。
        platform:
          type: string
          description: app_store 或 play。
        product_id:
          type: string
          description: 商店商品号，按此映射 SKU。
        store_transaction_id:
          type: string
          description: 商店交易号。
        original_transaction_id:
          type: string
          description: 原始交易号。订阅续期时用来找同一订阅。
        verify_status:
          type: string
          enum: [pending, verified, failed]
          description: verified 只表示商品映射通过，不是商店回执。
        credit_status:
          type: string
          enum: [none, credited, amount_unconfigured, skipped_expired, deferred]
          description: credited 已入账；amount_unconfigured 发放量未配置；skipped_expired 订阅已过期未入账；deferred 当前周期未结束，下一期额度尚未入账。
        credited_quota:
          type: integer
          nullable: true
          description: 会员或补充包本次入账额度。年运、牌组、未配置为 null。
        period_start:
          type: string
          format: date-time
          nullable: true
          description: 订阅周期开始。消耗型为 null。
        period_end:
          type: string
          format: date-time
          nullable: true
          description: 订阅周期结束。消耗型为 null。
        source:
          type: string
          enum: [verify, restore]
          description: 来自验单还是恢复购买。
        verify_message:
          type: string
          description: 验单说明或失败原因。成功可为空。
        quota_remaining:
          type: integer
          description: 入账后统一额度。
        subscription:
          $ref: "#/components/schemas/IAPSubscription"
          description: 当前订阅摘要。无订阅为 null。
        resumed_tasks:
          type: array
          description: 仅当本次 credit_status=credited 且存在可继续的 paywall 时出现。
          items:
            $ref: "#/components/schemas/ResumedTask"
        transaction_id:
          type: string
          description: 单笔失败、尚未形成订单快照时，restore 结果里可能只有这个字段。
        message:
          type: string
          description: 单笔失败时的原因。成功快照一般不出现。
    IAPSKU:
      type: object
      description: |
        价位：会员月/年卡、额度补充包（仅会员目录可见）、年运解锁。consumable_pack（塔塔币）已下线，App 目录不返回。
        种子已填设计价（分）和 App Store 占位商品号；管理员改过的值保留。
        kind：month_subscription、year_subscription、quota_pack（额度补充包）、consumable_pack（已停用）、yearly_unlock。
      properties:
        id:
          type: integer
          format: int64
          description: SKU id。
        code:
          type: string
          description: 内部编码，例如 sub_month、pack_quota_20。
        kind:
          type: string
          enum: [month_subscription, year_subscription, quota_pack, yearly_unlock, deck_year, deck_bundle, deck_single, deck_addon]
          description: 价位种类。会员月/年卡、额度补充包、年运单买、牌组。
        display_name:
          type: string
          description: 客户端展示名。
        app_store_product_id:
          type: string
          nullable: true
          description: App Store 商品 ID。验单按票据 product_id 映射本列。种子为占位编码（tata.membership.month 等），上架前换成 Connect 正式 ID。
        play_product_id:
          type: string
          nullable: true
          description: Google Play 商品 ID。未配置为 null。
        price_amount_minor:
          type: integer
          format: int64
          nullable: true
          description: 单位分。种子已填设计价；未配置为 null。
        price_currency:
          type: string
          nullable: true
          description: 币种，如 CNY。未配置为 null。
        quota_grant:
          type: integer
          nullable: true
          description: 会员开通赠送和额度补充包入账的额度，都进 quota_balance。未配置为 null，不编造。年运和牌组必须为 null。
        period_unit:
          type: string
          description: 订阅周期单位，如 month、year。消耗型为空。
        period_count:
          type: integer
          nullable: true
          description: 周期数量。未配置为 null。
        copy:
          type: string
          description: 价位附带运营文案。年卡用于专属活动权益。空字符串表示未定稿。
        enabled:
          type: boolean
          description: 是否对 App 上架。目录只返回启用的。
        unit:
          type: string
          example: quota
          description: 发放单位 quota。
        display_label:
          type: string
          example: 额度
          description: UI 展示名。
        benefits:
          type: array
          description: 订阅 SKU 的权益结构。followup.count 取 quota_settings.followup_limit（种子 5）。年卡 campaign_perk.body 取本行 copy。消耗包为空数组。
          items:
            $ref: "#/components/schemas/SKUBenefit"
