  /api/app/v1/readings:
    get:
      tags: [占卜解读]
      operationId: appListReadings
      summary: 我的占卜列表
      description: |
        已登录按 user_id。未登录用 device_id。不含已删除。按 id 降序。
        游标分页：limit 默认 20、上限 100；用 next_cursor 作为下一页的 before_id。可按 type 过滤。
        每条带 conversation_type（daily / moment / theme）与 conversation_label，以及按对话类型区分的 stage / stage_label；
        同时保留原 status / progress / continue / status_label。daily 另带 target（today/tomorrow）与 business_date。

        App 区分入口（必读）：
        - type 只有 normal / tarotist / explore / daily 四种；explore 一种 type 覆盖两个探索入口。
        - 此刻抉择：type=explore 且 conversation_type=moment（conversation_label=此刻抉择；theme_key 为 yes_or_no 或 either_or）。
        - 主题占卜：type=explore 且 conversation_type=theme（conversation_label=主题占卜；theme_key 为其余探索主题）。
        - 不要用 type==explore 单独判断是哪一种；moment 还可能是普通占卜/占卜师，需同时看 type。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: before_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 只返回 id 小于该值的记录。非正数返回「before_id 不正确」。
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [normal, tarotist, explore, daily]
          description: 非法值返回「type 不正确」。
      responses:
        "200":
          description: data 为分页对象 ReadingPage。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [占卜解读]
      operationId: appCreateReading
      summary: 创建占卜
      description: |
        状态从 QUESTION_CREATED 开始。问题最长 200 个码点。
        登录用户的 normal / tarotist 在此按共享优先级扣 play；塔罗师首次可走 ai_trial。
        explore 不在此扣费（quota_outcome=deferred）。未登录不预扣（quota_outcome=anonymous）。
        额度不足时仍 code=0，记录保留，paywall 或 quota_cost_unconfigured 在 data 里，不编造单价。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadingBody"
            examples:
              成功:
                summary: 创建普通占卜
                value:
                  question: 我最近的工作运势如何？
                  type: normal
      responses:
        "200":
          description: code=0 时 data 为 ReadingCreated。幂等重放会原样返回首次包络。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingCreatedOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}:
    get:
      tags: [占卜解读]
      operationId: appGetReading
      summary: 占卜详情（进度 + 对话）
      description: |
        一次返回进度与对话。data 在 Reading 之上带 reading_id、messages、has_more。
        不传 limit（或 ≤0）时 messages 从 offset 起给剩余全部。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
        - name: limit
          in: query
          required: false
          schema: {type: integer}
          description: 对话分页条数。空或 ≤0 表示从 offset 起返回剩余全部。
        - name: offset
          in: query
          required: false
          schema: {type: integer}
          description: 对话已看过的条数。首页用 0。
      responses:
        "200":
          description: 不属于当前用户、已删除或不存在时为业务错误。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingDetailOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [占卜解读]
      operationId: appDeleteReading
      summary: 删除占卜
      description: 软删除。未登录返回「登录后才能删除」。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data=true。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoolOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/spread:
    post:
      tags: [占卜解读]
      operationId: appSelectSpread
      summary: 选择牌阵
      description: 仅 QUESTION_CREATED 可进入 SPREAD_SELECTED。牌阵必须启用。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadSelectBody"
            examples:
              成功:
                summary: 选择时间流
                value:
                  spread_id: 1
      responses:
        "200":
          description: 成功 data 为 Reading。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/interpret:
    post:
      tags: [占卜解读]
      operationId: appInterpret
      summary: 生成解读
      description: |
        explore 允许问题为空（主题占卜无提问环节）；空问题时按所选主题分类与牌阵解读，不回写 question。登录用户先过 play 门槛。
        生成前必须已登录、牌面已固定、额度已结算。未绑定供应商会把状态写成 FAILED_RETRYABLE。
        失败文案「解读失败，可重试，未重新扣费」。无请求体。
        生成会先落成 ai_jobs 任务，不绑 HTTP 连接。App 退出后任务继续；再进来用 GET /readings/{id}：INTERPRETING 为进行中（interpretation 可能是片段），COMPLETED 为全文。未完成可再调 `/interpret/stream` 续听，不会重扣费。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功 data 为完成后的 Reading。额度拦截为 QuotaBlockEnvelope。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/interpret/stream:
    post:
      tags: [占卜解读]
      operationId: appInterpretStream
      summary: 生成解读（SSE 流式）
      description: |
        与 interpret 相同的额度门槛与落库，但以 SSE 逐段下发。无请求体。
        额度拦截在切流之前，仍返回普通 JSON 的 QuotaBlockEnvelope。先创建后台任务再推流：SSE 断开不会取消生成。
        通过后 Content-Type 为 text/event-stream，
        事件：delta（data:{"text":"片段"}，多次；重连第一条可能是已生成片段）、done（data:{"reading":Reading}）、error（data:{"message":"..."}）。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: 成功为 text/event-stream；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaBlockEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/followups:
    post:
      tags: [占卜解读]
      operationId: appFollowup
      summary: 追问
      description: |
        continuation 必填。false 时新建 normal 占卜。
        true 时记录类型须为 normal、explore、daily、tarotist，且解读已完成、牌面已固定。
        未登录在延续追问时被拒绝。登录后按 followup:{turn} 扣费，不够则 QuotaBlockEnvelope，并把追问文本记在 resume_payload。
        每条解读追问次数受 quota_settings.followup_limit 限制（种子 5，null 不限制）；超限返回「本条解读追问已达上限」。
        含「别这样说」或「不舒服」会关掉照野调侃。模型失败不重复扣费。气泡最多 4 条。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowupBody"
            examples:
              成功:
                summary: 追问
                value:
                  text: 能再详细说说吗？
                  continuation: true
      responses:
        "200":
          description: 延续追问、新建占卜，或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/FollowupOKData"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/followups/stream:
    post:
      tags: [占卜解读]
      operationId: appFollowupStream
      summary: 追问（SSE 流式）
      description: |
        仅支持延续追问（continuation 必须为 true）。额度/轮次/扣费与非流式一致；额度拦截返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream，事件：delta（data:{"text":"片段"}）、done（data:{"followup":FollowupOKData}）、error（data:{"message":"..."}）。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowupBody"
            examples:
              成功:
                summary: 追问
                value:
                  text: 能再详细说说吗？
                  continuation: true
      responses:
        "200":
          description: 成功为 text/event-stream；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaBlockEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/readings/{id}/workflow:
    post:
      tags: [占卜解读]
      operationId: appWorkflow
      summary: 按步骤跑工作流
      description: |
        请求体可空。detect 只做本地检测，不调用模型。recommend 返回「正式推荐未配置」，不指定牌阵，不调用模型。rewrite 仍走绑定。这三步不落库。
        interpret / tarotist 在牌面已固定时调用 generate，会写解读并扣已有额度规则。
        未知步骤记在 step.error，不让整个请求失败。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowBody"
            examples:
              成功:
                summary: 默认步骤
                value: {}
      responses:
        "200":
          description: code=0 时 data 含 reading 与 steps。
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - $ref: "#/components/schemas/SuccessMeta"
                      - type: object
                        properties:
                          data:
                            $ref: "#/components/schemas/AppWorkflowResult"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/daily:
    post:
      tags: [每日一牌]
      operationId: appDaily
      summary: 今日或明日一牌
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        必须登录。同一用户、同一 business_date 已有牌面则 code=1，reused=true，charged=false，不重复扣费。
        否则按共享优先级扣 play（不允许塔罗师试用）。单价未配置、额度不足或请开通会员为 QuotaBlockEnvelope。
        扣费成功后：请求带了 `cards`（1 张）则用 App 交上的牌；否则服务端抽一张，再生成解读。
        生成失败仍 code=0，返回已固定牌面、可能为 FAILED_RETRYABLE 的记录。
        JSON 等完整解读；打字机请用 `/daily/stream`，或本接口加 `Accept: text/event-stream` / `?stream=1`。
        解读走后台任务。App 退出后再进：GET /readings/{id} 或再调 `/daily`（已有牌面则 reused，COMPLETED 直接返回）。
        成功/复用记录带首页卡字段：card_name、short_text、yi（可空）、card_thumbnail（有牌则必有 URL，未配正式图时为内置默认牌背）、target、business_date、has_result。不编造宜忌文案。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyBody"
            examples:
              成功:
                summary: 今日一牌
                value:
                  target: today
              客户端交牌:
                summary: App 抽好后上传牌面
                value:
                  target: today
                  cards:
                    - name: 愚者
                      orientation: upright
                      position: 1
                      position_name: 今日
                      card_id: 0
      responses:
        "200":
          description: 新结果、复用或额度拦截。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadingOK"
                  - $ref: "#/components/schemas/DailyReuseEnvelope"
                  - $ref: "#/components/schemas/QuotaBlockEnvelope"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/daily/stream:
    post:
      tags: [每日一牌]
      operationId: appDailyStream
      summary: 今日或明日一牌（SSE 流式）
      description: |
        与 daily 相同的登录、扣费、抽牌与复用规则。额度拦截仍返回普通 JSON 的 QuotaBlockEnvelope。
        通过后 Content-Type 为 text/event-stream：
        - `delta`：`data: {"text":"增量片段"}`，多次。
        - `done`：`data: {"reading": Reading}`；复用已完成记录时带 `"reused": true`，无 delta。
        - `error`：`data: {"message":"..."}`，生成失败（已置 FAILED_RETRYABLE，未重新扣费）。
      parameters:
        - $ref: "#/components/parameters/Authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyBody"
            examples:
              成功:
                summary: 今日一牌
                value:
                  target: today
      responses:
        "200":
          description: 成功为 text/event-stream；额度拦截为 application/json 的 QuotaBlockEnvelope。
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流：每个事件形如 event 行 + data 行（JSON），空行分隔。"
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaBlockEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/calendar:
    get:
      tags: [每日一牌]
      operationId: appCalendar
      summary: 日历
      description: |
        必须登录。data 为 {days, cycle, tomorrow_date}。days 只含未删除且 business_date 非空的记录。
        month 按前缀匹配，例如 2026-10。type 可按 normal/tarotist/explore/daily 过滤。
        日详情字段与定稿 574:2 对齐：今日一牌含牌名/正逆位/短文/缩略图；普通占卜含多张缩略图；占卜师含姓名与头像；时分取 created_at。
        不返回完整牌面 JSON 与解读正文，短文从 interpretation 截取，不编造。
      parameters:
        - $ref: "#/components/parameters/Authorization"
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: "2026-10"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [normal, tarotist, explore, daily]
      responses:
        "200":
          description: data 为日历条目，含日详情预览字段。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CalendarView"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/explore/topics:
    get:
      tags: [探索]
      operationId: appExploreTopics
      summary: 探索目录
      description: |
        公开，不需要登录。普通占卜牌阵走 GET /spreads，不在这里。
        不传 theme_key：返回 11 个主题摘要（themes，不含 spreads）。
        传 theme_key：返回该主题详情（含 spreads[].quick_questions / positions）。未知键返回「探索主题不存在」。
        Yes or No / 二选一等入口的快捷预设问题取自对应主题的 quick_questions，不走 GET /preset-questions。
      parameters:
        - name: theme_key
          in: query
          required: false
          schema:
            type: string
            enum: [yes_or_no, either_or, relationship, communication, career, study, interpersonal, shopping, outfit, wellbeing, inner]
          description: 探索主题键。省略则返回主题列表。
      responses:
        "200":
          description: 列表时 data 为 ExploreTopics；带 theme_key 时 data 为 ExploreTheme。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessMeta"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/ExploreTopics"
                          - $ref: "#/components/schemas/ExploreTheme"
  /api/app/v1/redeem:
    post:
      tags: [钱包兑换]
      operationId: appRedeem
      summary: 兑换码核销
      parameters:
        - $ref: "#/components/parameters/Authorization"
      description: |
        必须登录。成功时按码的 kind 写入统一额度或免费次数。
        无效码 message=兑换码无效；已核销=兑换码已使用；过期=兑换码已过期。到账数量以账本为准。
      requestBody:
