services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tata
      POSTGRES_PASSWORD: tata
      POSTGRES_DB: tata
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tata -d tata"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
