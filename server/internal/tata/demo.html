<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>塔塔接口演示</title>
<style>
body{font:14px/1.5 -apple-system,sans-serif;max-width:820px;margin:24px auto;padding:0 16px}
button,input{font:inherit;margin:4px 4px 4px 0}
pre{background:#f6f4ef;padding:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>接口演示</h1>
<p>这不是 App 客户端。用来走通邮箱登录、设备占卜和解读。后台在 <a href="/admin">/admin</a>。</p>
<input id="device" placeholder="device_id" value="demo-device">
<input id="email" placeholder="邮箱" value="demo@tata.local">
<input id="code" placeholder="邮箱验证码">
<button id="send">发验证码</button>
<button id="login">登录</button>
<button id="flow">未登录抽时间流</button>
<pre id="out"></pre>
<script>
let token=''
const out = document.querySelector('#out')
function device(){ return document.querySelector('#device').value.trim() }
function log(v){ out.textContent = typeof v==='string'? v : JSON.stringify(v,null,2) }
async function api(path, opt={}){
  const headers={'Content-Type':'application/json'}
  if(token) headers.Authorization='Bearer '+token
  const res = await fetch(path, {method:opt.method||'GET', headers, body: opt.body? JSON.stringify(opt.body): undefined})
  const body = await res.json()
  if(body.code!==0) throw new Error(body.message||'失败')
  return body.data
}
document.querySelector('#send').onclick = async () => {
  try{
    const email = document.querySelector('#email').value
    const data = await api('/api/app/v1/auth/email/code', {method:'POST', body:{email, scene:'login'}})
    log(data)
  }catch(err){ log(err.message) }
}
document.querySelector('#login').onclick = async () => {
  try{
    const data = await api('/api/app/v1/auth/login', {method:'POST', body:{
      email: document.querySelector('#email').value,
      code: document.querySelector('#code').value,
      device_id: device(),
    }})
    token = data.accessToken
    log(data)
  }catch(err){ log(err.message) }
}
document.querySelector('#flow').onclick = async () => {
  try{
    const q = 'device_id='+encodeURIComponent(device())
    const spreads = await api('/api/app/v1/spreads')
    const groups = spreads.groups || []
    const list = groups.flatMap(g => g.items||g.spreads||[]) 
    const spread = list.find(s => s.name==='时间流') || list[0] || (Array.isArray(spreads)? spreads[0]: null)
    if(!spread) throw new Error('没有可用牌阵')
    const created = await api('/api/app/v1/readings', {method:'POST', body:{question:'接下来三个月工作怎么选', type:'normal', device_id: device(), draw_mode:'normal'}})
    const selected = await api('/api/app/v1/readings/'+created.id+'/spread?'+q, {method:'POST', body:{spread_id: spread.id, draw_mode:'normal'}})
    log({spread: spread.name, created, selected_status: selected.status, note:'洗牌抽牌在客户端完成；解读需要登录'})
  }catch(err){ log(err.message) }
}
</script>
</body>
</html>
