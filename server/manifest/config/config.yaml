server:
  address: ":8080"
  dumpRouterMap: false
  openapiPath: ""

database:
  default:
    link: "pgsql:tata:tata@tcp(127.0.0.1:54329)/tata?sslmode=disable"
    debug: false

redis:
  default:
    address: "127.0.0.1:63799"
    db: 0

# 个推（GeTui）。enabled=false 或凭证空时只落站内信、不真连个推。
getui:
  enabled: false
  appId: ""
  appKey: ""
  appSecret: ""
  masterSecret: ""
  baseUrl: "https://restapi.getui.com"

# 邮箱验证码。163 SSL SMTP：host=smtp.163.com，port=465。password 填客户端授权码。
mail:
  enabled: false
  host: "smtp.163.com"
  port: 465
  username: ""
  password: ""
  from: ""
  fromName: "塔塔"

# 微信登录。iOS / Android 共用开放平台同一个移动应用。
# enabled=false 或凭证空时返回「微信登录未配置」。
wechat:
  enabled: false
  appId: ""
  appSecret: ""

# 苹果登录，仅 iOS。clientId 为 Bundle ID。安卓没有苹果三方登录。
# enabled=false 或 clientId 空时返回「苹果登录未配置」。
apple:
  enabled: false
  clientId: ""

# 图片上传。driver=local 写本机；driver=oss 传到阿里云 OSS。
upload:
  driver: local
  localDir: "./uploads"
  oss:
    endpoint: ""
    bucket: ""
    accessKeyId: ""
    accessKeySecret: ""
    prefix: "uploads"
    publicBaseUrl: ""
